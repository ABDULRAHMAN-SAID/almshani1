.ovl-card{ position:relative; width:min(780px,100%); max-height:calc(100dvh - var(--ovl-top, 0px) - 32px); overflow:auto; background:linear-gradient(180deg, rgba(22,46,112,.97), rgba(9,21,58,.98)); border:1px solid rgba(201,211,232,.26); border-radius:26px; padding:22px 28px 22px; box-shadow:0 30px 90px rgba(0,0,0,.6); text-align:center; animation:fadeIn .2s ease both }
.ovl-card h2.disp{ font-size:clamp(28px,3.4vw,46px); margin-bottom:10px }
.ovl-card p.muted{ font-size:clamp(15px,1.1vw,18px) }
.ovl-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:18px }
/* the answer card: calm; a correct answer is gold, a wrong one silver */
.ovl-res.cheer .ovl-card{ border-color:var(--tc); background:radial-gradient(90% 60% at 50% 0%, rgba(242,193,78,.2), transparent 70%), linear-gradient(180deg, rgba(22,46,112,.97), rgba(9,21,58,.98)); box-shadow:0 0 0 1px var(--tc), 0 0 70px color-mix(in srgb, var(--tc) 35%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.ovl-res.cheer{ background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 12%, rgba(4,9,26,.64)), rgba(4,9,26,.8)) }
.res-top{ display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap }
.res-head{ display:flex; flex-direction:column; align-items:center; gap:6px }
.res-t{ font-family:var(--f-disp); font-weight:700; font-size:clamp(40px,min(5.2vw,9.4vh),100px); line-height:1.1; color:var(--gold); text-shadow:0 8px 40px rgba(242,193,78,.4) }
.is-no .res-t{ color:var(--silver); text-shadow:none; font-size:clamp(34px,min(4.4vw,8vh),84px) }
.res-sd{ display:inline-flex; align-items:center; gap:6px; padding:2px 14px; border-radius:99px; background:rgba(242,193,78,.16); color:var(--gold); font-weight:700; font-size:clamp(15px,1.1vw,18px) }
.res-team{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:clamp(19px,min(1.5vw,2.6vh),28px); flex-wrap:wrap }
.res-name{ font-weight:700 }
.res-for{ color:var(--silver) }
.plus-tag{ display:inline-flex; align-items:center; gap:.3em; padding:3px 14px 1px; border-radius:99px; background:linear-gradient(180deg,#ffe08a,#e2a82c); color:#241500; font-weight:700; line-height:1.35 }
.plus-tag bdi{ font-family:var(--f-num); font-size:1.25em; line-height:1 }
.rev-tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:99px; background:rgba(124,196,255,.14); color:var(--flood); font-size:15px; font-weight:600 }
.rev-tag .ic{ width:14px; height:14px }
.learn{ margin-top:14px; display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-radius:16px; background:rgba(6,13,36,.55); border:1px solid var(--line) }
.learn-w{ display:flex; justify-content:center; align-items:center; gap:10px 14px; flex-wrap:wrap }
.learn.miss{ border-color:rgba(47,208,122,.45); background:rgba(47,208,122,.07) }
.learn-h{ display:flex; align-items:center; justify-content:center; gap:6px; color:var(--good); font-weight:700; font-size:clamp(15px,min(1.2vw,2.2vh),20px) }
.learn-h .ic{ width:1.1em; height:1.1em }
.lw{ font-size:clamp(26px,min(3vw,5.4vh),52px); font-weight:700; line-height:1.2 }
.la{ font-size:clamp(20px,min(2.1vw,3.8vh),36px); color:var(--silver); font-weight:500 }
.pos{ font-size:15px; padding:2px 10px; border-radius:99px; background:rgba(201,211,232,.12); color:var(--silver) }
.learn-s{ font-size:clamp(16px,min(1.7vw,3vh),28px); color:var(--silver); line-height:1.5 }
.learn-s mark{ background:rgba(242,193,78,.2); color:var(--gold); padding:0 .25em; border-radius:6px; font-weight:600 }
.learn.m5l{ display:grid; grid-template-columns:1fr; gap:4px; text-align:start }
.lp{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:12px; align-items:center; padding:3px 10px; border-radius:10px; background:rgba(255,255,255,.04) }
.lp .lw{ font-size:clamp(17px,min(1.5vw,2.7vh),26px); text-align:left; overflow-wrap:anywhere; min-width:0 }
.lp .la{ font-size:clamp(16px,min(1.4vw,2.5vh),24px); text-align:start; overflow-wrap:anywhere; min-width:0 }
.res-av .av.xxl{ width:clamp(80px,min(8vw,13vh),118px); height:clamp(80px,min(8vw,13vh),118px); font-size:clamp(30px,min(3vw,5vh),44px) }
.is-no .res-av .av{ filter:saturate(.5) brightness(.9) }
.ovl-card.pz, .ovl-card.toss-card{ width:min(640px,100%) }
.ovl-card.pz p{ margin-bottom:6px }
/* «تعادل! سؤال حاسم» and «حُسم التعادل» (sudden death on the match screen) */
.ovl-card.sd-card{ width:min(820px,100%); border-color:rgba(242,193,78,.75); background:radial-gradient(110% 80% at 50% 0%, rgba(242,193,78,.22), rgba(19,41,106,.97) 62%, rgba(9,21,58,.98)); box-shadow:0 0 0 1px rgba(242,193,78,.3), 0 0 60px rgba(242,193,78,.18), 0 30px 90px rgba(0,0,0,.6) }
.sd-card h2{ display:flex; align-items:center; justify-content:center; gap:12px; font-family:var(--f-disp); font-weight:700; font-size:clamp(34px,4.2vw,64px); line-height:1.2; color:var(--gold) }
.sd-card h2 .ic{ width:1em; height:1em }
.sd-card .sd-what{ font-size:clamp(17px,1.4vw,24px); color:var(--white); margin:6px 0 14px }
.sd-card .nchips{ margin:4px 0 12px }
.sd-card .sd-rule{ color:var(--silver); font-size:clamp(15px,1.1vw,18px); line-height:1.7; max-width:640px; margin:0 auto; text-wrap:balance }
.sd-card .sd-rule .muted{ display:block }
.sd-card .sd-out{ color:var(--silver); font-size:clamp(15px,1.1vw,18px); margin-bottom:8px }
.sd-card.won h2{ color:var(--good) }
/* «قرعة الترتيب»: two flat name cards; the result is revealed calmly (a short fade), 1st gets a gold hairline (nothing spins or flips) */
.ts-pair{ list-style:none; margin:16px 0 4px; padding:0; display:grid; grid-template-columns:minmax(0,1fr) 3.2em minmax(0,1fr); align-items:stretch; gap:10px }
.ts-p{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:150px; padding:16px 12px 14px; border-radius:18px; background-color:rgba(6,13,36,.55); border:1px solid color-mix(in srgb, var(--tc) 50%, rgba(201,211,232,.2)); min-width:0; transition:opacity .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease }
.ts-p b{ font-size:clamp(17px,1.4vw,21px); line-height:1.3; max-width:100%; overflow-wrap:anywhere }
.ts-p .tag{ font-size:1rem; padding:2px 14px }
.ts-or{ align-self:center; text-align:center; color:var(--muted); font-weight:600; font-size:1.05rem }
.ts-pair.drawing .ts-p{ opacity:.45 }
.ts-p .tag.ts-ph{ visibility:hidden } /* the room of «الأول» / «الثاني»: the card never changes size */
/* the result is written into the same nodes: both cards come back from .45 and 1st takes its gold hairline with a
   short transition; only the new «الأول» / «الثاني» tags fade in */
.ts-pair.done .ts-p .tag{ animation:fadeUp .2s ease both }
.ts-p.first{ border-color:var(--gold); background-color:rgba(242,193,78,.1); box-shadow:0 0 0 1px rgba(242,193,78,.35) }
.ts-wait{ min-height:1.7em; margin:0; color:var(--gold); font-weight:600; font-size:1.05rem }
/* modal */
.modal-bg{ position:fixed; inset:0; z-index:80; background:rgba(4,9,26,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease both }
.modal{ width:min(560px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg,#16307a,#0b1a45); border:1px solid rgba(201,211,232,.26); border-radius:22px; padding:22px 24px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:fadeIn .2s ease both }
.modal.wide{ width:min(760px,100%) }
.modal h3{ display:flex; align-items:center; gap:10px; font-family:var(--f-disp); font-weight:600; font-size:1.4rem; margin-bottom:12px }
.modal h3 .ic{ color:var(--flood); width:24px; height:24px }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px }
.confirm-t{ font-size:1.08rem; line-height:1.7 }
.rev-box{ display:flex; flex-direction:column; gap:8px; border-inline-start:4px solid var(--tc); padding-inline-start:14px }
.rev-now{ font-size:1.15rem }
.rev-now .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.bk{ display:grid; gap:18px }
.bk section{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:var(--r); background:rgba(6,13,36,.45); border:1px solid var(--line) }
.bk h4{ font-size:1.05rem }
.bk textarea, textarea.mono{ width:100%; border-radius:12px; border:1px solid var(--line); background:rgba(6,13,36,.7); padding:10px; resize:vertical; min-height:90px; font-size:1rem }
.file-btn{ position:relative; cursor:pointer }
.file-btn:focus-within{ outline:3px solid var(--flood); outline-offset:3px }
/* storage warning (autosave unavailable / failed) */
.warn-bar{ position:relative; z-index:6; display:flex; align-items:center; justify-content:center; gap:10px 14px; flex-wrap:wrap; padding:8px var(--gutter); background:rgba(255,181,71,.15); border-bottom:1px solid rgba(255,181,71,.5); color:#ffe2b8; font-size:.95rem; line-height:1.5; text-align:center }
.warn-bar > .ic{ color:var(--warn) }
.warn-bar .btn{ min-height:38px; padding:.3em .9em; font-size:.95rem }
html.in-match .warn-bar{ display:none }
.tool.warn{ color:var(--warn); border-color:rgba(255,181,71,.5) }
/* toasts */
#toasts{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(560px, calc(100% - 32px)) }
.toast{ padding:10px 18px; border-radius:14px; background:rgba(11,26,69,.97); border:1px solid var(--line); box-shadow:var(--shadow); animation:fadeUp .2s ease both; font-weight:500; text-align:center; transition:opacity .2s, transform .2s }
.toast.good{ border-color:rgba(47,208,122,.6) } .toast.bad{ border-color:rgba(255,90,106,.65) }
.toast.out{ opacity:0; transform:translateY(8px) }
#toasts{ left:auto; right:auto; inset-inline-end:max(16px, env(safe-area-inset-left)); transform:none; bottom:calc(84px + env(safe-area-inset-bottom)); align-items:flex-start; width:min(440px, calc(100% - 32px)) }
.toast{ text-align:start }

/* ============ end of a match ============ */
.v-ft{ padding-top:clamp(18px,4vh,40px); display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center }
.ft-head h1{ font-size:clamp(34px,4vw,54px) }
.ft-head p{ color:var(--silver); font-size:clamp(16px,1.3vw,20px) }
.v-ft .tbl-wrap{ width:min(980px,100%) }
.tie-card, .out-card{ width:min(980px,100%); display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 22px; border-radius:24px; text-align:center }
.tie-card{ background:radial-gradient(120% 160% at 50% 0%, rgba(242,193,78,.24), rgba(19,41,106,.94) 60%); border:1px solid rgba(242,193,78,.75); box-shadow:0 0 0 1px rgba(242,193,78,.25), 0 0 50px rgba(242,193,78,.18); animation:fadeIn .2s ease both }

.out-card h2{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; font-size:clamp(21px,2vw,30px); line-height:1.45 }

.nchips{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px }

.ft-demo{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap }

.ft-tbl{ width:min(860px,100%) }
.ft-rounds{ width:100%; border-collapse:collapse; min-width:480px }
.ft-rounds th{ padding:10px; font-weight:500; color:var(--silver); font-size:15px; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35) }

.ft-rounds tr:last-child td{ border-bottom:0 }
.ft-rounds tr.sd td{ background:rgba(242,193,78,.06) }
.ft-rounds td.rno{ font-family:var(--f-num); font-size:1.3rem; color:var(--muted); width:40px }
.ft-rounds tr.sd td.rno{ color:var(--gold); font-family:var(--f-ui); font-size:15px; font-weight:700; white-space:nowrap }
.ft-rounds td.rt{ text-align:start; white-space:nowrap }
.cat-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--cc); margin-inline-end:8px }
.ft-rounds td.ok, .ft-rounds td.no{ white-space:nowrap }
.rc{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; margin-inline-end:8px; vertical-align:middle }
.rc .ic{ width:15px; height:15px }
td.ok .rc{ background:var(--good); color:#032012 } td.no .rc{ background:rgba(255,90,106,.25); color:var(--bad) }
.rw{ font-weight:500 }
.ft-rounds small{ display:inline-block; margin-inline-start:6px; color:var(--muted); font-size:15px }
.rev-s{ color:var(--flood)!important }
.ft-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px }
.ft-rounds th bdi{ font-weight:600; color:var(--white) }

/* ============ ceremony ============ */

.champ-title{ font-family:var(--f-disp); font-weight:700; font-size:clamp(28px,3.6vw,52px); color:var(--gold); line-height:1.2 }
.champ-actions{ display:flex; gap:10px; flex-wrap:wrap }
.cer{ position:relative; z-index:1; width:min(1200px,100%); display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.3vh,18px); text-align:center }

.champ-title{ font-size:clamp(28px,min(3.6vw,5.8vh),54px) }
.pod.p0 .av.xxl{ width:clamp(76px,min(8vw,11.5vh),118px); height:clamp(76px,min(8vw,11.5vh),118px); font-size:clamp(28px,min(3vw,4.4vh),44px) }
.pod .av.xl{ width:clamp(56px,min(6vw,8.8vh),84px); height:clamp(56px,min(6vw,8.8vh),84px); font-size:clamp(21px,min(2.2vw,3.3vh),31px) }

.podium{ list-style:none; margin:4px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end; gap:clamp(10px,1.6vw,22px); width:min(1000px,100%) }
.pod{ display:flex; flex-direction:column; align-items:center; min-width:0 }

.pod-who .medal{ width:clamp(34px,min(4.2vw,5.4vh),58px); height:auto; margin-bottom:-14px; position:relative; z-index:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)) }

.pod-who b{ font-size:clamp(17px,1.6vw,24px); line-height:1.3; max-width:100%; overflow-wrap:anywhere }
.pod.p0 .pod-who b{ font-size:clamp(20px,2vw,30px); color:var(--gold) }
.pod-c{ font-family:var(--f-num); font-size:1.3rem; line-height:1; padding:3px 12px 0; border-radius:99px; background:var(--tc); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35) }
.pod-who small{ color:var(--silver); font-size:.95rem }
.pod-step{ width:100%; display:flex; flex-direction:column; align-items:center; gap:0; padding-top:8px; border-radius:14px 14px 4px 4px; border-top:1px solid rgba(255,255,255,.75); box-shadow:0 12px 28px rgba(0,0,0,.28); animation:fadeIn .2s ease both }
.pod.p0 .pod-step{ height:clamp(80px,13vh,180px); background:linear-gradient(180deg,#f6cf66,#e2a82c) }

.congrats .ic{ color:var(--gold); width:22px; height:22px } .congrats b{ font-family:var(--f-num); font-size:1.35em; font-weight:600; line-height:1 }
.promise{ color:var(--gold); font-weight:500; font-size:clamp(15px,1.3vw,19px) }
.champ-actions{ justify-content:center; margin-top:4px }

/* ============ certificates ============ */
.cert-tools{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; margin:-6px 0 12px }
.v-cert .topbar{ margin-bottom:12px; padding:10px 0 }
.note{ display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:.95rem; border-radius:14px; background:rgba(124,196,255,.1); border:1px solid rgba(124,196,255,.35); max-width:760px }
.note .ic{ color:var(--flood); flex:none }
.cert-wrap{ display:flex; justify-content:center }
.cert{ position:relative; width:min(1100px, 100%, calc((100vh - 210px) * 1.4143)); aspect-ratio:297/210; container-type:inline-size; background:radial-gradient(ellipse at 50% 30%, #fffdf6, #f6f0df 70%, #eee4c8); color:#0b1a45; border-radius:6px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); font-family:var(--f-ui); -webkit-print-color-adjust:exact; print-color-adjust:exact }

.sg-t.n4 .sg-n b, .sg-t.n5 .sg-n b, .sg-t.n6 .sg-n b{ font-size:1.3cqw } .sg-t.n4 .sg-n i, .sg-t.n5 .sg-n i, .sg-t.n6 .sg-n i{ margin-top:.7cqw }
.seal svg{ width:6.5cqw; height:auto; opacity:.9 }
.cert{ width:min(1100px, 100%, calc((100vh - 250px) * 1.4143)); width:min(1100px, 100%, calc((100dvh - 250px) * 1.4143)) }
.cert-pick{ margin:0 auto 12px; justify-content:center } .cert-pick .seg-b{ display:inline-flex; align-items:center; gap:6px } .cert-pick .ic{ width:16px; height:16px }

.cert-name{ font-family:var(--f-ui); font-weight:700; font-size:4.6cqw; line-height:1.1; color:#0b1a45; border-bottom:.2cqw solid #c8931e; padding:0 3cqw .5cqw; max-width:90%; overflow-wrap:anywhere }

/* ============ word bank: the 66 words of the unit (read-only) ============ */
.bank-bar{ display:flex; align-items:center; gap:14px 20px; flex-wrap:wrap; margin-bottom:16px }
.bank-t{ display:flex; flex-direction:column; gap:2px }
.bank-t b{ font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,1.7vw,26px) }
.bank-t span{ color:var(--silver) }
.search{ flex:1; min-width:240px; max-width:520px; margin-inline-start:auto; display:flex; align-items:center; gap:10px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.6) }

.help-types{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }

.ht-cat h3{ display:flex; align-items:center; gap:6px; font-size:1rem; color:var(--white) }
.ht-cat h3 .ic{ color:var(--cc) }
.ht-cat h3 small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.ht-type{ display:flex; flex-direction:column; gap:2px; font-size:.95rem }

.keys{ border-collapse:collapse; width:100% }
.keys td{ padding:6px 8px; border-bottom:1px solid var(--line) }
.keys tr:last-child td{ border-bottom:0 }
kbd{ font-family:var(--f-num); font-size:1rem; padding:1px 8px; border-radius:7px; border:1px solid var(--line); background:rgba(255,255,255,.06); white-space:nowrap }
.help-foot{ text-align:center; margin-top:22px }

/* ============ motion: flat and calm — short opacity fades and small translate slides only (no 3D, no scale, no

@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
@keyframes blink{ 0%,100%{border-color:var(--flood)} 50%{border-color:rgba(124,196,255,.3)} }
@keyframes tcBar{ from{ clip-path:inset(0 0 0 0) } to{ clip-path:inset(0 0 0 100%) } }
@media (prefers-reduced-motion: reduce){

/* ---------- The draw: ONE ceremony for the three classes (10/1 → 10/2 → 10/3), then the board «من مع من» ---------- */
/* the order in which a class's names come out of the pot: A1, B1, A2, B2, … (the groups end as even as possible) */
function drawSeq(d) { if (!d) return []; if (d.direct) return d.direct.map((id) => [id, 'D']); const out = []; for (let i = 0; i < Math.max(d.A.length, d.B.length); i++) { if (d.A[i]) out.push([d.A[i], 'A']); if (d.B[i]) out.push([d.B[i], 'B']); } return out; }

  if (d.direct) return d.direct.length === 3 ? [`${STAGES.second.ar} (مباراة ثلاثية)`, STAGES.final.ar] : [STAGES.final.ar];
  const out = []; ['A', 'B'].forEach((g) => { if (d[g].length >= 3) out.push(`مباراة ${GROUP_AR[g]}`); });
  return out.concat([STAGES.second.ar, STAGES.final.ar]);
}
function drawCol(c, anim) {

  const slot = (id, g) => `<li><button class="dw-n${anim ? '' : ' on'}${S.swapSel === id ? ' sel' : ''}" data-act="swap-pick" data-cls="${c.id}" data-s="${esc(id)}" data-g="${g}" data-k="${k(id)}"${locked ? ' disabled' : ''} aria-pressed="${S.swapSel === id}">${avatar(id)}<bdi dir="auto" title="${esc(pName(id))}">${esc(pName(id))}</bdi></button></li>`;

    : ['A', 'B'].map((g) => `<div class="dw-g"><h3>${GROUP_AR[g]}</h3><ol>${d[g].map((id) => slot(id, g)).join('')}</ol></div>`).join('');

<ol class="dw-order" aria-label="ترتيب اللعب">${playOrder(c).map((x, i) => `<li><b>${i + 1}</b>${esc(x)}</li>`).join('')}</ol></article>`;

/* the ceremony: for each class in turn its present students are sealed tokens in a pot; one name every ≈0.6 s goes into its group */
function dwClassStart(c) {
  const stg = $('#dw-stage'); if (!stg) return;
  stg.style.setProperty('--cc', c.color);
  $('#dw-cls').textContent = c.name;
  $('#dw-pot').innerHTML = drawSeq(c.draw).map((_, k) => `<i class="dw-tok" data-k="${k}"></i>`).join('');
  $('#dw-cap').innerHTML = `<span>قرعة الشعبة <b dir="ltr">${esc(c.name)}</b></span>`;
  $$('.dw-col').forEach((el) => { if (el.dataset.c === c.id) el.classList.remove('wait'); });
  SFX.roll();
}
function dwReveal(c, id, g, k) {
  $$('.dw-n.new').forEach((el) => el.classList.remove('new'));
  const el = $(`.dw-col[data-c="${c.id}"] .dw-n[data-k="${k}"]`); if (el) el.classList.add('on', 'new');
  const tok = $(`#dw-pot .dw-tok[data-k="${k}"]`); if (tok) tok.classList.add('out');
  const cap = $('#dw-cap'); if (cap) { cap.innerHTML = `<span class="dw-where">القرعة: <span dir="ltr">${esc(c.name)}</span>${g === 'D' ? '' : ` · ${GROUP_AR[g]}`}</span><b class="dw-name" dir="ltr">${esc(pName(id))}</b>`; dwFitCap(cap); }
  SFX.pop();
}
/* the drawn name is always shown in full: a name wider than its line gets a smaller type (never «…») */
function dwFitCap(cap) {
  const b = cap && cap.querySelector('b.dw-name'); if (!b) return;
  b.style.fontSize = '';
  const base = parseFloat(getComputedStyle(b).fontSize) || 24;
  for (let f = base; f > 15 && b.scrollWidth > b.clientWidth + 1; ) { f = Math.max(15, f * 0.92); b.style.fontSize = f + 'px'; }
}
function drawDone() {
  clearLater(); if (!S.drawAnim) return;
  S.drawAnim = false; const y = window.scrollY; go('draw'); window.scrollTo(0, y);
  const b = $('#btn-next'); if (b) b.focus({ preventScroll: true });
}
AFTER.draw = () => {
  if (!S.drawAnim) return;
  if (reduced()) { drawDone(); return; }
  let t = dur(500);
  T.classes.forEach((c) => {
    const seq = drawSeq(c.draw); if (!seq.length) return;
    later(() => dwClassStart(c), t); t += dur(800);
    seq.forEach(([id, g], k) => { later(() => dwReveal(c, id, g, k), t); t += dur(620); });
    t += dur(500);

  later(() => { SFX.whistle(); drawDone(); }, t);
};

function wordSplit(el) { // is a word of el's text broken over two lines?
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let t = tw.nextNode(); t; t = tw.nextNode()) {
    const re = /\S+/g; let m;
    while ((m = re.exec(t.data))) { const r = document.createRange(); r.setStart(t, m.index); r.setEnd(t, m.index + m[0].length); if (new Set([...r.getClientRects()].map((x) => Math.round(x.top))).size > 1) return true; }
  }

}

/* ============================ 14. MATCH ENGINE ============================ */
let Q = null; // the live question: { m, idx, st, q, p, intro, secs, answered, paused, sb, m5 }
const TURN_MS = 1300; // the «الآن دور:» card before every question
const TM = { raf: 0, total: 0, left: 0, last: 0, running: false, onEnd: null, sec: -1, speed: 1, fg: null, tx: null, ring: null };
const RING_C = 175.93;
function timerStart(secs, onEnd) {
  timerStop();
  TM.total = secs * 1000; TM.left = TM.total; TM.sec = -1; TM.fg = $('#ring-fg'); TM.tx = $('#ring-t'); TM.ring = $('#ring');
  if (!secs) return;
  TM.onEnd = onEnd; TM.running = true; TM.last = performance.now(); drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function timerTick(now) {
  if (!TM.running) return;
  const dt = Math.min(250, Math.max(0, now - TM.last)); TM.last = now; TM.left -= dt * TM.speed;
  if (TM.left <= 0) { TM.left = 0; TM.running = false; drawTimer(); const f = TM.onEnd; TM.onEnd = null; if (f) f(); return; }
  drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function drawTimer() {
  if (!TM.fg || !TM.tx) return;
  TM.fg.style.strokeDashoffset = (RING_C * (1 - (TM.total ? TM.left / TM.total : 0))).toFixed(2);
  const s = Math.ceil(TM.left / 1000);
  if (s !== TM.sec) { TM.sec = s; TM.tx.textContent = s; const low = s <= 5; TM.ring.classList.toggle('low', low); if (low && s > 0 && TM.running) SFX.tick(); }
}
function timerPause() { if (!TM.running) return; TM.running = false; cancelAnimationFrame(TM.raf); }
function timerResume() { if (TM.running || TM.left <= 0 || !TM.total || !TM.onEnd) return; TM.running = true; TM.last = performance.now(); TM.raf = requestAnimationFrame(timerTick); }
function timerStop() { TM.running = false; cancelAnimationFrame(TM.raf); TM.onEnd = null; }

function curMatch() { return S.matchId ? matchById(S.matchId) : null; }
function persist(m) { if (m && !m.demo) saveT(); }
const timerMult = (m) => (m && m.demo ? 1 : T ? T.settings.timer : 1);
function refreshBoard(m, hit) {
  const w = $('#sb-wrap'); if (!w) return;
  w.innerHTML = scoreboardHTML(m);
  if (hit) hitScore(m, hit);
}
/* a point: the student's number glows gold for a moment (colour only — nothing moves or grows) */
function hitScore(m, pid) {
  const el = $('#sc-' + m.players.indexOf(pid)); if (!el) return;
  el.classList.add('hit'); later(() => { if (document.contains(el)) el.classList.remove('hit'); }, dur(1600));
}
function updateToolbar() {
  const v = $('#tools [data-act="review"]'); if (v) v.disabled = !lastAnswered();
  const say = $('#tools [data-act="say"]'); if (say) say.disabled = !sayable();
  const rv = $('#tools [data-act="reveal"]'); if (rv) rv.disabled = !(Q && !Q.answered && !Q.intro);
  const pz = $('#tools [data-act="pause"]'); if (pz) pz.disabled = !(Q && !Q.answered);
  /* «رتّب الحروف» takes typed letters, so the teacher shortcuts become Shift+letter while it is live */
  const sb = !!(Q && Q.sb && !Q.answered && !Q.intro);
  $$('#tools kbd[data-k]').forEach((kb) => { const k = kb.dataset.k; kb.textContent = (sb && k.length === 1 ? '⇧' : '') + k; });
}
/* a new question (or one uncovered again) ignores input for a moment, so the second tap of a double tap on
   «التالي» / «استئناف» / «ابدأ» can never land on an answer */
const ARM_MS = 450;
function armQ() { if (Q) { Q.armAt = performance.now() + dur(ARM_MS); UI_AT = performance.now(); } }
const qArmed = () => !!Q && !Q.intro && performance.now() >= (Q.armAt || 0);
function unpauseView() { hideLayer('pause'); const vm = $('#vm'); if (vm) vm.classList.remove('is-paused'); }

/* decides what the match view shows next: the next question, a sudden-death card, or the end of the match */
function flow() {
  const m = curMatch(); if (!m || !m.seq) { go(T ? 'hub' : 'home', 'replace'); return; }
  hideLayer('res'); unpauseView();
  if (m.step < m.seq.length) { ask(m); return; }
  Q = null; timerStop(); refreshBoard(m); updateToolbar();
  if (!m.demo && m.sdr.length && S.sdAck !== `${m.id}:${m.sdr.length}`) {
    /* a sudden-death round just ended: if it settled its tie, say so */
    S.sdAck = `${m.id}:${m.sdr.length}`;
    const x = m.sdr[m.sdr.length - 1], part = sdPartition(m).part, flat = [].concat(...part); let s0 = 0, open = false;
    part.forEach((b) => { if (b.length > 1 && x.cut > s0 && x.cut < s0 + b.length) open = true; s0 += b.length; });
    if (!open) {
      let f = m.sdr.length - 1; while (f > 0 && m.sdr[f - 1].cut === x.cut) f--; // the first round of this series holds the whole tied set
      const set = m.sdr[f].set, winners = m.players.filter((id) => set.includes(id) && flat.indexOf(id) < x.cut);
      emptyPanel(); SFX.correct(); showLayer('sdwon', sdWonHTML(m, winners, x.cut));
      announce(`حُسم التعادل: ${winners.map(pName).join(' و')}`); S.resumePaused = false; return;
    }
  }
  const need = m.demo ? null : sdNeed(m);
  if (need) { emptyPanel(); SFX.whistle(); showLayer('sd', sdCardHTML(m, need)); announce(`تعادل — سؤال حاسم بين ${need.set.map(pName).join(' و')}`); S.resumePaused = false; return; }
  finishMatch(m);
}
/* between questions the panel keeps its place (an empty shell of the same size) */
function emptyPanel() { const z = $('#qzone'); if (z) z.innerHTML = '<article class="qp empty" id="qp" aria-hidden="true"></article>'; }
/* every question starts with the turn card («الآن دور:» + the full name); the question and its timer follow */
function ask(m) {
  const st = m.seq[m.step], q = st.q, p = person(st.p);
  Q = { m, idx: m.step, st, q, p: st.p, intro: true, answered: false, paused: false, sb: q.type === 'spell_build' ? { slots: Array(q.len).fill(null) } : null, m5: q.type === 'match5' ? { L: Array(q.items.length).fill(-1), sel: null, drag: null, just: false, reveal: false, rects: null } : null };
  refreshBoard(m);
  Q.secs = qSeconds(q, timerMult(m));
  timerStop();
  $('#qzone').innerHTML = questionHTML(q, { st, secs: Q.secs, card: turnCardHTML(m, st) });
  fitQuestion();
  updateToolbar();
  SFX.turn();
  announce(`الآن دور ${p.name}`);
  if (S.resumePaused) { S.resumePaused = false; pauseGame(true); }
  const tok = Q.tok = uid(); later(() => endTurnCard(tok), dur(TURN_MS));
}
function endTurnCard(tok) {
  if (!Q || !Q.intro || (tok && Q.tok !== tok)) return;
  if (Q.paused || topLayer() || MODAL.open) { later(() => endTurnCard(tok), dur(250)); return; } // the card waits behind a pause / dialog
  Q.intro = false;
  const card = $('#turn-card'); if (card) { card.classList.add('out'); later(() => card.remove(), dur(300)); }
  mountQuestion(); timerStart(Q.secs, onTimeout); armQ(); updateToolbar();
  announce(TYPES[Q.q.type].ar);
}
/* a question whose content is taller than the (fixed) panel gets smaller type INSIDE the panel — the panel never grows */
function fitQuestion() {
  const qp = $('#qp'), body = $('#qp-body'); if (!qp || !body) return;
  qp.classList.remove('fit1', 'fit2');
  for (const c of ['fit1', 'fit2']) { if (body.scrollHeight <= body.clientHeight + 1) break; qp.classList.add(c); }
  fitWho(qp);
}
/* «سؤال: <full name>» shows the whole name: on a narrow screen a long name gets smaller type (the pill keeps its size) */
function fitWho(qp) {
  const b = qp.querySelector('.qp-who b'); if (!b) return;
  b.style.fontSize = '';
  const base = parseFloat(getComputedStyle(b).fontSize) || 15;
  for (let f = base; f > 12 && b.scrollWidth > b.clientWidth + 1; ) { f = Math.max(12, f - 0.5); b.style.fontSize = f + 'px'; }
}
function mountQuestion() { if (Q && Q.m5) { m5Observe(); requestAnimationFrame(() => { m5Measure(); m5Draw(); }); } }
function onTimeout() { if (!Q || Q.answered) return; Q.timedOut = true; submit(false, null); }
function chooseOpt(i) { if (!Q || Q.answered || Q.paused || Q.intro || !qArmed() || !Q.q.opts || Q.q.type === 'match5' || i < 0 || i >= Q.q.opts.length) return; submit(i === Q.q.ans, i); }
function refreshStatus(m) {
  if (!m.seq) { m.status = 'upcoming'; return; }
  if (m.step < m.seq.length || (!m.demo && sdNeed(m))) { m.status = 'live'; m.doneAt = null; return; } // a deciding tie keeps the match open
  m.status = 'done'; if (!m.doneAt) m.doneAt = Date.now();
}
function submit(ok, given) {
  if (!Q || Q.answered || Q.intro) return;
  Q.answered = true; timerStop();
  ok = !!ok;
  const m = Q.m, st = Q.st;
  st.ok = ok; st.g = given === undefined ? null : given; st.to = !!Q.timedOut;
  m.step = Q.idx + 1; m.last = Q.idx; refreshStatus(m); persist(m);

    budget: (types, R, n, words) => { const pool = words ? allEntries().filter((e) => words.includes(e.w)) : tPool(); return matchBudget(types || TYPE_IDS, pool, R, n); },
    buildMatch(n, R, types, usedOrder) {
      const pool = tPool(), feas = feasibleTypes(types || TYPE_IDS, pool), bud = matchBudget(feas, pool, R, n);
      const plan = planLineup(feas, R, bud.ok ? bud.cap : 0), used = new Set(usedOrder || []), rounds = buildRounds(plan, R, pool, used, feas, n);
      return { plan, cap: bud.cap, budget: bud, rounds, used: Array.from(used) };
    },
    /* the questions of the quick try (one of each type) */
    demoQuestions() { startDemo(true); const qs = S.demo ? S.demo.seq.map((x) => x.q) : []; S.demo = null; return JSON.parse(JSON.stringify(qs)); },
    speed(k) { TS.k = k > 0 ? k : 1; return TS.k; },
    saveKey: (id) => tKey(id),
    userInitials: (n) => userInitials(n),
    /* a competition straight from a setup-like object (defaults = the teacher's three classes), drawn and confirmed
       (cfg.ceremony: open the draw ceremony instead of the hub) */
    create(cfg) {
      const s = defaultSetup(); cfg = cfg || {};
      s.classes.forEach((c, i) => { if (!c.text.trim()) c.text = schoolRoster(i); });
      if (cfg.rosters) s.classes.forEach((c, i) => { if (cfg.rosters[i]) c.text = cfg.rosters[i].join('\n'); });
      ['rounds', 'second', 'timer', 'name'].forEach((k) => { if (cfg[k] != null) s[k] = k === 'rounds' ? Object.assign({}, s.rounds, cfg[k]) : cfg[k]; });
      if (cfg.absent) s.classes.forEach((c) => { c.absent = cfg.absent.slice(); });
      if (cfg.ceremony) { newCompetition(s); return T.id; }
      T = createCompetition({ name: s.name, classes: s.classes.map((c) => ({ name: c.name, color: c.color, names: rosterNames(c.text).names, absent: c.absent })), rounds: s.rounds, second: s.second, timer: s.timer });
      drawAll(); T.drawOk = true;
      STORE.conflict = false; saveT(true); S.tab = ''; go('hub'); return T.id;
    },
    /* a class drawn again without the ceremony (absent: names or ids) — only before its first match */
    draw(cid, absent) { const c = classById(cid); if (!c || classStarted(c)) return null; (absent || []).forEach((n) => { const id = byName(n); const s = c.students.find((x) => x.id === id); if (s) s.absent = true; }); T.matches = T.matches.filter((m) => m.cls !== c.id); if (!drawClass(c)) return null; saveT(); return JSON.parse(JSON.stringify(c.draw)); },
    setGroups(cid, A, B) { const c = classById(cid); if (!c) return false; c.draw = { at: Date.now(), A: A.map(byName), B: B.map(byName) }; T.matches = T.matches.filter((m) => m.cls !== c.id); saveT(); return true; },
    swap: (cid, a, b) => { const c = classById(cid); const ok = !!c && swapStudents(c, byName(a), byName(b)); if (ok) { noteEdit(); saveT(); } return ok; },
    /* the next action of a class ('gf' = Grand Final); open → the match id (created); toss → performed */
    next(cid) {
      const nx = cid === 'gf' ? grandFlow().next : classFlow(classById(cid)).next; if (!nx) return null;
      if (nx.kind === 'draw') return { kind: 'draw' };
      if (nx.kind === 'toss') { const o = doToss(nx.key, nx.block); return { kind: 'toss', order: o.slice(), block: nx.block.slice() }; }
      const m = matchById(nx.id) || ensureMatch(nx.step.spec);
      return { kind: nx.kind, id: m.id, players: m.players.slice(), R: m.R, cuts: m.cuts, status: m.status };
    },
    /* plays the regular questions of a match without the UI (same engine calls): pts = points per player (array in
       player order, or {name|id: pts}). A deciding tie leaves the match open for «سؤال حاسم» (VCL.test.sd). */
    sim(id, pts) {
      const m = matchById(id); if (!m || m.seq) return false;
      if (!prepareRounds(m)) return false; startMatch(m);
      const want = {}; m.players.forEach((p, i) => { want[p] = Array.isArray(pts) ? pts[i] || 0 : (pts[p] != null ? pts[p] : pts[pName(p)]) || 0; });
      const got = {}; m.seq.forEach((s) => { got[s.p] = got[s.p] || 0; s.ok = got[s.p] < want[s.p]; if (s.ok) got[s.p]++; s.g = null; s.to = false; });
      m.step = m.seq.length; m.last = m.seq.length - 1; refreshStatus(m);
      if (!T.finishedAt && podiumOf()) T.finishedAt = Date.now();
      saveT(); return true;
    },
    /* the tie a match must break now: { set, k, cut } or null */
    sdNeed(id) { const nd = sdNeed(matchById(id)); return nd ? { set: nd.set.slice(), k: nd.k, cut: nd.cut } : null; },
    /* plays ONE «سؤال حاسم» round without the UI: ok = {name|id: true/false} (missing = wrong) → the round and the state */
    sd(id, ok) {
      const m = matchById(id); if (!m) return null; const nd = sdNeed(m); if (!nd) return null;
      const x = addSdRound(m, nd), j = m.sdr.length;
      m.seq.forEach((s) => { if (s.sd === j) { s.ok = !!(ok[s.p] != null ? ok[s.p] : ok[pName(s.p)]); s.g = null; s.to = false; } });
      m.step = m.seq.length; m.last = m.seq.length - 1; refreshStatus(m);
      if (!T.finishedAt && podiumOf()) T.finishedAt = Date.now();
      saveT();
      return { round: j, set: x.set.slice(), k: x.k, cut: x.cut, types: sdTurns(m, j).map((s) => s.q.type), status: m.status, next: VCL.test.sdNeed(id) };
    },
    flow(cid) {
      const F = cid === 'gf' ? null : classFlow(classById(cid)), strip = (s) => ({ key: s.key, id: s.id, stage: s.stage, slot: s.slot, state: s.state, players: s.players, order: s.res && !s.res.pending ? s.res.order : null, tied: s.res && !s.res.pending ? s.res.tied : null, auto: !!s.auto });
      if (!F) { const G = grandFlow(); return { champs: G.champs, ready: G.ready, step: strip(G.step), podium: G.podium }; }
      return { drawn: !!F.c.draw, groups: F.groups, direct: F.direct, qualified: F.qualified, finalists: F.finalists, champion: F.champion, runnerUp: F.runnerUp, steps: F.steps.map(strip), next: F.next ? { kind: F.next.kind, id: F.next.id || null } : null };
    },
    /* builds an upcoming match from a given lineup of types (screenshots of every type) / puts a match back to unplayed */
    plan(id, types) { const m = matchById(id); if (!m || m.seq) return false; m.R = types.length; const used = new Set(T.used); m.pre = buildRounds(types, m.R, tPool(), used, TYPE_IDS, m.players.length); m.plan = m.pre.map((r) => r.type); m.cap = null; T.used = Array.from(used); saveT(); return m.plan.slice(); },
    unplay(id) { const m = matchById(id); if (!m) return false; Object.assign(m, { seq: null, pre: null, plan: null, sdr: [], step: 0, status: 'upcoming', last: null, startedAt: null, doneAt: null }); T.cur = null; saveT(); return true; },
    resolve: (id) => { const r = resolve(matchById(id)); return r.pending ? { pending: { kind: r.pending.kind, block: r.pending.block || null } } : { order: r.order, tied: r.tied, pts: r.pts }; },
    id: (n) => byName(n),
    name: (id) => pName(id),
  },
};
init();


</script>
