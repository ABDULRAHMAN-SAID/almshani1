.tg legend small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.chk{ display:flex; align-items:center; gap:10px; min-height:40px; cursor:pointer; font-size:.95rem }
.chk input{ width:20px; height:20px; accent-color:#7cc4ff; flex:none }
.unit-checks{ display:flex; flex-direction:column; gap:8px }
.unit-chk{ padding:8px 12px; border-radius:var(--r-s); background:var(--glass-3); border:1px solid var(--line) }
.u-ic{ font-size:1.3rem; line-height:1 }
.u-name{ flex:1; display:flex; flex-direction:column; line-height:1.3 }
.u-en{ font-size:.8rem; color:var(--muted) }
.u-n{ color:var(--muted); font-size:.86rem; white-space:nowrap }
.words-total{ margin-top:12px; font-size:1rem }
.words-total > .bad{ font-size:.9rem }
.words-total > b{ font-family:var(--f-num); font-size:1.6rem; color:var(--gold); vertical-align:-3px }
.budget b{ color:var(--white) }
.words-total .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.st-units > .muted{ margin-top:8px }
.setup-foot{ position:sticky; bottom:12px; display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:20px; padding:12px 16px; border-radius:var(--r-l); background:rgba(8,18,50,.92); border:1px solid var(--line); box-shadow:0 -10px 40px rgba(6,13,36,.8); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); flex-wrap:wrap; z-index:5 }
.setup-err{ flex:1; color:var(--bad); font-weight:500; min-width:200px }
.setup-err:empty{ display:none }

/* ============ draw ============ */
.v-draw{ padding-top:28px; text-align:center }
.draw-head h1{ font-size:clamp(40px,5vw,64px) }
.draw-head .muted{ margin-top:4px }
.draw-foot{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:14px }

/* ============ hub ============ */
.champ-banner{ display:flex; align-items:center; gap:14px; padding:12px 18px; margin-bottom:16px; border-radius:var(--r-l); background:radial-gradient(120% 180% at 100% 0%, rgba(242,193,78,.26), rgba(19,41,106,.85) 55%, rgba(11,26,69,.9)); border:1px solid rgba(242,193,78,.55); box-shadow:0 10px 40px rgba(242,193,78,.12); flex-wrap:wrap }
.champ-banner > .ic{ color:var(--gold) }
.champ-banner svg.crest{ width:44px; height:auto }
.champ-banner div{ flex:1; display:flex; flex-direction:column }
.champ-banner small{ color:var(--gold); font-weight:500 }
.champ-banner b{ font-size:1.35rem }
.hub-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px }
.tabs{ display:flex; gap:4px; padding:4px; border-radius:16px; background:rgba(6,13,36,.65); border:1px solid var(--line); overflow-x:auto; max-width:100%; scrollbar-width:none }
.tab{ position:relative; display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:8px 16px; border-radius:12px; border:0; background:none; color:var(--silver); font-weight:500; white-space:nowrap }
.tab:hover{ color:var(--white); background:rgba(255,255,255,.06) }
.tab.on{ background:var(--navy-2); color:var(--white); box-shadow:inset 0 -2px 0 var(--flood) }
.tab .ic{ width:18px; height:18px }
.hub-meta{ display:flex; gap:14px; color:var(--muted); font-size:.88rem; flex-wrap:wrap }
.hub-meta span{ display:inline-flex; align-items:center; gap:6px }
.hub-meta .ic{ width:16px; height:16px }
.fixtures{ display:flex; flex-direction:column; gap:22px }
.grp-h{ display:flex; align-items:baseline; gap:10px; font-size:1.08rem; margin-bottom:10px; flex-wrap:wrap }
.grp-h small{ font-family:var(--f-num); letter-spacing:.16em; color:var(--flood); font-size:.92rem }
.fx-list{ display:flex; flex-direction:column; gap:10px }
.fx{ display:grid; grid-template-columns:minmax(0,1fr) minmax(150px,auto) minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); transition:border-color .2s, transform .2s }
.fx:hover{ border-color:rgba(124,196,255,.35) }
.fx.st-live, .fx.st-wait, .fx.st-pens{ border-color:rgba(242,193,78,.45); box-shadow:0 0 0 1px rgba(242,193,78,.15) inset }
.fx-t{ display:flex; align-items:center; gap:12px; min-width:0 }
.fx-t.a{ justify-content:flex-end }
.fx-t.b{ justify-content:flex-start }
.fx-t svg{ width:40px; height:auto; flex:none }
.fx-t b{ font-size:1.15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.fx-t.win b{ color:var(--gold) }
.fx-mid{ display:flex; flex-direction:column; align-items:center; gap:4px }
.fx-vs{ font-family:var(--f-num); font-size:1.6rem; color:var(--muted); line-height:1 }
.fx-stage{ font-size:.78rem; color:var(--gold) }
.fx-pens{ display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted) }
.sp{ display:inline-flex; align-items:center; gap:.3em; font-family:var(--f-num); font-variant-numeric:tabular-nums; line-height:1 }
.sp-d{ opacity:.6 }
.fx-sc{ font-size:2rem; font-weight:600 }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:.76rem; font-weight:600; white-space:nowrap; border:1px solid transparent }
.p-up{ background:rgba(201,211,232,.1); color:var(--silver) }
.p-live{ background:rgba(47,208,122,.14); color:var(--good); border-color:rgba(47,208,122,.35) }
.p-live::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite }
.p-wait{ background:rgba(255,181,71,.14); color:var(--warn); border-color:rgba(255,181,71,.35) }
.p-pens{ background:rgba(255,90,106,.14); color:#ff9aa5; border-color:rgba(255,90,106,.35) }
.p-done{ background:rgba(124,196,255,.1); color:var(--flood) }
.tip{ display:flex; align-items:center; gap:8px; margin-top:18px }
.tip .ic{ width:16px; height:16px }
.tbl-wrap{ overflow-x:auto; border-radius:var(--r-l); border:1px solid var(--line); background:var(--glass); -webkit-overflow-scrolling:touch }
.tm-in{ display:flex; align-items:center; gap:10px }
.tm-in svg{ width:30px; height:auto }
.fp{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-family:var(--f-ui); font-size:.78rem; font-weight:700; line-height:1 }
.fW{ background:var(--good); color:#032012 } .fp .ic{ width:14px; height:14px; stroke-width:3 }
.legend{ display:flex; gap:10px 24px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:.85rem }
.legend span{ display:inline-flex; align-items:center; gap:8px }
.locked{ text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:8px }
.locked > .ic{ color:var(--flood); margin-bottom:6px }
.locked h3{ font-size:1.3rem }
.hl-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:16px }
.hl{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--r); background:var(--glass); border:1px solid var(--line) }
.hl-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.06); color:var(--cc); flex:none }
.hl small{ display:block; color:var(--muted); font-size:.8rem }
.hl b{ font-size:1.1rem; margin-inline-end:6px }
.hl-v{ font-family:var(--f-num); font-size:1.4rem; color:var(--cc); line-height:1; padding-top:3px; white-space:nowrap }
.hl-b{ min-width:0; flex:1 }
.hl-n{ display:flex; align-items:center; justify-content:space-between; gap:8px }
.hl-n .tn-g{ font-size:1.02rem }
.stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:14px }
.sc{ position:relative; padding:16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line) }
.sc::before{ background:var(--tc) }
.sc header{ display:flex; align-items:center; gap:10px; margin-bottom:12px }
.sc header svg{ width:36px; height:auto }
.sc header > b{ flex:1; font-size:1.2rem }
.sc-g{ display:flex; flex-direction:column; align-items:center; line-height:1 }
.sc-g b{ font-family:var(--f-num); font-size:1.8rem; font-weight:600 }
.sc-g small{ color:var(--muted); font-size:.75rem }
.bar-row{ display:grid; grid-template-columns:110px 1fr 46px 40px; align-items:center; gap:10px; min-height:34px }
.br-l{ display:flex; align-items:center; gap:6px; font-size:.9rem }
.br-l .ic{ width:16px; height:16px }
.bar-row b{ font-family:var(--f-num); font-size:1.25rem; text-align:center }
.bar-row small{ color:var(--muted); font-size:.78rem }

/* ============ intro ============ */
.v-intro{ padding-top:14px; display:flex; flex-direction:column; gap:14px }
.intro-top{ display:flex; justify-content:space-between; align-items:center }
.intro-head{ text-align:center }
.intro-head h1{ font-size:clamp(26px,3.2vw,42px) }
.faceoff{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px }
.fo{ display:flex; align-items:center; gap:16px; justify-content:flex-end }
.fo.b{ justify-content:flex-end; flex-direction:row-reverse }
.fo svg{ width:clamp(64px,8vh,96px); height:auto; filter:drop-shadow(0 12px 30px color-mix(in srgb, var(--tc) 45%, transparent)); animation:popIn .7s var(--ease) both }
.fo .tn{ align-items:flex-start }
.fo .tn-g{ font-family:var(--f-disp); font-weight:700; font-size:clamp(24px,3vw,42px); line-height:1.15 }
.fo .tn-c{ font-size:clamp(14px,1.4vw,20px) }
.fo .tn.solo .tn-g{ font-family:var(--f-num), var(--f-disp); font-weight:600; font-size:clamp(34px,4.4vw,62px); line-height:1 }
.fo-vs span{ display:grid; place-items:center; width:64px; height:64px; border-radius:50%; font-family:var(--f-num); font-size:1.9rem; color:#241500; background:linear-gradient(180deg,#ffe08a,#e2a82c); box-shadow:0 0 0 6px rgba(242,193,78,.15), 0 10px 30px rgba(242,193,78,.3); padding-top:4px }
.intro-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr); gap:14px; align-items:stretch }
.intro-grid.no-toss{ grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) }
.intro-grid .panel{ padding:16px 18px; display:flex; flex-direction:column; gap:10px }
.intro-grid h3{ display:flex; align-items:center; gap:8px; font-size:1.02rem; font-weight:600; flex-wrap:wrap }
.intro-grid h3 .ic{ color:var(--flood); width:18px; height:18px }
.present{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.92rem }
.chip-btn{ min-height:40px; padding:4px 14px; border-radius:99px; border:2px solid var(--line); background:rgba(6,13,36,.6); font-weight:600 }
.chip-btn.on{ border-color:var(--tc); background:color-mix(in srgb, var(--tc) 22%, transparent) }
.lineup{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; justify-content:center }
.lu{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 6px 8px; min-width:78px; flex:1 1 78px; max-width:110px; border-radius:14px; background:rgba(6,13,36,.55); border:1px solid var(--line); text-align:center }
.lu::before{ inset-inline:12px }
.lu .ic{ color:var(--cc); width:22px; height:22px }
.lu b{ font-size:.86rem; line-height:1.2 }
.lu small{ font-size:.7rem; color:var(--muted); line-height:1.2 }
.lu-r{ font-family:var(--f-num); color:var(--silver); font-size:1rem; letter-spacing:.08em; line-height:1 }
.ip-toss{ align-items:center; text-align:center }
.coin-stage{ position:relative; width:112px; height:124px; perspective:600px; margin:2px auto 0 }
.coin{ position:relative; width:104px; height:104px; margin:0 auto; transform-style:preserve-3d }
.coin.flipping{ transition:transform 1.8s cubic-bezier(.15,.7,.2,1); animation:coinUp 1.8s cubic-bezier(.3,.7,.3,1) }
.coin-face{ position:absolute; inset:0; border-radius:50%; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:radial-gradient(circle at 34% 28%, #ffffff, #d7deee 45%, #8a95b3 100%); border:4px solid #eef2fb; box-shadow:inset 0 0 0 5px rgba(11,26,69,.12), 0 8px 20px rgba(0,0,0,.4) }
.coin-face svg{ width:52px; height:auto }
.coin-face.fb{ transform:rotateY(180deg) }
.coin-shadow{ width:70px; height:10px; margin:6px auto 0; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(4px) }
.toss-res{ min-height:1.6em; font-size:.98rem }
.intro-foot{ display:flex; justify-content:center; padding-bottom:8px }
.split-resume{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px }
.split-resume h2{ font-family:var(--f-disp); font-size:1.6rem }
.split-resume p .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.intro-warn{ display:flex; gap:8px; align-items:flex-start; color:#ffd89a; margin-top:4px }
.intro-warn .ic{ width:16px; height:16px; margin-top:4px; color:var(--warn) }

/* ============ match (broadcast) ============ */
html.in-match, html.in-match body{ overflow:hidden; height:100% }
.v-match{ position:relative; isolation:isolate; height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden }
.pitch{ position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(6,13,36,.35) 0%, rgba(6,13,36,.78) 58%, rgba(6,13,36,.96) 100%),
    radial-gradient(circle at 50% 55%, transparent 0 16vh, rgba(255,255,255,.07) calc(16vh + 1px) calc(16vh + 3px), transparent calc(16vh + 4px)),
    linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,.07) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    repeating-linear-gradient(90deg, var(--pitch-a) 0 8.333%, var(--pitch-b) 8.333% 16.666%);
}
.sb-wrap{ padding:10px var(--gutter) 0; display:flex; flex-direction:column; align-items:center; gap:6px }
.sb{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); width:min(1120px,100%); border-radius:14px; overflow:hidden; background:linear-gradient(180deg,#1a3480,#0b1a45 70%); border:1px solid rgba(201,211,232,.26); box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15) }
.sb-side{ position:relative; display:flex; align-items:center; gap:12px; padding:7px 16px; min-width:0; transition:background-color .35s }
.sb-side::before{ content:''; position:absolute; top:0; bottom:0; width:7px; background:var(--tc) }
.sb-side.a::before{ inset-inline-start:0 }
.sb-side.b::before{ inset-inline-end:0 }
.sb-side.a{ padding-inline-start:20px }
.sb-side.b{ padding-inline-end:20px }
.sb-side.on{ background:linear-gradient(0deg, color-mix(in srgb, var(--tc) 30%, transparent), transparent) }
.sb-side.on::after{ content:''; position:absolute; inset-inline:0; bottom:0; height:3px; background:var(--tc); box-shadow:0 0 16px var(--tc) }
.sb-crest svg{ width:clamp(38px,min(3.1vw,5.5vh),62px); height:auto; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)) }
.sb-name{ font-weight:700; font-size:clamp(17px,min(1.9vw,3.4vh),38px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.sb-score{ font-family:var(--f-num); font-weight:600; font-size:clamp(38px,min(4.2vw,7.5vh),84px); line-height:1; min-width:1.35em; text-align:center; padding:.1em .22em 0; border-radius:10px; background:rgba(6,13,36,.55); font-variant-numeric:tabular-nums }
.sb-side.a .sb-score{ margin-inline-start:auto }
.sb-side.b .sb-crest{ margin-inline-start:auto }
.sb-score.bump{ animation:bump .8s var(--ease) }
.sb-clock{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 18px; background:#050b1f; min-width:118px; border-inline:1px solid rgba(201,211,232,.2) }
.sb-min{ font-family:var(--f-num); font-weight:500; font-size:clamp(30px,min(3vw,5.4vh),62px); line-height:1; color:var(--gold); padding-top:4px; font-variant-numeric:tabular-nums }
.sb-min.pens-l{ font-family:var(--f-disp); font-size:clamp(15px,1.5vw,20px); padding:4px 0 2px }
.sb-stage{ font-size:clamp(12px,min(1.05vw,1.9vh),17px); color:var(--silver); white-space:nowrap; display:flex; align-items:center; gap:4px }
.sb-stage .sp{ font-size:1.05rem }
.sb-sub{ display:grid; grid-template-columns:1fr auto 1fr; width:min(1120px,100%); align-items:center; gap:10px }
.dots{ display:flex; gap:6px; flex-wrap:wrap }
.dots.b{ justify-content:flex-end }
.dot{ width:clamp(15px,min(1.1vw,2vh),22px); height:clamp(15px,min(1.1vw,2vh),22px); border-radius:50%; border:2px solid rgba(201,211,232,.45); background:rgba(6,13,36,.5); position:relative; flex:none }
.dot.g{ background:var(--good); border-color:var(--good); box-shadow:0 0 8px rgba(47,208,122,.6) }
.dot.x{ border-color:var(--bad); background:rgba(255,90,106,.15) }
.dot.x::before, .dot.x::after{ content:''; position:absolute; left:50%; top:50%; width:9px; height:2px; background:var(--bad); border-radius:2px }
.dot.x::before{ transform:translate(-50%,-50%) rotate(45deg) } .dot.x::after{ transform:translate(-50%,-50%) rotate(-45deg) }
.dot.h{ background:rgba(201,211,232,.45); border-color:rgba(201,211,232,.45) }
.dot.cur{ border-color:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent); animation:pulse 1.2s infinite }
.turn{ padding:4px 20px; border-radius:99px; background:rgba(6,13,36,.8); border:1px solid color-mix(in srgb, var(--tc) 60%, transparent); white-space:nowrap; font-size:clamp(16px,min(1.6vw,2.9vh),26px); font-weight:600; box-shadow:0 0 18px color-mix(in srgb, var(--tc) 25%, transparent) }
.turn b{ color:var(--white) }
.qzone{ min-height:0; display:flex; justify-content:center; align-items:center; padding:10px var(--gutter); overflow:auto; transition:filter .3s }
.v-match.is-paused .qzone{ filter:blur(18px) saturate(.6); pointer-events:none }
.qp{ position:relative; width:min(1120px,100%); max-height:100%; display:flex; flex-direction:column; gap:clamp(10px,1.8vh,20px); padding:clamp(14px,2.2vh,24px) clamp(16px,2.4vw,32px); background:var(--glass); border:1px solid var(--line); border-radius:var(--r-l); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:var(--shadow), inset 0 3px 0 var(--cc); animation:qIn .45s var(--ease) both }
.qp-h{ display:flex; align-items:center; gap:12px }
.cat-chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:99px; background:color-mix(in srgb, var(--cc) 14%, transparent); color:var(--cc); font-weight:600; font-size:clamp(14px,min(1.1vw,2vh),20px); border:1px solid color-mix(in srgb, var(--cc) 40%, transparent); white-space:nowrap }
.cat-chip .ic{ width:17px; height:17px }
.qp-t{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,min(2.1vw,3.8vh),40px); min-width:0 }
.qp-n{ color:var(--silver); font-size:clamp(14px,min(1.25vw,2.2vh),20px); white-space:nowrap }
.ring{ position:relative; width:clamp(56px,min(5.2vw,9.4vh),100px); aspect-ratio:1; flex:none }
.ring svg{ width:100%; height:100% }
.ring-bg{ fill:rgba(6,13,36,.65); stroke:rgba(201,211,232,.16); stroke-width:6 }
.ring-fg{ fill:none; stroke:var(--flood); stroke-width:6; stroke-linecap:round; transition:stroke .3s }
.ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-num); font-weight:500; font-size:clamp(24px,min(2.3vw,4.2vh),46px); padding-top:.12em; font-variant-numeric:tabular-nums }
.ring.low .ring-fg{ stroke:var(--bad) }
.ring.low b{ color:var(--bad); animation:pulse 1s infinite }
.ring.off b{ font-size:1.6rem; color:var(--muted); padding-top:0 }
.qp-body{ display:flex; flex-direction:column; gap:clamp(10px,2vh,22px); min-height:0 }
.prompt{ display:flex; align-items:center; justify-content:center; gap:16px; min-height:clamp(84px,17vh,160px); text-align:center; flex-wrap:wrap }
.prompt.sm{ min-height:clamp(60px,10vh,110px) }
.word{ font-weight:700; font-size:clamp(40px,min(6.5vw,11vh),150px); line-height:1.1; letter-spacing:.005em; text-shadow:0 6px 30px rgba(124,196,255,.18) }
.word.ar{ font-weight:600; font-size:clamp(34px,min(4.6vw,8.5vh),100px); line-height:1.3 }
.prompt.sm .word.ar{ font-size:clamp(30px,min(3.8vw,7vh),80px) }
.say{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(124,196,255,.45); background:rgba(124,196,255,.12); color:var(--flood); flex:none; transition:transform .15s, background-color .2s }
.say:hover{ background:rgba(124,196,255,.24); transform:scale(1.06) }
.say .ic{ width:26px; height:26px }
.say.sm{ width:40px; height:40px }
.say.sm .ic{ width:20px; height:20px }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.4vw,16px) }
.opt{ position:relative; display:flex; align-items:center; gap:14px; min-height:clamp(58px,9.2vh,112px); padding:8px 16px; border-radius:16px; border:1.5px solid rgba(201,211,232,.22); background:linear-gradient(180deg, rgba(26,52,128,.7), rgba(15,33,86,.7)); font-size:clamp(18px,min(2.2vw,3.9vh),44px); font-weight:600; text-align:center; line-height:1.25; transition:transform .15s var(--ease), border-color .2s, background .2s, opacity .3s, box-shadow .2s }
.opt:hover:not([disabled]){ border-color:var(--flood); transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.3) }
.opt .k{ flex:none; display:grid; place-items:center; width:1.55em; height:1.55em; border-radius:10px; background:rgba(6,13,36,.6); font-family:var(--f-num); font-size:.82em; color:var(--silver); padding-top:.12em; font-weight:500 }
.opt .t{ flex:1; min-width:0; overflow-wrap:break-word; word-break:normal; hyphens:none; padding-inline-end:1.55em }
.spell-opts .t, .letter-opts .t{ letter-spacing:.04em }
.letter-opts .t{ font-family:var(--f-ui); font-weight:700 }
.opt[disabled]{ cursor:default }
.opts.done .opt:not(.is-correct):not(.is-wrong){ opacity:.4 }
.opt.is-correct{ border-color:var(--good); background:linear-gradient(180deg, rgba(47,208,122,.35), rgba(47,208,122,.16)); box-shadow:0 0 0 3px rgba(47,208,122,.28), 0 0 30px rgba(47,208,122,.25); animation:correctPop .5s var(--ease) }
.opt.is-correct .k{ background:var(--good); color:#032012 }
.opt.is-wrong{ border-color:var(--bad); background:linear-gradient(180deg, rgba(255,90,106,.3), rgba(255,90,106,.12)); animation:shake .45s }
.opt.is-wrong .k{ background:var(--bad); color:#2a0006 }
/* spell_build */
.slots, .tiles{ display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(6px,.7vw,10px) }
.slots{ column-gap:clamp(18px,2.2vw,36px) }
.sbw, .lbw{ display:inline-flex; gap:clamp(5px,.6vw,9px) }
.slots.long .slot, .tiles.long .tile{ width:clamp(32px,min(3.3vw,5.8vh),68px); height:clamp(42px,min(4.3vw,7.6vh),88px); font-size:clamp(20px,min(2.3vw,4.2vh),46px) }
.letters.long .lb{ width:clamp(32px,min(3.5vw,6.2vh),72px); height:clamp(42px,min(4.6vw,8.2vh),92px); font-size:clamp(22px,min(2.7vw,4.8vh),56px) }
.slot{ width:clamp(40px,min(4.2vw,7.4vh),84px); height:clamp(50px,min(5.4vw,9.4vh),104px); border-radius:12px; border:2px dashed rgba(201,211,232,.4); background:rgba(6,13,36,.55); display:grid; place-items:center; font-size:clamp(24px,min(2.8vw,5vh),56px); font-weight:700; padding:0; transition:border-color .2s, background-color .2s, transform .15s }
.slot.fill{ border-style:solid; border-color:var(--flood); background:rgba(124,196,255,.14); animation:slotIn .25s var(--ease) }
.slot.fixed{ border:0; background:none; width:clamp(14px,min(1.6vw,2.8vh),32px); color:var(--silver) }
.slot.ok{ border-color:var(--good); background:rgba(47,208,122,.22); border-style:solid }
.slot.bad{ border-color:var(--bad); background:rgba(255,90,106,.2); border-style:solid }
.slots.shake{ animation:shake .35s }
.tile{ width:clamp(40px,min(4.2vw,7.4vh),84px); height:clamp(50px,min(5.4vw,9.4vh),104px); border-radius:12px; border:0; background:linear-gradient(180deg,#ffffff,#cdd6ea); color:#0b1a45; box-shadow:0 5px 0 #7c88ad, 0 10px 18px rgba(0,0,0,.35); font-size:clamp(24px,min(2.8vw,5vh),56px); font-weight:700; padding:0; transition:transform .12s, opacity .2s, box-shadow .12s }
.tile:hover:not([disabled]){ transform:translateY(-3px) }
.tile:active:not([disabled]){ transform:translateY(3px); box-shadow:0 2px 0 #7c88ad }
.tile.used{ opacity:.14; transform:scale(.9); box-shadow:none }
.sbc{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
.kbd-hint{ text-align:center; color:var(--muted); font-size:clamp(13px,min(1.05vw,1.9vh),18px); margin-top:-6px }
.sb-correct{ text-align:center; font-size:1.2rem }
.sb-correct .b, .res-ans .b{ font-weight:700; color:var(--good) }
/* gap_sentence */
.sentence{ font-size:clamp(24px,min(3.1vw,5.6vh),64px); line-height:1.55; font-weight:500; text-align:center; padding:clamp(6px,2vh,26px) 0 }
.blank{ display:inline-block; min-width:4.6em; margin:0 .2em; border-bottom:4px solid var(--flood); color:var(--flood); text-align:center; line-height:1.15; animation:blink 1.4s ease-in-out infinite }
.blank.ok{ color:var(--good); border-color:var(--good); animation:none }
.blank.fix{ color:var(--gold); border-color:var(--gold); animation:none }
/* gap_letters */
.letters{ display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(8px,1.2vh,12px) clamp(18px,2.2vw,36px); padding-top:clamp(4px,1.5vh,18px) }
.lb{ width:clamp(42px,min(4.8vw,8.5vh),96px); height:clamp(54px,min(6.2vw,11vh),120px); display:grid; place-items:center; font-size:clamp(28px,min(3.6vw,6.4vh),72px); font-weight:700; border-radius:12px; background:rgba(245,247,255,.08); border:1px solid rgba(201,211,232,.2) }
.lb.miss{ border:2.5px dashed var(--gold); color:var(--gold); background:rgba(242,193,78,.1) }
.lb.miss.ok{ border-style:solid; border-color:var(--good); color:var(--good); background:rgba(47,208,122,.18) }
.lb.miss.fix{ border-style:solid }
.lb.gap{ background:none; border:0; width:clamp(12px,min(1.4vw,2.5vh),30px) }
.hint{ text-align:center; color:var(--silver); font-size:clamp(16px,min(1.6vw,2.9vh),30px) }
.hint b{ color:var(--white); font-weight:600 }
/* match5 */
.m5{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(48px,20%) minmax(0,1fr); }
.m5-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0 }
.m5-col{ display:flex; flex-direction:column; gap:clamp(8px,1.3vh,12px); position:relative; z-index:1 }
.m5-col.en{ grid-column:1 } .m5-col.ar{ grid-column:3 }
.m5-i{ min-height:clamp(46px,6.8vh,84px); border-radius:14px; border:2px solid rgba(201,211,232,.24); background:linear-gradient(180deg, rgba(26,52,128,.75), rgba(15,33,86,.75)); font-size:clamp(17px,min(1.9vw,3.4vh),36px); font-weight:600; padding:4px 12px; touch-action:none; user-select:none; -webkit-user-select:none; transition:border-color .2s, background-color .2s, box-shadow .2s, transform .15s; line-height:1.2 }
.m5-i:hover:not([disabled]){ border-color:rgba(245,247,255,.6) }
.m5-i.sel{ border-color:var(--white); box-shadow:0 0 0 4px rgba(245,247,255,.22); transform:scale(1.02) }
.m5-i.lnk{ border-color:var(--lc); background:linear-gradient(180deg, color-mix(in srgb, var(--lc) 26%, #13296a), color-mix(in srgb, var(--lc) 12%, #0b1a45)) }
.m5-i.ok{ border-color:var(--good); background:rgba(47,208,122,.2) }
.m5-i.bad{ border-color:var(--bad); background:rgba(255,90,106,.16) }
.ln{ fill:none; stroke:var(--lc, var(--flood)); stroke-width:4; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(0,0,0,.5)) }
.lnd{ fill:var(--lc, var(--flood)) }
.ln.tmp{ stroke:var(--white); stroke-dasharray:8 7; opacity:.8 }
.ln.ok{ stroke:var(--good) } .lnd.ok{ fill:var(--good) }
.ln.bad{ stroke:var(--bad); stroke-dasharray:10 8 } .lnd.bad{ fill:var(--bad) }
.ln.miss{ stroke:var(--good); stroke-dasharray:2 8; stroke-width:4.5 } .lnd.miss{ fill:var(--good) }
.m5-foot{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap }
.m5-count{ font-family:var(--f-num); font-size:clamp(1.7rem,min(2.4vw,4.3vh),2.6rem); line-height:1; color:var(--gold); min-width:3em; text-align:center; padding-top:4px }
.qp.answered .kbd-hint, .qp.answered .m5-foot .muted{ visibility:hidden }
/* toolbar */
.tools{ display:flex; align-items:center; justify-content:center; gap:6px; padding:8px var(--gutter) calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, rgba(5,11,31,.96), rgba(5,11,31,.72)); border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:thin }
.tool{ display:inline-flex; align-items:center; gap:7px; min-height:44px; min-width:44px; justify-content:center; padding:6px 12px; border-radius:12px; border:1px solid transparent; background:rgba(255,255,255,.05); color:var(--silver); font-size:clamp(14px,1vw,16px); white-space:nowrap; flex:none; transition:background-color .2s, color .2s }
.tool:hover:not([disabled]){ color:var(--white); background:rgba(255,255,255,.11) }
.tool[disabled]{ opacity:.35; cursor:not-allowed }
.tool kbd{ font-family:var(--f-num); font-size:.85rem; padding:0 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted); line-height:1.5 }
.tools-sp{ flex:1; min-width:8px }
/* penalties */
.pens-sb .sb-clock{ min-width:150px }
.pk-row{ display:flex; gap:6px; flex-wrap:wrap }
.pk-row.b{ justify-content:flex-end }
.pk{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(201,211,232,.45); display:grid; place-items:center; background:rgba(6,13,36,.5); position:relative; flex:none }
.pk .ic{ width:14px; height:14px; color:#032012; stroke-width:3 }
.pk.g{ border-color:var(--good); box-shadow:0 0 10px rgba(47,208,122,.55); background:var(--good) }
.pk.x{ border-color:var(--bad); background:rgba(255,90,106,.2) }
.pk.x::before, .pk.x::after{ content:''; position:absolute; left:50%; top:50%; width:12px; height:2.5px; background:var(--bad); border-radius:2px }
.pk.x::before{ transform:translate(-50%,-50%) rotate(45deg) } .pk.x::after{ transform:translate(-50%,-50%) rotate(-45deg) }
.pk.cur{ border-color:var(--tc); animation:pulse 1.2s infinite }
.pk.h{ background:rgba(201,211,232,.45); border-color:rgba(201,211,232,.45) }
.pens-ready{ align-items:center; text-align:center; max-width:760px; gap:14px }
.pens-ready h2{ font-size:clamp(30px,3.4vw,48px) }
.pens-ready p{ max-width:600px; color:var(--silver) }
.pens-ready .lead{ font-size:1.3rem; color:var(--white) }

/* ============ overlays ============ */
#layer{ position:fixed; inset:0; z-index:50; pointer-events:none }
.ovl{ position:absolute; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,9,26,.66); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); pointer-events:auto; animation:fadeIn .25s ease both; overflow:auto }
.ovl-card{ position:relative; width:min(760px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg, rgba(22,46,112,.97), rgba(9,21,58,.98)); border:1px solid rgba(201,211,232,.26); border-radius:26px; padding:20px 26px 22px; box-shadow:0 30px 90px rgba(0,0,0,.6); text-align:center; animation:cardIn .45s var(--ease) both }
.ovl-card .kicker{ margin-bottom:2px }
.ovl-card h2.disp{ font-size:clamp(28px,3.4vw,44px); margin-bottom:10px }
.ovl-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px }
.ovl-res.cheer .ovl-card{ border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 80px color-mix(in srgb, var(--tc) 40%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.ovl-res.cheer{ background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 16%, rgba(4,9,26,.62)), rgba(4,9,26,.8)) }
.res-top{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap }
.res-head{ display:flex; flex-direction:column; align-items:center }
.res-t{ font-family:var(--f-disp); font-weight:700; font-size:clamp(40px,min(5.2vw,9.4vh),100px); line-height:1.1; color:var(--gold); text-shadow:0 8px 40px rgba(242,193,78,.45); animation:cheerPop .7s var(--ease) both }
.is-no .res-t{ color:var(--silver); text-shadow:none; font-size:clamp(34px,min(4.4vw,8vh),84px) }
.res-team{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:clamp(19px,min(1.4vw,2.5vh),26px); flex-wrap:wrap }
.res-team svg{ width:34px; height:auto }
.var-tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:99px; background:rgba(124,196,255,.14); color:var(--flood); font-size:.8rem; font-weight:600 }
.var-tag .ic{ width:14px; height:14px }
.res-score{ display:flex; align-items:center; justify-content:center; gap:10px; margin:12px auto 0; padding:6px 16px; border-radius:14px; background:rgba(6,13,36,.6); width:fit-content; max-width:100% }
.res-score svg{ width:28px; height:auto }
.rs-n{ font-weight:600; white-space:nowrap }
.res-sp{ font-size:2.3rem; font-weight:600; padding:0 6px }
.res-ans{ margin-top:10px; font-size:1.15rem }
.learn{ margin-top:14px; display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-radius:16px; background:rgba(6,13,36,.55); border:1px solid var(--line) }
.learn-w{ display:flex; justify-content:center; align-items:center; gap:10px 14px; flex-wrap:wrap }
.lw{ font-size:clamp(26px,min(3vw,5.4vh),52px); font-weight:700; line-height:1.2 }
.la{ font-size:clamp(20px,min(2.1vw,3.8vh),36px); color:var(--silver); font-weight:500 }
.pos{ font-size:.8rem; padding:2px 10px; border-radius:99px; background:rgba(201,211,232,.12); color:var(--silver) }
.learn-s{ font-size:clamp(16px,min(1.7vw,3vh),28px); color:var(--silver); line-height:1.5 }
.learn-s mark{ background:rgba(242,193,78,.2); color:var(--gold); padding:0 .25em; border-radius:6px; font-weight:600 }
.learn.m5l{ display:grid; grid-template-columns:1fr; gap:4px; text-align:start }
.lp{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:12px; align-items:center; padding:3px 10px; border-radius:10px; background:rgba(255,255,255,.04) }
.lp .lw{ font-size:clamp(17px,min(1.5vw,2.7vh),26px); text-align:left; overflow-wrap:anywhere; min-width:0 }
.lp .la{ font-size:clamp(16px,min(1.4vw,2.5vh),24px); text-align:start; overflow-wrap:anywhere; min-width:0 }
.ht-score{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:6px 0 14px }
.ht-score svg{ width:56px; height:auto }
.ht-score b{ font-size:1.4rem }
.sp.big{ font-size:4rem; font-weight:600; padding:0 10px }
.ht-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:start }
.hts{ position:relative; padding:12px 14px 10px; border-radius:14px; background:rgba(6,13,36,.55); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px }
.hts::before{ background:var(--tc) }
.hts .bar{ flex:none; width:100%; margin-top:4px }
.hts .bar > i{ background:var(--tc) }
.pk-team{ display:flex; align-items:center; justify-content:center; gap:10px }
.pk-team svg{ width:44px; height:auto }
.pk-team h2{ font-size:1.8rem }
.pk-num{ font-family:var(--f-num); font-weight:600; font-size:clamp(110px,18vh,180px); line-height:1; color:var(--white); text-shadow:0 0 50px color-mix(in srgb, var(--tc) 70%, transparent); padding-top:.1em; font-variant-numeric:tabular-nums }
.pk-num.pop{ animation:numPop .6s var(--ease); color:var(--gold) }
.ovl-card.pick-card{ width:min(520px,100%); border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 70px color-mix(in srgb, var(--tc) 35%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.pick-card .kicker{ font-family:var(--f-ui); letter-spacing:0; font-weight:600; font-size:1rem; text-transform:none }
.ovl-card.pz, .ovl-card.se, .ovl-card.ht{ width:min(620px,100%) }
.ovl-card.se p, .ovl-card.pz p{ margin-bottom:6px }

/* modal */
.modal-bg{ position:fixed; inset:0; z-index:80; background:rgba(4,9,26,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease both }
.modal{ width:min(540px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg,#16307a,#0b1a45); border:1px solid rgba(201,211,232,.26); border-radius:22px; padding:22px 24px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:cardIn .3s var(--ease) both }
.modal.wide{ width:min(760px,100%) }
.modal h3{ display:flex; align-items:center; gap:10px; font-family:var(--f-disp); font-weight:600; font-size:1.4rem; margin-bottom:12px }
.modal h3 .ic{ color:var(--flood); width:24px; height:24px }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px }
.confirm-t{ font-size:1.08rem; line-height:1.7 }
.var-box{ display:flex; flex-direction:column; gap:8px; border-inline-start:4px solid var(--tc); padding-inline-start:14px }
.var-now{ font-size:1.15rem }
.var-now .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.bk{ display:grid; gap:18px }
.bk section{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:var(--r); background:rgba(6,13,36,.45); border:1px solid var(--line) }
.bk h4{ font-size:1.05rem }
.bk textarea{ width:100%; border-radius:12px; border:1px solid var(--line); background:rgba(6,13,36,.7); padding:10px; resize:vertical; min-height:90px }
.file-btn{ position:relative; cursor:pointer }
.file-btn:focus-within{ outline:3px solid var(--flood); outline-offset:3px }
/* storage warning (autosave unavailable / failed) */
.warn-bar{ position:relative; z-index:6; display:flex; align-items:center; justify-content:center; gap:10px 14px; flex-wrap:wrap; padding:8px var(--gutter); background:rgba(255,181,71,.15); border-bottom:1px solid rgba(255,181,71,.5); color:#ffe2b8; font-size:.92rem; line-height:1.5; text-align:center }
.warn-bar > .ic{ color:var(--warn) }
.warn-bar .btn{ min-height:38px; padding:.3em .9em; font-size:.88rem }
html.in-match .warn-bar{ display:none }
.tool.warn{ color:var(--warn); border-color:rgba(255,181,71,.5) }
.kbd-hint kbd{ font-size:.92em; padding:0 6px }
/* toasts */
#toasts{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(560px, calc(100% - 32px)) }
.toast{ padding:10px 18px; border-radius:14px; background:rgba(11,26,69,.97); border:1px solid var(--line); box-shadow:var(--shadow); animation:toastIn .3s var(--ease) both; font-weight:500; text-align:center; transition:opacity .3s, transform .3s }
.toast.good{ border-color:rgba(47,208,122,.6) } .toast.bad{ border-color:rgba(255,90,106,.65) }
.toast.out{ opacity:0; transform:translateY(8px) }

/* ============ full time ============ */
.v-ft{ padding-top:clamp(18px,4vh,40px); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center }
.ft-head h1{ font-size:clamp(34px,4vw,54px) }
.ft-score{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:clamp(12px,3vw,40px); width:min(980px,100%); margin-top:6px }
.ft-team{ display:flex; align-items:center; gap:16px; justify-content:flex-end; min-width:0 }
.ft-team.b{ flex-direction:row-reverse; justify-content:flex-end }
.ft-team svg{ width:clamp(60px,7vw,96px); height:auto; flex:none }
.ft-team .tn-g{ font-family:var(--f-disp); font-size:clamp(22px,2.6vw,38px); font-weight:700; line-height:1.15 }
.ft-team .tn-c{ font-size:clamp(13px,1.2vw,17px) }
.ft-team .tn.solo .tn-g{ font-family:var(--f-num), var(--f-disp); font-size:clamp(30px,3.6vw,52px); font-weight:600; line-height:1 }
.ft-team.win .tn-g{ color:var(--gold) }
.ft-note{ max-width:680px; color:var(--silver); font-size:.95rem; line-height:1.75; margin-top:6px }
.ft-note .ic{ display:inline; width:16px; height:16px; vertical-align:-3px; color:var(--warn) }
.ft-points .nr{ color:var(--gold); font-family:var(--f-disp) }
.ft-points .ic{ display:inline; width:18px; height:18px; vertical-align:-3px; color:var(--gold) }
.ft-nums{ display:flex; align-items:center; gap:12px; padding:8px 26px 0; border-radius:20px; background:linear-gradient(180deg,#1a3480,#0b1a45); border:1px solid rgba(201,211,232,.26); box-shadow:var(--shadow) }
.ft-nums .n{ font-family:var(--f-num); font-weight:600; font-size:clamp(64px,8vw,112px); line-height:1; min-width:.7em; font-variant-numeric:tabular-nums }
.ft-nums .dash{ font-family:var(--f-num); font-size:3rem; opacity:.5 }
.n.reveal-pop{ animation:numPop .8s var(--ease); color:var(--gold) }
.ft-pens{ display:flex; align-items:center; gap:10px; font-size:1.05rem; color:var(--silver) }
.ft-pens .sp{ font-size:1.8rem; color:var(--white) }
.ft-result{ display:flex; flex-direction:column; align-items:center; gap:6px; transition:opacity .5s }
.ft-result.pending, .ft-tbl.pending{ opacity:0 }
.rl{ display:inline-flex; align-items:center; gap:8px; font-family:var(--f-disp); font-size:clamp(22px,2.4vw,32px); font-weight:600 }
.rl.win{ color:var(--gold) }
.rl .ic{ width:28px; height:28px }
.ft-points{ color:var(--silver) }
.ft-points b{ font-family:var(--f-num); font-size:1.5rem; color:var(--good); vertical-align:-2px }
.ft-points.gold{ color:var(--gold); font-weight:600; display:flex; align-items:center; gap:6px }
.ft-tbl{ width:min(860px,100%); transition:opacity .5s }
.ft-rounds{ width:100%; border-collapse:collapse; min-width:480px }
.ft-rounds th{ padding:10px; font-weight:500; color:var(--silver); font-size:.88rem; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35) }
.ft-rounds td{ padding:8px 10px; border-bottom:1px solid var(--line) }
.ft-rounds tr:last-child td{ border-bottom:0 }
.ft-rounds td.rn{ font-family:var(--f-num); font-size:1.3rem; color:var(--muted); width:40px }
.ft-rounds td.rt{ text-align:start; white-space:nowrap }
.cat-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--cc); margin-inline-end:8px }
.ft-rounds td.ok, .ft-rounds td.no{ white-space:nowrap }
.rc{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; margin-inline-end:8px; vertical-align:middle }
.rc .ic{ width:15px; height:15px }
td.ok .rc{ background:var(--good); color:#032012 } td.no .rc{ background:rgba(255,90,106,.25); color:var(--bad) }
.rw{ font-weight:500 }
.ft-rounds small{ display:inline-block; margin-inline-start:6px; color:var(--muted); font-size:.75rem }
.var-s{ color:var(--flood)!important }
.ft-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px }

/* ============ champion ============ */
.v-champ{ position:relative; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:28px var(--gutter); overflow:hidden }
#fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2 }
.v-champ .beam{ background:linear-gradient(180deg, rgba(255,224,138,.28), rgba(242,193,78,.05) 55%, transparent 80%) }
.champ-grid{ position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(20px,4vw,60px); align-items:center; width:min(1200px,100%) }
.champ-main{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px }
.champ-main .kicker{ color:var(--gold) }
.trophy{ width:clamp(130px,24vh,230px); height:auto; filter:drop-shadow(0 20px 50px rgba(242,193,78,.4)); animation:rise 1.2s var(--ease) both }
.champ-title{ font-family:var(--f-disp); font-weight:700; font-size:clamp(28px,3.6vw,52px); color:var(--gold); line-height:1.2 }
.champ-team{ display:flex; align-items:center; gap:16px; justify-content:center; animation:popIn .9s .4s var(--ease) both }
.champ-team svg{ width:clamp(60px,8vh,84px); height:auto; filter:drop-shadow(0 10px 30px color-mix(in srgb, var(--tc) 60%, transparent)) }
.champ-names{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:start }
.champ-names b{ font-family:var(--f-disp); font-weight:700; font-size:clamp(40px,5.2vw,78px); line-height:1.05; color:var(--white) }
.champ-cls{ font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,2.3vw,34px); color:var(--cc); line-height:1.2 }
.champ-cls.solo{ font-size:clamp(40px,5.2vw,78px); color:var(--white) }
.best-class{ display:flex; align-items:center; gap:14px; border-inline-start:5px solid var(--cc); padding:14px 18px }
.bc-ic{ width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:rgba(242,193,78,.14); color:var(--gold); flex:none }
.best-class small{ display:block; color:var(--gold); font-size:.82rem; font-weight:500 }
.best-class b{ display:block; font-family:var(--f-disp); font-size:1.4rem }
.bc-st{ font-size:.88rem; color:var(--silver) }
.champ-sub{ color:var(--silver) }
.champ-side{ display:flex; flex-direction:column; gap:16px }
.road h3{ display:flex; align-items:center; gap:8px; font-size:1.1rem; margin-bottom:10px }
.road h3 .ic{ color:var(--gold) }
.road ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px }
.road li{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:rgba(6,13,36,.5); flex-wrap:wrap }
.rd-stage{ font-size:.8rem; color:var(--gold); min-width:120px }
.rd-opp{ flex:1; font-weight:600 }
.rd-sc{ font-size:1.6rem }
.champ-actions{ display:flex; gap:10px; flex-wrap:wrap }

/* ============ certificate ============ */
.cert-tools{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; margin:-6px 0 12px }
.v-cert .topbar{ margin-bottom:12px; padding:10px 0 }
.note{ display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:.92rem; border-radius:14px; background:rgba(124,196,255,.1); border:1px solid rgba(124,196,255,.35); max-width:760px }
.note .ic{ color:var(--flood); flex:none }
.cert-wrap{ display:flex; justify-content:center }
.cert{ position:relative; width:min(1100px, 100%, calc((100vh - 210px) * 1.4143)); aspect-ratio:297/210; container-type:inline-size; background:radial-gradient(ellipse at 50% 30%, #fffdf6, #f6f0df 70%, #eee4c8); color:#0b1a45; border-radius:6px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); font-family:var(--f-ui); -webkit-print-color-adjust:exact; print-color-adjust:exact }
.cert-frame{ position:absolute; inset:2.2cqw; border:.35cqw solid #0b1a45; outline:.18cqw solid #c8931e; outline-offset:-.9cqw; border-radius:.4cqw }
.cc{ position:absolute; width:5cqw; height:5cqw; border:.35cqw solid #c8931e }
.cc.c1{ top:1.2cqw; right:1.2cqw; border-left:0; border-bottom:0 } .cc.c2{ top:1.2cqw; left:1.2cqw; border-right:0; border-bottom:0 }
.cc.c3{ bottom:1.2cqw; right:1.2cqw; border-left:0; border-top:0 } .cc.c4{ bottom:1.2cqw; left:1.2cqw; border-right:0; border-top:0 }
.cert-wm{ position:absolute; inset:0; display:grid; place-items:center; opacity:.06; pointer-events:none }
.cert-wm svg{ width:34cqw; height:auto }
.cert-in{ position:absolute; inset:4.5cqw 6cqw; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:space-between }
.cert-top{ display:flex; align-items:center; justify-content:space-between; width:100% }
.cert-side{ width:30cqw; display:flex; flex-direction:column; align-items:center; gap:.3cqw }
.cert-side b{ font-family:var(--f-disp); font-size:2.5cqw; font-weight:700; color:#0b1a45; line-height:1.25 }
.cert-side span{ font-size:1.45cqw; color:#43507a }
.cert-seal svg{ width:12.5cqw; height:auto; filter:drop-shadow(0 .4cqw .9cqw rgba(11,26,69,.28)) }
.cert-kicker{ font-family:var(--f-num); letter-spacing:.3em; font-size:1.3cqw; color:#b07d12 }
.cert-title{ font-family:var(--f-disp); font-weight:700; font-size:5.6cqw; line-height:1.1; background:linear-gradient(180deg,#0b1a45,#1d3a8a); -webkit-background-clip:text; background-clip:text; color:transparent }
.cert-text{ font-size:2.05cqw; line-height:1.6; color:#1c2a55 }
.cert-text b{ color:#0b1a45 }
.cert-text bdi{ font-weight:700 }
.cert-team{ display:flex; align-items:center; gap:1.4cqw }
.cert-team svg{ width:5.2cqw; height:auto }
.cert-team b{ font-family:var(--f-disp); font-size:4.3cqw; line-height:1.15; font-weight:700; color:#b07d12 }
.cert-date{ font-size:1.6cqw; color:#43507a }
.cert-sign{ display:grid; grid-template-columns:1fr auto 1fr; align-items:end; width:100%; gap:3cqw }
.sg{ display:flex; flex-direction:column; align-items:center; gap:.4cqw; font-size:1.5cqw }
.sg span{ color:#43507a }
.sg b{ font-size:1.8cqw; min-height:1.2em }
.sg i{ display:block; width:80%; height:.15cqw; background:#0b1a45; margin-top:1.8cqw }
.seal svg{ width:6.5cqw; height:auto; opacity:.9 }

/* ============ bank ============ */
.bank-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px }
.search{ flex:1; min-width:240px; display:flex; align-items:center; gap:10px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.6) }
.search:focus-within{ border-color:var(--flood); box-shadow:0 0 0 3px rgba(124,196,255,.2) }
.search .ic{ color:var(--muted) }
.search input{ flex:1; min-height:48px; border:0; background:none; outline:none; font-size:1rem; min-width:0 }
.bank-count b{ font-family:var(--f-num); font-size:1.5rem; color:var(--gold); vertical-align:-3px }
.bank-units{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px }
.unit{ border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); overflow:hidden }
.unit summary{ display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; list-style:none; min-height:56px }
.unit summary::-webkit-details-marker{ display:none }
.unit summary:hover{ background:rgba(255,255,255,.03) }
.unit .chev{ transition:transform .25s; color:var(--muted) }
.unit[open] .chev{ transform:rotate(180deg) }
.unit .tbl-wrap{ border-radius:0; border:0; border-top:1px solid var(--line); background:rgba(6,13,36,.3) }
.u-lv{ display:flex; gap:4px }
.lvp{ font-family:var(--f-num); font-size:.95rem; min-width:26px; text-align:center; border-radius:8px; padding:1px 4px 0; line-height:1.4 }
.lvp.l1{ background:rgba(47,208,122,.16); color:var(--good) } .lvp.l2{ background:rgba(242,193,78,.16); color:var(--gold) } .lvp.l3{ background:rgba(255,90,106,.16); color:#ff9aa5 }
.words{ width:100%; border-collapse:collapse; min-width:640px }
.words th{ text-align:start; padding:10px 12px; font-weight:500; font-size:.84rem; color:var(--silver); border-bottom:1px solid var(--line) }
.words td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle }
.words tr:last-child td{ border-bottom:0 }
.words td.w{ font-weight:700; font-size:1.08rem }
.words td.ex{ color:var(--muted); font-size:.88rem; max-width:360px }
.words tr.bad td{ background:rgba(255,90,106,.06) }
.words .ic{ display:inline }
.my-words{ display:flex; flex-direction:column; gap:12px }
.my-words textarea{ width:100%; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.65); padding:12px 14px; resize:vertical; font-size:1rem; line-height:1.7; min-height:140px }
.my-words textarea:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.2) }
.h3{ font-size:1.05rem; margin-top:6px }
.pv-sum{ display:flex; gap:10px; align-items:center; font-weight:600 }

/* ============ help ============ */
.help-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.help-grid .wide{ grid-column:1 / -1 }
.ticks{ margin:0; padding-inline-start:1.2em; display:flex; flex-direction:column; gap:8px; color:var(--silver) }
.ticks b{ color:var(--white) }
.help-types{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }
.ht-cat{ position:relative; padding:12px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px }
.ht-cat h3{ display:flex; align-items:center; gap:6px; font-size:1rem; color:var(--white) }
.ht-cat h3 .ic{ color:var(--cc) }
.ht-cat h3 small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.ht-type{ display:flex; flex-direction:column; gap:2px; font-size:.88rem }
.ht-type span{ color:var(--muted) }
.keys{ border-collapse:collapse; width:100% }
.keys td{ padding:6px 8px; border-bottom:1px solid var(--line) }
.keys tr:last-child td{ border-bottom:0 }
kbd{ font-family:var(--f-num); font-size:1rem; padding:1px 8px; border-radius:7px; border:1px solid var(--line); background:rgba(255,255,255,.06); white-space:nowrap }
.help-foot{ text-align:center; margin-top:22px }


/* ============ team names (class line + group line) ============ */
.tn{ display:inline-flex; flex-direction:column; min-width:0; line-height:1.15; text-align:start; vertical-align:middle }
.tn-c{ font-size:.74em; font-weight:600; color:var(--cc, var(--silver)); white-space:nowrap; letter-spacing:.01em }
.tn-g{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:100% }
.tn-s, .turn .tn-s{ display:none }
.fx-t .tn-g{ font-size:1.1rem } .fx-t .tn-c{ font-size:.8rem }
.fx-t.win .tn-g{ color:var(--gold) }
.fx-t.lose{ opacity:.5 }
.fx-t.tbd .tn-c{ color:var(--muted) }
.fx-t.tbd .tn-g{ color:var(--silver); font-weight:500; font-size:.9rem; white-space:normal }
.sb-name .tn{ max-width:100% } .sb-name .tn-c{ font-size:.52em; letter-spacing:.03em } .sb-name .tn-g{ line-height:1.1 }
.dp-t .tn-g{ font-size:1.02rem } .dp-t .tn-c{ font-size:.76rem }
.tm-in .tn-g{ font-size:1.04rem } .tm-in .tn-c{ font-size:.76rem }
.ht-score .tn-g{ font-size:1.3rem } .ht-score .tn-c{ font-size:.85rem }
.res-name{ font-size:clamp(20px,min(1.6vw,2.9vh),30px); font-weight:700 }
.is-ok .res-name{ color:var(--white) }
.sc header .tn{ flex:1 } .sc header .tn-g{ font-size:1.12rem }
.bk-champ .tn-g{ font-size:.9rem } .bk-champ .tn-c{ font-size:.68rem }

/* ============ knockout draw ceremony ============ */
.v-draw-ko{ padding-top:20px }
.v-draw-ko .draw-head h1{ font-size:clamp(34px,4.2vw,56px) }
.draw-pots{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px 14px; margin:14px auto 16px }
.pot{ display:flex; align-items:center; gap:10px; padding:5px 10px 5px 8px; border-radius:14px; background:var(--glass-3); border:1px solid var(--line); border-top:3px solid var(--cc) }
.pot > b{ font-family:var(--f-num); font-size:1.35rem; line-height:1; padding-top:3px; color:var(--white) }
.pot-ch{ display:flex; gap:3px }
.pc svg{ width:28px; height:auto; display:block; transition:opacity .35s, filter .35s, transform .35s }
.pc.out svg{ opacity:.2; filter:grayscale(1); transform:scale(.84) }
.dp-list{ list-style:none; margin:0 auto; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(var(--rows),auto); grid-auto-flow:column; gap:12px 22px; width:min(1180px,100%); text-align:start }
.dp{ position:relative; display:flex; align-items:center; gap:10px; min-height:66px }
.dp-no{ flex:none; width:36px; height:36px; display:grid; place-items:center; border-radius:10px; background:rgba(242,193,78,.14); color:var(--gold); font-family:var(--f-num); font-size:1.35rem; padding-top:3px }
.dp-no .ic{ width:17px; height:17px }
.dp-card{ flex:1; min-width:0; position:relative; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; min-height:62px; padding:8px 12px; border-radius:var(--r); background:linear-gradient(180deg, rgba(22,46,112,.94), rgba(11,26,69,.94)); border:1px solid rgba(201,211,232,.22); box-shadow:0 10px 26px rgba(0,0,0,.32); opacity:0; transform:scale(.9) }
.dp.on .dp-card{ animation:dpIn .45s var(--ease) both }
.dp.same .dp-card{ border-color:rgba(242,193,78,.42) }
.dp-t{ display:flex; align-items:center; gap:8px; min-width:0 }
.dp-t.b{ justify-content:flex-end }
.dp-t svg{ width:32px; height:auto; flex:none }
.dp-vs{ font-family:var(--f-num); font-size:1.35rem; color:var(--gold); letter-spacing:.06em }
.dp-tag{ position:absolute; top:-9px; inset-inline-start:50%; transform:translateX(50%); font-size:.68rem; font-weight:600; padding:0 8px; border-radius:99px; background:#0b1a45; border:1px solid rgba(242,193,78,.5); color:var(--gold); white-space:nowrap; line-height:1.6 }
.dp.bye .dp-card{ grid-template-columns:minmax(0,1fr) auto; border-style:dashed; border-color:rgba(242,193,78,.4); background:rgba(11,26,69,.78) }
.dp-bye{ display:flex; flex-direction:column; align-items:flex-end; font-weight:600; color:var(--gold); font-size:.95rem; line-height:1.25; text-align:end }
.dp-bye small{ color:var(--muted); font-weight:400; font-size:.76rem }
/* the draw capsule: two plain silver/gold halves that open to reveal the tie */
.dp-cap{ position:absolute; top:0; bottom:0; inset-inline-start:46px; inset-inline-end:0; display:grid; place-items:center; pointer-events:none; border-radius:var(--r); border:1.5px dashed rgba(201,211,232,.18); transition:border-color .3s }
.dp-cap i{ grid-area:1 / 1; width:40px; height:19px; transition:transform .45s var(--ease), opacity .4s }
.dp-cap i:first-child{ border-radius:40px 40px 4px 4px; background:linear-gradient(180deg,#ffffff,#b9c4de); transform:translateY(-10px); box-shadow:inset 0 -2px 0 rgba(11,26,69,.25) }
.dp-cap i:last-child{ border-radius:4px 4px 40px 40px; background:linear-gradient(180deg,#f2c14e,#b8860b); transform:translateY(10px) }
.dp:not(.on) .dp-cap{ animation:capWait 1.6s ease-in-out infinite }
.dp.on .dp-cap{ border-color:transparent }
.dp.on .dp-cap i:first-child{ transform:translateY(-34px) rotate(-18deg); opacity:0 }
.dp.on .dp-cap i:last-child{ transform:translateY(34px) rotate(18deg); opacity:0 }
.draw-note{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px auto 0; max-width:920px; font-size:.95rem; color:var(--silver); line-height:1.6 }
.draw-note .ic{ width:18px; height:18px; flex:none; color:var(--flood) }
.draw-note.good .ic{ color:var(--good) } .draw-note.warn{ color:#ffe2b8 } .draw-note.warn .ic{ color:var(--warn) }
.v-draw-ko .draw-foot, .v-draw-bk .draw-foot{ flex-direction:row; justify-content:center; flex-wrap:wrap; margin-top:18px }
.v-draw-bk .draw-head{ margin-bottom:14px }

/* ============ knockout fixtures ============ */
.fx-list.ko{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr)); gap:10px 14px }
.fx-list.ko .fx{ grid-template-columns:minmax(0,1fr) minmax(108px,auto) minmax(0,1fr) auto; gap:10px; padding:10px 12px }
.fx.st-tbd{ border-style:dashed; background:rgba(11,26,69,.5) }
.fx-mode{ display:inline-flex; align-items:center; gap:4px; font-size:.72rem; color:var(--muted); white-space:nowrap }
.fx-mode .ic{ width:13px; height:13px }
.p-tbd{ background:rgba(201,211,232,.06); color:var(--muted); white-space:normal; text-align:center; max-width:190px; line-height:1.4; border-color:rgba(201,211,232,.18) }
.fx-lock{ display:inline-grid; place-items:center; width:40px; height:40px; color:rgba(201,211,232,.3) }
.grp-n{ font-style:normal; margin-inline-start:auto; font-size:.84rem; color:var(--muted); font-weight:400 }
.byes{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin:-2px 0 10px; font-size:.9rem; color:var(--silver) }
.byes .ic{ color:var(--gold); width:16px; height:16px }
.bye-chip{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 6px; border-radius:99px; background:rgba(242,193,78,.1); border:1px solid rgba(242,193,78,.35); font-weight:600; font-size:.86rem }
.bye-chip svg{ width:20px; height:auto }
.hub-meta .hm-done{ color:var(--white); font-weight:500 }

/* ============ the bracket (UEFA style) ============ */
.bk-wrap{ overflow-x:auto; padding:4px 2px 8px }
.bk{ direction:ltr; display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); column-gap:var(--gap); --gap:24px; --ln:rgba(201,211,232,.2); --ln-d:rgba(201,211,232,.5); min-width:980px; padding-bottom:64px }
.bk-col{ display:flex; flex-direction:column; min-width:0 }
.bk-h{ direction:rtl; height:32px; display:flex; align-items:center; justify-content:center; font-family:var(--f-disp); font-weight:600; font-size:.98rem; color:var(--gold); white-space:nowrap; border-bottom:1px solid var(--line); margin-bottom:8px }
.bk-col.mid .bk-h{ color:var(--white); font-size:1.12rem; border-bottom-color:rgba(242,193,78,.5) }
.bk-cells{ flex:1; display:flex; flex-direction:column; min-height:calc(var(--rows) * 106px) }
.bk-cell{ position:relative; flex:1; display:flex; align-items:center; padding:7px 0 }
.bk-cell > .bkm, .bk-cell > .bk-fin{ width:100% }
.bk-col.L .bk-cell::after, .bk-col.Rt .bk-cell::after{ content:''; position:absolute; top:50%; width:calc(var(--gap) / 2); border-top:2px solid var(--ln) }
.bk-col.L .bk-cell::after{ left:100% } .bk-col.Rt .bk-cell::after{ right:100% }
.bk-col.last .bk-cell::after{ width:var(--gap) }
.bk-col.L:not(.last) .bk-cell::before, .bk-col.Rt:not(.last) .bk-cell::before{ content:''; position:absolute; width:0; border-left:2px solid var(--ln) }
.bk-col.L:not(.last) .bk-cell::before{ left:calc(100% + var(--gap) / 2 - 1px) }
.bk-col.Rt:not(.last) .bk-cell::before{ right:calc(100% + var(--gap) / 2 - 1px) }
.bk-cell:nth-child(odd)::before{ top:50%; bottom:-1px } .bk-cell:nth-child(even)::before{ top:-1px; bottom:50% }
.ln-in{ position:absolute; top:50%; width:calc(var(--gap) / 2); border-top:2px solid var(--ln) }
.bk-col.L .ln-in{ right:100% } .bk-col.Rt .ln-in{ left:100% } .bk-col.mid .ln-in{ display:none }
.bk-cell.done::after, .bk-cell.done::before{ border-color:var(--ln-d) }
.bk-cell.cp::after, .bk-cell.cp::before, .bk-cell.cp > .ln-in{ border-color:var(--gold); filter:drop-shadow(0 0 4px rgba(242,193,78,.7)) }
.bkm{ direction:rtl; position:relative; display:flex; flex-direction:column; gap:1px; padding:9px 7px 6px; border-radius:12px; background:linear-gradient(180deg, rgba(22,46,112,.94), rgba(11,26,69,.94)); border:1px solid rgba(201,211,232,.2); text-align:start; color:inherit; font:inherit; transition:border-color .2s, transform .2s, box-shadow .2s }
button.bkm{ cursor:pointer }
button.bkm:hover{ border-color:var(--flood); transform:translateY(-1px) }
.bkm.tbd{ border-style:dashed; background:rgba(11,26,69,.55) }
.bkm.st-live, .bkm.st-wait, .bkm.st-pens{ border-color:rgba(47,208,122,.6); box-shadow:0 0 0 1px rgba(47,208,122,.2) }
.bkm.cp{ border-color:rgba(242,193,78,.8); box-shadow:0 0 0 1px rgba(242,193,78,.35), 0 0 24px rgba(242,193,78,.22) }
.bk-no{ position:absolute; top:-9px; inset-inline-end:8px; font-size:.62rem; padding:0 7px; border-radius:99px; background:#0b1a45; color:var(--silver); border:1px solid var(--line); line-height:1.55; white-space:nowrap; font-weight:500 }
.bk-r{ display:flex; align-items:center; gap:6px; min-height:33px; padding:1px 3px; border-radius:8px }
.bk-r svg{ width:22px; height:auto; flex:none }
.bk-r .tn{ flex:1; font-size:.84rem } .bk-r .tn-c{ font-size:.64rem } .bk-r .tn-g{ font-weight:600 }
.bk-s{ font-family:var(--f-num); font-size:1.4rem; line-height:1; min-width:.9ch; text-align:center; padding-top:3px; font-variant-numeric:tabular-nums }
.bk-r.w .tn-g, .bk-r.w .bk-s{ color:var(--gold) }
.bk-r.l{ opacity:.4 }
.bk-r.cpt{ background:rgba(242,193,78,.13) }
.bk-r.tbd .tn-c{ color:var(--muted) } .bk-r.tbd .tn-g{ font-weight:500; color:var(--silver); font-size:.78rem; white-space:normal }
.bk-pen, .bk-live{ font-size:.66rem; text-align:center; line-height:1.35; color:var(--silver) }
.bk-live{ color:var(--good) }
.bkm.bye{ border-style:dashed; border-color:rgba(242,193,78,.4); background:rgba(242,193,78,.05); padding-top:6px }
.bk-byel{ font-size:.7rem; color:var(--gold); text-align:center; line-height:1.4 }
.bk-fin{ position:relative; display:flex; flex-direction:column }
.bk-fin > .bkm{ border-color:rgba(242,193,78,.6); box-shadow:0 0 34px rgba(242,193,78,.16); padding-top:11px }
.bk-cup{ position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); width:54px; height:54px; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle at 50% 35%, rgba(242,193,78,.38), rgba(242,193,78,.05) 70%); color:var(--gold) }
.bk-cup .ic{ width:30px; height:30px }
.bk-champ{ position:absolute; top:calc(100% + 10px); left:0; right:0; direction:rtl; display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:12px; background:radial-gradient(120% 170% at 50% 0%, rgba(242,193,78,.32), rgba(19,41,106,.92) 62%); border:1px solid rgba(242,193,78,.65); color:inherit; font:inherit; text-align:start; cursor:pointer }
.bk-champ svg{ width:28px; height:auto; flex:none }
.bk-champ > span{ display:flex; flex-direction:column; min-width:0 }
.bk-champ small{ color:var(--gold); font-size:.68rem; font-weight:600 }
.bk-champ.tbd{ background:rgba(11,26,69,.55); border:1px dashed var(--line); flex-direction:column; gap:0; justify-content:center; cursor:default }
.bk-champ.tbd small{ color:var(--muted) } .bk-champ.tbd b{ font-family:var(--f-num); font-size:1.5rem; color:var(--muted); line-height:1 }
.bk-stack{ display:none }
.bks-r h4{ display:flex; align-items:baseline; gap:10px; font-family:var(--f-disp); font-weight:600; color:var(--gold); margin-bottom:10px }
.bks-r h4 small{ font-family:var(--f-num); letter-spacing:.14em; color:var(--flood); font-size:.85rem }
.bks-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:16px 10px }

/* ============ «الشعب»: inter-class leaderboard ============ */
.cls-board{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:14px }
.cls-card{ position:relative; display:flex; flex-direction:column; gap:12px; padding:18px 20px 14px; border-radius:var(--r-l); background:linear-gradient(155deg, color-mix(in srgb, var(--cc) 24%, #0b1a45), rgba(11,26,69,.94) 58%); border:1px solid color-mix(in srgb, var(--cc) 45%, transparent); overflow:hidden }
.cls-card::before{ content:''; position:absolute; inset-block:0; inset-inline-start:0; width:6px; background:var(--cc) }
.cls-card.top{ box-shadow:0 0 0 1px rgba(242,193,78,.55), 0 16px 44px rgba(242,193,78,.13) }
.cls-rank{ position:absolute; top:10px; inset-inline-end:16px; font-family:var(--f-num); font-size:3rem; line-height:1; color:rgba(245,247,255,.2) }
.cls-card.top .cls-rank{ color:var(--gold) }
.cls-head{ padding-inline-end:48px }
.cls-head b{ display:block; font-family:var(--f-disp); font-size:1.5rem; line-height:1.25 }
.cls-head small{ color:var(--muted); font-size:.85rem }
.cls-head .gold{ color:var(--gold) } .cls-head .gold .ic{ display:inline; width:14px; height:14px; vertical-align:-2px }
.cls-crests{ display:flex; flex-wrap:wrap; gap:6px }
.cls-g svg{ width:30px; height:auto; display:block; transition:opacity .3s }
.cls-g.out svg{ opacity:.24; filter:grayscale(.9) }
.cls-g.champ svg{ filter:drop-shadow(0 0 8px rgba(242,193,78,.85)) }
.cls-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px; margin:0 }
.cls-stats div{ padding:8px 4px 6px; border-radius:12px; background:rgba(6,13,36,.5); text-align:center }
.cls-stats dt{ font-size:.74rem; color:var(--muted) }
.cls-stats dd{ margin:0; font-family:var(--f-num); font-size:2rem; line-height:1.05; padding-top:3px; font-variant-numeric:tabular-nums }
.cls-stats dd small{ font-size:1rem; color:var(--muted) }
.cls-x{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.86rem; color:var(--silver) }
.cls-x .ic{ width:15px; height:15px; color:var(--flood) }
.cls-x b{ font-family:var(--f-num); font-size:1.15rem; color:var(--white); vertical-align:-1px }

/* ============ statistics ============ */
.st-h{ display:flex; align-items:center; gap:8px; font-size:1.1rem; margin:22px 0 10px }
.st-h .ic{ color:var(--flood) } .st-h small{ color:var(--muted); font-weight:400; font-size:.8rem }
.gstats{ width:100%; border-collapse:collapse; min-width:860px; font-variant-numeric:tabular-nums }
.gstats th{ font-weight:500; font-size:.82rem; color:var(--silver); padding:10px 8px; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35); white-space:nowrap; text-align:center }
.gstats th.tm, .gstats td.tm{ text-align:start }
.th-c{ display:inline-flex; align-items:center; gap:4px; color:var(--cc) } .th-c .ic{ width:14px; height:14px }
.gstats td{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:center }
.gstats tr:last-child td{ border-bottom:0 }
.gstats td.rk{ font-family:var(--f-num); font-size:1.2rem; color:var(--muted); width:36px }
.gstats td.g{ font-family:var(--f-num); font-size:1.55rem; color:var(--gold) }
.gstats td.pc{ white-space:nowrap }
.gstats td.pc > span:last-child{ display:inline-block; min-width:3ch; font-size:.82rem; color:var(--silver); margin-inline-start:6px }
.gstats .tm-in svg{ width:26px }
.mini-bar{ display:inline-block; width:54px; height:6px; border-radius:99px; background:rgba(201,211,232,.14); overflow:hidden; vertical-align:middle }
.mini-bar i{ display:block; height:100% }

/* ============ intro additions ============ */
.intro-top{ gap:10px }
.intro-brand{ display:inline-flex; align-items:center; gap:8px; font-family:var(--f-disp); font-weight:600; color:var(--gold); font-size:1rem }
.intro-brand svg{ width:36px; height:36px }
.sug{ font-style:normal; font-size:.68rem; font-weight:600; padding:0 7px; margin-inline-start:6px; border-radius:99px; background:rgba(242,193,78,.2); color:var(--gold); vertical-align:1px }
.seg-b.on .sug{ background:rgba(4,17,46,.22); color:#04112e }
.mode-why{ color:var(--silver); line-height:1.65 } .mode-why b{ color:var(--white) }
.pens-ready.sd{ border-color:rgba(242,193,78,.55) }
.pens-ready .ovl-actions{ margin-top:4px }

/* ============ correct-answer moment: gold starburst + light sweep + sparkles from the crest, «+1», digit flip ============ */
.res-fx{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none }
.ovl-card.res > :not(.res-fx){ position:relative }
.burst{ position:absolute; left:50%; top:110px; width:1200px; height:1200px; margin:-600px 0 0 -600px; background:repeating-conic-gradient(from 0deg, rgba(242,193,78,.26) 0deg 5deg, transparent 5deg 15deg); -webkit-mask:radial-gradient(circle, #000 0 6%, rgba(0,0,0,.6) 16%, transparent 36%); mask:radial-gradient(circle, #000 0 6%, rgba(0,0,0,.6) 16%, transparent 36%); animation:burstIn .7s var(--ease) both, spin 26s linear infinite }
.res-fx::after{ content:''; position:absolute; left:50%; top:110px; width:420px; height:260px; margin:-130px 0 0 -210px; background:radial-gradient(ellipse, rgba(242,193,78,.24), transparent 65%); animation:fadeIn .5s both }
.is-no .res-fx::after{ display:none }
.sweep{ position:absolute; top:-20%; bottom:-20%; left:-45%; width:38%; background:linear-gradient(90deg, transparent, rgba(255,241,191,.3), transparent); transform:skewX(-18deg); animation:sweep 1.2s .2s ease-out both }
.res-crest svg{ width:clamp(70px,min(7vw,12vh),112px); height:auto; filter:drop-shadow(0 0 26px rgba(242,193,78,.55)) drop-shadow(0 10px 20px rgba(0,0,0,.4)); animation:crestPop .75s var(--ease) both }
.is-no .res-crest svg{ filter:grayscale(.8) brightness(.8); animation:fadeIn .4s both }
.is-no .res-t{ animation:fadeUp .45s var(--ease) both }
.is-no .res-team{ filter:saturate(.4) }
.res-crest{ position:relative }
.spark{ position:absolute; left:50%; top:46%; width:14px; height:14px; margin:-7px 0 0 -7px; background:linear-gradient(135deg,#fff6d6,#f2c14e); clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); opacity:0; animation:spark 1.15s var(--ease) var(--dl) both; pointer-events:none }
.spark:nth-child(3n){ background:#ffffff } .spark:nth-child(4n){ width:9px; height:9px; margin:-4.5px 0 0 -4.5px }
.plus-tag{ display:inline-flex; align-items:center; padding:1px 12px; border-radius:99px; background:linear-gradient(180deg,#ffe08a,#e2a82c); color:#241500; font-family:var(--f-num); font-weight:600; font-size:clamp(18px,min(1.4vw,2.5vh),24px); line-height:1.35; padding-top:3px; box-shadow:0 6px 20px rgba(242,193,78,.35) }
.res-for{ color:var(--silver) }
.plus1{ position:fixed; z-index:60; font-family:var(--f-num); font-weight:600; font-size:clamp(44px,5.2vw,76px); line-height:1; color:var(--gold); text-shadow:0 0 26px rgba(242,193,78,.75), 0 4px 14px rgba(0,0,0,.5); pointer-events:none; will-change:transform }
.ovl-res.calm{ background:rgba(4,9,26,.74) }
.ovl-res.calm .ovl-card{ border-color:rgba(201,211,232,.22) }
.fl{ position:relative; display:inline-block; overflow:hidden; vertical-align:bottom }
.fl::before{ content:attr(data-o); position:absolute; left:0; right:0; top:0; text-align:center; animation:flOut .5s .15s var(--ease) both }
.fl-n{ display:inline-block; font-style:normal; animation:flIn .5s .15s var(--ease) both }

/* ============ motion ============ */
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
@keyframes cardIn{ from{opacity:0; transform:translateY(18px) scale(.97)} to{opacity:1; transform:none} }
@keyframes qIn{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
@keyframes popIn{ 0%{opacity:0; transform:scale(.6)} 70%{opacity:1; transform:scale(1.06)} 100%{transform:scale(1)} }
@keyframes toastIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
@keyframes blink{ 0%,100%{border-color:var(--flood)} 50%{border-color:rgba(124,196,255,.3)} }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.35); color:var(--gold)} 100%{transform:scale(1)} }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes correctPop{ 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes slotIn{ from{transform:scale(.8)} to{transform:scale(1)} }
@keyframes cheerPop{ 0%{opacity:0; transform:scale(.4) rotate(-6deg)} 60%{opacity:1; transform:scale(1.12) rotate(2deg)} 100%{transform:scale(1) rotate(0)} }
@keyframes numPop{ 0%{transform:scale(.6)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes coinUp{ 0%{translate:0 0} 45%{translate:0 -46px} 100%{translate:0 0} }
@keyframes rise{ from{opacity:0; transform:translateY(40px) scale(.9)} to{opacity:1; transform:none} }
@keyframes dpIn{ 0%{opacity:0; transform:scale(.86) translateY(6px)} 70%{opacity:1; transform:scale(1.02)} 100%{opacity:1; transform:none} }
@keyframes capWait{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes burstIn{ from{opacity:0; scale:.4} to{opacity:1; scale:1} }
@keyframes spin{ to{ rotate:360deg } }
@keyframes sweep{ from{ left:-45% } to{ left:120% } }
@keyframes crestPop{ 0%{opacity:0; transform:scale(.5) rotate(-8deg)} 60%{opacity:1; transform:scale(1.12) rotate(2deg)} 100%{transform:none} }
@keyframes spark{ 0%{ opacity:0; transform:rotate(var(--a)) translateY(0) scale(.2) } 20%{ opacity:1 } 100%{ opacity:0; transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(var(--s)) rotate(160deg) } }
@keyframes flOut{ from{ transform:translateY(0); opacity:1 } to{ transform:translateY(-100%); opacity:0 } }
@keyframes flIn{ from{ transform:translateY(100%); opacity:0 } to{ transform:none; opacity:1 } }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0ms!important; transition-duration:.15s!important }
  .ovl, .modal-bg, .toast{ animation:fadeIn .2s ease both!important }
  .home-emblem .seal-svg{ animation:none!important }
  .burst{ animation:none!important } .sweep, .spark{ display:none }
  .dp-card{ opacity:1; transform:none }
}

/* ============ responsive ============ */
@media (max-width: 1100px){
  .tool kbd{ display:none } /* tablets: keep the teacher toolbar on one screen width */
  .setup-grid{ grid-template-columns:1fr }
  .fx-list.ko{ grid-template-columns:1fr }
  .intro-grid, .intro-grid.no-toss{ grid-template-columns:1fr 1fr }
  .ip-lineup{ grid-column:1 / -1; order:-1 }
  .help-types{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .champ-grid{ grid-template-columns:1fr }
  .cat-strip{ grid-template-columns:repeat(2,minmax(0,1fr)) }
}
@media (max-width: 900px){
  .tool > span, .tool kbd{ display:none }
  .tools{ justify-content:flex-start }

  .fx-act{ grid-column:1 / -1; display:flex; justify-content:center }
  .fx-act:has(.fx-lock){ display:none }
  .bk{ display:none } .bk-stack{ display:flex; flex-direction:column; gap:18px }
  .dp-list{ grid-template-columns:1fr; grid-auto-flow:row; grid-template-rows:none }
  .help-grid{ grid-template-columns:1fr }
  .qp-n{ display:none }
}

  .fo .tn{ align-items:center; text-align:center }

  .sb .tn-l, .turn .tn-l{ display:none } .sb .tn-s, .turn .tn-s{ display:inline }

  .dp-t svg{ width:26px }

  .road li{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:4px 10px }
  .road li .rd-stage{ grid-column:1 / -1; min-width:0 }
  .road li small{ grid-column:1 / -1 }
  .type-groups{ grid-template-columns:1fr }
  .intro-grid, .intro-grid.no-toss{ grid-template-columns:1fr }
  .fo{ flex-direction:column; gap:8px }
  .fo.b{ flex-direction:column }

function bankFilter() {

<div class="help-grid">
<article class="panel"><h2>${icon('trophy')} نظام البطولة</h2><ul class="ticks">
<li><b>المتنافسون:</b> مجموعات الشعب — 5 مجموعات في 10/5 و5 في 10/6 و6 في 10/7 = <b>16 مجموعة</b>. لكل شعبة لون، ولكل مجموعة شعار بلون شعبتها ورقمها.</li>
<li><b>خروج المغلوب (بدون إياب):</b> دور الـ16 ← ربع النهائي (دور الثمانية) ← نصف النهائي (دور الأربعة) ← النهائي. كل مواجهة مباراة واحدة، والفائز يتأهل، والفائز في النهائي هو البطل.</li>
<li><b>المسار ثابت كالمخطط:</b> الفائز من المباراة 1 يواجه الفائز من المباراة 2 وهكذا. وإذا لم يكن العدد 16 (مثل 12 أو 15) تحصل بعض المجموعات على <b>تأهل مباشر</b> بالقرعة.</li>
<li><b>القرعة:</b> عشوائية بالكامل، أو «حماية الشعبة» (لا تلتقي مجموعتان من الشعبة نفسها في الدور الأول)، أو «مواجهات داخل الشعبة أولاً».</li>
<li>تُلعب أي مباراة <b>فور معرفة طرفيها</b> وبأي ترتيب — لا حاجة لإنهاء الدور كاملًا.</li>
<li>التعادل يُحسم بـ<b>ركلات الترجيح</b>: 5 ركلات لكل مجموعة (كل ركلة سؤال معنى سريع)، ثم ركلة مقابل ركلة.</li></ul></article>
<article class="panel"><h2>${icon('whistle')} المباراة</h2><ul class="ticks">
<li>تجيب كل مجموعة في المباراة عن <b>5 أسئلة متنوعة</b> — كل سؤال «هجمة» — ويقابله سؤال للمجموعة الأخرى من النوع والمستوى نفسيهما (أسئلة متقابلة).</li>
<li>كل الأسئلة من <b>كلمات الوحدة الأولى فقط</b>${nW ? ` (${num(nW)} كلمة وعبارة)` : ''}: المعاني والخيارات والجمل والتوصيل وركلات الترجيح.</li>
<li>الإجابة الصحيحة = <b>نقطة</b> للمجموعة، والخاطئة أو انتهاء الوقت = لا نقطة. الأكثر نقاطًا يفوز بالمباراة.</li>
<li><b>قرعة العملة</b> تحدد من يبدأ السؤال الأول، ثم يتبدل من يبدأ في كل سؤال.</li>
<li><b>مباشر:</b> المجموعتان معًا وتتناوب الأسئلة — يُقترح تلقائيًا لمجموعتين من الشعبة نفسها. <b>على حصتين:</b> كل مجموعة تلعب في حصة شعبتها بالأسئلة نفسها، والنتيجة مخفية حتى النهاية — يُقترح لمجموعتين من شعبتين مختلفتين.</li>
<li>في مباراة «على حصتين» تُسدَّد ركلات الترجيح على حصتين أيضًا (5 لكل مجموعة، والنتيجة مخفية)، وإذا استمر التعادل تُلعب ركلات الحسم بحضور المجموعتين معًا.</li>
<li>بعد كل إجابة تظهر بطاقة تعلّم: الكلمة ومعناها وجملة المثال.</li></ul></article>
<article class="panel wide"><h2>${icon('list')} أنواع الأسئلة</h2><div class="help-types">${CAT_IDS.map((c) => `<div class="ht-cat" style="--cc:${CATS[c].color}"><h3>${icon(CATS[c].icon)} ${CATS[c].ar} <small dir="ltr" lang="en">${CATS[c].en}</small></h3>${TYPE_IDS.filter((t) => TYPES[t].cat === c).map((t) => `<div class="ht-type"><b>${TYPES[t].ar}</b><span>${ex[t]}</span></div>`).join('')}</div>`).join('')}</div></article>
<article class="panel"><h2>${icon('sliders')} العدالة في التنويع</h2><ul class="ticks">

<li>المجموعتان تحصلان في كل سؤال على <b>النوع نفسه والمستوى نفسه</b>، وطول الكلمة متقارب في أسئلة الإملاء والحروف.</li>

<article class="panel"><h2>${icon('sparkle')} اختصارات لوحة المفاتيح</h2><table class="keys">${keys.map(([k, d]) => `<tr><td><kbd dir="ltr">${k}</kbd></td><td>${d}</td></tr>`).join('')}</table><p class="muted small">تعمل الاختصارات والكتابة سواء كانت لغة لوحة المفاتيح عربية أو إنجليزية.</p></article>
<article class="panel"><h2>${icon('help')} نصائح للمعلم</h2><ul class="ticks">
