.sg b{ font-size:1.8cqw; min-height:1.2em }
.sg i{ display:block; width:80%; height:.15cqw; background:#0b1a45; margin-top:1.8cqw }
.seal .medal{ width:7cqw; height:auto }

/* ============ bank ============ */
.bank-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px }
.search{ flex:1; min-width:240px; display:flex; align-items:center; gap:10px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.6) }
.search:focus-within{ border-color:var(--flood); box-shadow:0 0 0 3px rgba(124,196,255,.2) }
.search .ic{ color:var(--muted) }
.search input{ flex:1; min-height:48px; border:0; background:none; outline:none; font-size:1rem; min-width:0 }
.bank-count b{ font-family:var(--f-num); font-size:1.5rem; color:var(--gold); vertical-align:-3px }
.bank-units{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px }
.unit{ border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); overflow:hidden }
.unit summary{ display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; list-style:none; min-height:56px }
.unit summary::-webkit-details-marker{ display:none }
.unit summary:hover{ background:rgba(255,255,255,.03) }
.chev{ transition:transform .25s; color:var(--muted) }
.unit[open] .chev{ transform:rotate(180deg) }
.unit .tbl-wrap{ border-radius:0; border:0; border-top:1px solid var(--line); background:rgba(6,13,36,.3) }
.u-lv{ display:flex; gap:4px }
.lvp{ font-family:var(--f-num); font-size:.95rem; min-width:26px; text-align:center; border-radius:8px; padding:1px 4px 0; line-height:1.4 }
.lvp.l1{ background:rgba(47,208,122,.16); color:var(--good) } .lvp.l2{ background:rgba(242,193,78,.16); color:var(--gold) } .lvp.l3{ background:rgba(255,90,106,.16); color:#ff9aa5 }
.words{ width:100%; border-collapse:collapse; min-width:640px }
.words th{ text-align:start; padding:10px 12px; font-weight:500; font-size:.84rem; color:var(--silver); border-bottom:1px solid var(--line) }
.words td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle }
.words tr:last-child td{ border-bottom:0 }
.words td.w{ font-weight:700; font-size:1.08rem }
.words td.ex{ color:var(--muted); font-size:.88rem; max-width:360px }
.words tr.bad td{ background:rgba(255,90,106,.06) }
.words .ic{ display:inline }
.my-words{ display:flex; flex-direction:column; gap:12px }
.my-words textarea{ width:100%; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.65); padding:12px 14px; resize:vertical; font-size:1rem; line-height:1.7; min-height:140px }
.my-words textarea:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.2) }
.h3{ font-size:1.05rem; margin-top:6px }
.pv-sum{ display:flex; gap:10px; align-items:center; font-weight:600 }

/* ============ help ============ */
.help-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.help-grid .wide{ grid-column:1 / -1 }
.ticks{ margin:0; padding-inline-start:1.2em; display:flex; flex-direction:column; gap:8px; color:var(--silver) }
.ticks b{ color:var(--white) }
.help-flow{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; margin:4px 0 2px }
.help-flow span{ padding:4px 14px; border-radius:99px; background:var(--glass-3); border:1px solid var(--line); font-weight:600 }
.help-flow span.gold{ border-color:rgba(242,193,78,.6); color:var(--gold) }
.help-flow i{ font-style:normal; color:var(--gold) }
.help-types{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }
.ht-cat{ position:relative; padding:12px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px }
.ht-cat h3{ display:flex; align-items:center; gap:6px; font-size:1rem; color:var(--white) }
.ht-cat h3 .ic{ color:var(--cc) }
.ht-cat h3 small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.ht-type{ display:flex; flex-direction:column; gap:2px; font-size:.88rem }
.ht-type span{ color:var(--muted) }
.keys{ border-collapse:collapse; width:100% }
.keys td{ padding:6px 8px; border-bottom:1px solid var(--line) }
.keys tr:last-child td{ border-bottom:0 }
kbd{ font-family:var(--f-num); font-size:1rem; padding:1px 8px; border-radius:7px; border:1px solid var(--line); background:rgba(255,255,255,.06); white-space:nowrap }
.help-foot{ text-align:center; margin-top:22px }

/* ============ team names ============ */
.tn{ display:inline-flex; flex-direction:column; min-width:0; line-height:1.15; text-align:start; vertical-align:middle }
.tn-c{ font-size:.74em; font-weight:600; color:var(--cc, var(--silver)); white-space:nowrap; letter-spacing:.01em }
.tn-g{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:100% }
.tn-s, .tl-s{ display:none }
.fx-t .tn-g{ font-size:1.1rem } .fx-t .tn-c{ font-size:.8rem }
.fx-t.win .tn-g{ color:var(--gold) }
.fx-t.tbd .tn-c{ color:var(--muted) }
.fx-t.tbd .tn-g{ color:var(--silver); font-weight:500; font-size:.9rem; white-space:normal }
.tm-in .tn-g{ font-size:1.04rem } .tm-in .tn-c{ font-size:.76rem }
.sc header .tn{ flex:1 } .sc header .tn-g{ font-size:1.12rem }
.bk-champ .tn-g{ font-size:.9rem } .bk-champ .tn-c{ font-size:.68rem }

/* ============ the bracket (UEFA style) ============ */
.bk-wrap{ overflow-x:auto; padding:4px 2px 8px }
.bkt{ direction:ltr; display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); column-gap:var(--gap); --gap:24px; --ln:rgba(201,211,232,.2); --ln-d:rgba(201,211,232,.5); min-width:980px; padding-bottom:64px }
.bk-col{ display:flex; flex-direction:column; min-width:0 }
.bk-h{ direction:rtl; height:32px; display:flex; align-items:center; justify-content:center; font-family:var(--f-disp); font-weight:600; font-size:.98rem; color:var(--gold); white-space:nowrap; border-bottom:1px solid var(--line); margin-bottom:8px }
.bk-col.mid .bk-h{ color:var(--white); font-size:1.12rem; border-bottom-color:rgba(242,193,78,.5) }
.bk-cells{ flex:1; display:flex; flex-direction:column; min-height:calc(var(--rows) * 106px) }
.bk-cell{ position:relative; flex:1; display:flex; align-items:center; padding:7px 0 }
.bk-cell > .bkm, .bk-cell > .bk-fin{ width:100% }
.bk-col.L .bk-cell::after, .bk-col.Rt .bk-cell::after{ content:''; position:absolute; top:50%; width:calc(var(--gap) / 2); border-top:2px solid var(--ln) }
.bk-col.L .bk-cell::after{ left:100% } .bk-col.Rt .bk-cell::after{ right:100% }
.bk-col.last .bk-cell::after{ width:var(--gap) }
.bk-col.L:not(.last) .bk-cell::before, .bk-col.Rt:not(.last) .bk-cell::before{ content:''; position:absolute; width:0; border-left:2px solid var(--ln) }
.bk-col.L:not(.last) .bk-cell::before{ left:calc(100% + var(--gap) / 2 - 1px) }
.bk-col.Rt:not(.last) .bk-cell::before{ right:calc(100% + var(--gap) / 2 - 1px) }
.bk-cell:nth-child(odd)::before{ top:50%; bottom:-1px } .bk-cell:nth-child(even)::before{ top:-1px; bottom:50% }
.ln-in{ position:absolute; top:50%; width:calc(var(--gap) / 2); border-top:2px solid var(--ln) }
.bk-col.L .ln-in{ right:100% } .bk-col.Rt .ln-in{ left:100% } .bk-col.mid .ln-in{ display:none }
.bk-cell.done::after, .bk-cell.done::before{ border-color:var(--ln-d) }
.bk-cell.cp::after, .bk-cell.cp::before, .bk-cell.cp > .ln-in{ border-color:var(--gold); filter:drop-shadow(0 0 4px rgba(242,193,78,.7)) }
.bkm{ direction:rtl; position:relative; display:flex; flex-direction:column; gap:1px; padding:9px 7px 6px; border-radius:12px; background:linear-gradient(180deg, rgba(22,46,112,.94), rgba(11,26,69,.94)); border:1px solid rgba(201,211,232,.2); text-align:start; color:inherit; font:inherit; transition:border-color .2s, box-shadow .2s }
button.bkm{ cursor:pointer }
button.bkm:hover{ border-color:var(--flood) }
.bkm.tbd{ border-style:dashed; background:rgba(11,26,69,.55) }
.bkm.st-live, .bkm.st-wait, .bkm.st-tie{ border-color:rgba(47,208,122,.6); box-shadow:0 0 0 1px rgba(47,208,122,.2) }
.bkm.cp{ border-color:rgba(242,193,78,.8); box-shadow:0 0 0 1px rgba(242,193,78,.35), 0 0 24px rgba(242,193,78,.22) }
.bk-no{ position:absolute; top:-9px; inset-inline-end:8px; font-size:.62rem; padding:0 7px; border-radius:99px; background:#0b1a45; color:var(--silver); border:1px solid var(--line); line-height:1.55; white-space:nowrap; font-weight:500 }
.bk-r{ display:flex; align-items:center; gap:6px; min-height:33px; padding:1px 3px; border-radius:8px }
.bk-r svg{ width:22px; height:auto; flex:none }
.bk-r .tn{ flex:1; font-size:.84rem } .bk-r .tn-c{ font-size:.64rem } .bk-r .tn-g{ font-weight:600 }
.bk-s{ font-family:var(--f-num); font-size:1.4rem; line-height:1; min-width:.9ch; text-align:center; padding-top:3px; font-variant-numeric:tabular-nums }
.bk-r.w .tn-g, .bk-r.w .bk-s{ color:var(--gold) }
.bk-r.l{ opacity:.4 }
.bk-r.cpt{ background:rgba(242,193,78,.13) }
.bk-r.tbd .tn-c{ color:var(--muted) } .bk-r.tbd .tn-g{ font-weight:500; color:var(--silver); font-size:.78rem; white-space:normal }
.bk-foot{ font-size:.66rem; text-align:center; line-height:1.35; color:var(--silver) }
.bk-foot.live{ color:var(--good) } .bk-foot.tie{ color:var(--gold) }
.bkm.bye{ border-style:dashed; border-color:rgba(242,193,78,.4); background:rgba(242,193,78,.05); padding-top:6px }
.bk-byel{ font-size:.7rem; color:var(--gold); text-align:center; line-height:1.4 }
.bk-fin{ position:relative; display:flex; flex-direction:column; gap:10px }
.bk-fin > .bkm.fin{ border-color:rgba(242,193,78,.6); box-shadow:0 0 34px rgba(242,193,78,.16); padding-top:11px }
.bk-fin > .bkm.third{ border-color:rgba(205,138,75,.6) }
.bk-cup{ position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); width:54px; height:54px; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle at 50% 35%, rgba(242,193,78,.38), rgba(242,193,78,.05) 70%); color:var(--gold) }
.bk-cup .ic{ width:30px; height:30px }
.bk-champ{ direction:rtl; display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:12px; background:radial-gradient(120% 170% at 50% 0%, rgba(242,193,78,.32), rgba(19,41,106,.92) 62%); border:1px solid rgba(242,193,78,.65); color:inherit; font:inherit; text-align:start; cursor:pointer }
.bk-champ svg{ width:28px; height:auto; flex:none }
.bk-champ > span{ display:flex; flex-direction:column; min-width:0 }
.bk-champ small{ color:var(--gold); font-size:.68rem; font-weight:600 }
.bk-champ.tbd{ background:rgba(11,26,69,.55); border:1px dashed var(--line); flex-direction:column; gap:0; justify-content:center; cursor:default }
.bk-champ.tbd small{ color:var(--muted) } .bk-champ.tbd b{ font-family:var(--f-num); font-size:1.5rem; color:var(--muted); line-height:1 }
.bk-stack{ display:none }
.bks-r h4{ display:flex; align-items:baseline; gap:10px; font-family:var(--f-disp); font-weight:600; color:var(--gold); margin-bottom:10px }
.bks-r h4 small{ font-family:var(--f-num); letter-spacing:.14em; color:var(--flood); font-size:.85rem }
.bks-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:16px 10px }

/* ============ «الشعب»: inter-class leaderboard ============ */
.cls-board{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:14px }
.cls-card{ position:relative; display:flex; flex-direction:column; gap:12px; padding:18px 20px 14px; border-radius:var(--r-l); background:linear-gradient(155deg, color-mix(in srgb, var(--cc) 24%, #0b1a45), rgba(11,26,69,.94) 58%); border:1px solid color-mix(in srgb, var(--cc) 45%, transparent); overflow:hidden }
.cls-card::before{ content:''; position:absolute; inset-block:0; inset-inline-start:0; width:6px; background:var(--cc) }
.cls-card.top{ box-shadow:0 0 0 1px rgba(242,193,78,.55), 0 16px 44px rgba(242,193,78,.13) }
.cls-rank{ position:absolute; top:10px; inset-inline-end:16px; font-family:var(--f-num); font-size:3rem; line-height:1; color:rgba(245,247,255,.2) }
.cls-card.top .cls-rank{ color:var(--gold) }
.cls-head{ padding-inline-end:48px }
.cls-head b{ display:block; font-family:var(--f-disp); font-size:1.5rem; line-height:1.25 }
.cls-head small{ color:var(--muted); font-size:.85rem }
.cls-head .gold{ color:var(--gold) } .cls-head .gold .ic{ display:inline; width:14px; height:14px; vertical-align:-2px }
.cls-crests{ display:flex; flex-wrap:wrap; gap:6px }
.cls-g svg{ width:30px; height:auto; display:block; transition:opacity .3s }
.cls-g.out svg{ opacity:.24; filter:grayscale(.9) }
.cls-g.champ svg{ filter:drop-shadow(0 0 8px rgba(242,193,78,.85)) }
.cls-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px; margin:0 }
.cls-stats div{ padding:8px 4px 6px; border-radius:12px; background:rgba(6,13,36,.5); text-align:center }
.cls-stats dt{ font-size:.74rem; color:var(--muted) }
.cls-stats dd{ margin:0; font-family:var(--f-num); font-size:2rem; line-height:1.05; padding-top:3px; font-variant-numeric:tabular-nums }
.cls-stats dd small{ font-size:1rem; color:var(--muted) }
.cls-x{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.86rem; color:var(--silver) }
.cls-x .ic{ width:15px; height:15px; color:var(--flood) }
.cls-x b{ font-family:var(--f-num); font-size:1.15rem; color:var(--white); vertical-align:-1px }

/* ============ statistics ============ */
.st-h{ display:flex; align-items:center; gap:8px; font-size:1.1rem; margin:22px 0 10px }
.st-h .ic{ color:var(--flood) } .st-h small{ color:var(--muted); font-weight:400; font-size:.8rem }
.gstats{ width:100%; border-collapse:collapse; min-width:860px; font-variant-numeric:tabular-nums }
.gstats th{ font-weight:500; font-size:.82rem; color:var(--silver); padding:10px 8px; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35); white-space:nowrap; text-align:center }
.gstats th.tm, .gstats td.tm{ text-align:start }
.th-c{ display:inline-flex; align-items:center; gap:4px; color:var(--cc) } .th-c .ic{ width:14px; height:14px }
.gstats td{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:center }
.gstats tr:last-child td{ border-bottom:0 }
.gstats td.rk{ font-family:var(--f-num); font-size:1.2rem; color:var(--muted); width:36px }
.gstats td.g{ font-family:var(--f-num); font-size:1.55rem; color:var(--gold) }
.gstats td.pc{ white-space:nowrap }
.gstats td.pc > span:last-child{ display:inline-block; min-width:3ch; font-size:.82rem; color:var(--silver); margin-inline-start:6px }
.gstats .tm-in svg{ width:26px }
.mini-bar{ display:inline-block; width:54px; height:6px; border-radius:99px; background:rgba(201,211,232,.14); overflow:hidden; vertical-align:middle }
.mini-bar i{ display:block; height:100% }

/* ============ correct-answer moment: gold starburst + light sweep + sparkles from the crest, «+1», digit flip ============ */
.res-fx{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none }
.ovl-card.res > :not(.res-fx){ position:relative }
.burst{ position:absolute; left:50%; top:110px; width:1200px; height:1200px; margin:-600px 0 0 -600px; background:repeating-conic-gradient(from 0deg, rgba(242,193,78,.26) 0deg 5deg, transparent 5deg 15deg); -webkit-mask:radial-gradient(circle, #000 0 6%, rgba(0,0,0,.6) 16%, transparent 36%); mask:radial-gradient(circle, #000 0 6%, rgba(0,0,0,.6) 16%, transparent 36%); animation:fadeIn .7s ease both, spin 26s linear infinite }
.res-fx::after{ content:''; position:absolute; left:50%; top:110px; width:420px; height:260px; margin:-130px 0 0 -210px; background:radial-gradient(ellipse, rgba(242,193,78,.24), transparent 65%); animation:fadeIn .5s both }
.is-no .res-fx::after{ display:none }
.sweep{ position:absolute; top:-20%; bottom:-20%; left:-45%; width:38%; background:linear-gradient(90deg, transparent, rgba(255,241,191,.3), transparent); transform:skewX(-18deg); animation:sweep 1.2s .2s ease-out both }
.res-crest svg{ width:clamp(70px,min(7vw,12vh),112px); height:auto; filter:drop-shadow(0 0 26px rgba(242,193,78,.55)) drop-shadow(0 10px 20px rgba(0,0,0,.4)); animation:fadeIn .5s ease both }
.is-no .res-crest svg{ filter:grayscale(.8) brightness(.8) }
.is-no .res-team{ filter:saturate(.4) }
.res-crest{ position:relative }
.spark{ position:absolute; left:50%; top:46%; width:14px; height:14px; margin:-7px 0 0 -7px; background:linear-gradient(135deg,#fff6d6,#f2c14e); clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); opacity:0; animation:spark 1.15s var(--ease) var(--dl) both; pointer-events:none }
.spark:nth-child(3n){ background:#ffffff } .spark:nth-child(4n){ width:9px; height:9px; margin:-4.5px 0 0 -4.5px }
.plus-tag{ display:inline-flex; align-items:center; gap:.3em; padding:1px 12px; border-radius:99px; background:linear-gradient(180deg,#ffe08a,#e2a82c); color:#241500; font-family:var(--f-num); font-weight:600; font-size:clamp(18px,min(1.4vw,2.5vh),24px); line-height:1.35; padding-top:3px; box-shadow:0 6px 20px rgba(242,193,78,.35) }
.res-for{ color:var(--silver) }
.plus1{ position:fixed; z-index:60; font-family:var(--f-num); font-weight:600; font-size:clamp(44px,5.2vw,76px); line-height:1; color:var(--gold); text-shadow:0 0 26px rgba(242,193,78,.75), 0 4px 14px rgba(0,0,0,.5); pointer-events:none; will-change:transform }
.fl{ position:relative; display:inline-block; overflow:hidden; vertical-align:bottom }
.fl::before{ content:attr(data-o); position:absolute; left:0; right:0; top:0; text-align:center; animation:flOut .5s .15s var(--ease) both }
.fl-n{ display:inline-block; font-style:normal; animation:flIn .5s .15s var(--ease) both }

/* ============ motion ============ */
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
@keyframes tieIn{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
@keyframes nowPulse{ 0%,100%{opacity:1} 50%{opacity:.72} }
@keyframes glowGold{ 0%,100%{text-shadow:0 8px 40px rgba(242,193,78,.45)} 50%{text-shadow:0 0 60px rgba(255,224,138,.95), 0 8px 40px rgba(242,193,78,.6)} }
@keyframes blink{ 0%,100%{border-color:var(--flood)} 50%{border-color:rgba(124,196,255,.3)} }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes tcBar{ from{transform:scaleX(1)} to{transform:scaleX(0)} }
@keyframes coinUp{ 0%{translate:0 0} 45%{translate:0 -46px} 100%{translate:0 0} }
@keyframes rise{ from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:none} }
@keyframes spin{ to{ rotate:360deg } }
@keyframes sweep{ from{ left:-45% } to{ left:120% } }
@keyframes spark{ 0%{ opacity:0; transform:rotate(var(--a)) translateY(0) scale(.2) } 20%{ opacity:1 } 100%{ opacity:0; transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(var(--s)) rotate(160deg) } }
@keyframes flOut{ from{ transform:translateY(0); opacity:1 } to{ transform:translateY(-100%); opacity:0 } }
@keyframes flIn{ from{ transform:translateY(100%); opacity:0 } to{ transform:none; opacity:1 } }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0ms!important; transition-duration:.15s!important }
  .ovl, .modal-bg, .toast{ animation:fadeIn .2s ease both!important }
  .home-emblem .seal-svg{ animation:none!important }
  .burst{ animation:none!important } .sweep, .spark{ display:none }
  .tie.on .tie-in{ opacity:1 }
}

/* ============ responsive ============ */
@media (max-width: 1100px){
  .tool kbd{ display:none } /* tablets: keep the teacher toolbar on one screen width */
  .setup-grid{ grid-template-columns:1fr }
  .fx-list{ grid-template-columns:1fr }
  .help-types{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .draw-top{ justify-content:center } .draw-head{ text-align:center }
}
@media (max-width: 900px){
  .tool > span, .tool kbd{ display:none }
  .tools{ justify-content:space-between }
  .tools-sp{ display:none }
  .fx{ grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) }
  .fx-act{ grid-column:1 / -1; display:flex; justify-content:center }
  .fx-act:has(.fx-lock){ display:none }
  .bkt{ display:none } .bk-stack{ display:flex; flex-direction:column; gap:18px }
  .help-grid{ grid-template-columns:1fr }
  .qp-n{ display:none }
  .db-row{ grid-template-columns:minmax(0,1fr); gap:6px }
  .db-mid{ height:auto; flex-direction:row; padding:2px 0 }
  .db-mid::before{ display:none }
  .roster{ grid-template-columns:1fr }
  .intro-grid{ grid-template-columns:1fr }
}
@media (max-width: 700px){
  body{ font-size:16px }
  .topbar{ gap:10px }
  .brand-t b{ display:none }
  .brand-t small{ font-size:.82rem; max-width:7.5em; line-height:1.25 }
  .brand .seal-mini{ width:42px; height:42px }
  .tb-title{ text-align:start; min-width:0 }
  .tb-act .btn-sm span{ display:none }
  .tb-act .btn-sm{ padding:.4em .7em }
  .home-main .btn-xl{ min-width:0; width:100% }
  .home-main{ width:100%; flex-direction:column }
  .home-top{ top:10px }
  .class-row{ grid-template-columns:auto minmax(0,1fr) auto }
  .class-row .fld-name{ grid-column:2 / 3 }
  .class-row .cr-del{ grid-column:3; grid-row:1 }
  .class-row .fld-color{ grid-column:1 / -1 }
  .class-row .fld-groups{ grid-column:1 / -1 }
  .swatches{ grid-template-columns:repeat(8,26px) }
  .intro-brand span{ display:none }
  .faceoff{ grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px }
  .fo, .fo.b{ flex-direction:column; gap:6px; text-align:center }
  .fo .fo-t, .fo.b .fo-t{ align-items:center; text-align:center }
  .fo .mem, .fo.b .mem{ justify-content:center; flex-direction:column; align-items:center }
  .fo-vs span{ width:46px; height:46px; font-size:1.4rem }
  .tl-l{ display:none } .tl-s{ display:inline }
  .cls-stats dd{ font-size:1.6rem }
  .ts svg{ width:30px }
  .pot{ padding:3px 7px } .pc svg{ width:20px }
  .opts{ grid-template-columns:1fr }
  .opt{ min-height:50px; font-size:19px }
  /* phone scoreboard: label / name / «يجيب الآن» stacked beside the score; same fixed height every turn */
  .v-match{ --sbh:84px; --subh:28px; --toolh:56px; --qph:84px }
  .sb-wrap{ padding:8px 10px 0 }
  .sb-side{ gap:6px; padding:0 8px }
  .sb-side.a{ padding-inline-start:12px } .sb-side.b{ padding-inline-end:12px }
  .sb-crest{ display:none }
  .sb-id{ gap:0 }
  .sb-top{ height:18px }
  .sb-lbl{ font-size:12px }
  .sb-now{ position:absolute; bottom:6px; inset-inline-start:12px; font-size:11px; padding:0 7px }
  .sb-side.b .sb-now{ inset-inline-start:auto; inset-inline-end:12px }
  .sb-id{ align-self:stretch; padding:6px 0 26px }
  .sb-name{ font-size:15px }
  .sb-score{ font-size:34px }
  .sb-clock{ width:62px; padding:4px 6px }
  .sb-min{ font-size:26px }
  .sb-stage{ display:none }
  .turn{ width:auto; min-width:0; font-size:13px; padding:0 12px }
  .dot{ width:11px; height:11px }
  .dots{ gap:3px }
  .qp{ padding:10px 12px; border-top-width:5px }
  .qp-h{ display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; align-content:center; gap:6px 8px }
  .qp-who{ grid-column:1; grid-row:1; max-width:100%; font-size:15px; padding:3px 12px 3px 5px; justify-self:start }
  .ring{ grid-column:2; grid-row:1 / 3; width:56px }
  .qp-t{ grid-column:1; grid-row:2; font-size:17px; display:flex; align-items:center; gap:6px }
  .qp-h > .cat-chip{ display:none }
  .prompt{ min-height:66px }

function starPts(cx, cy, R, r) { const p = []; for (let i = 0; i < 10; i++) { const rad = i % 2 ? r : R; const a = (-90 + i * 36) * Math.PI / 180; p.push((cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2)); } return p.join(' '); }

function sealSVG(id, cls) {
  return `<img class="seal-svg school-logo${cls ? ' ' + cls : ''}" src="${SCHOOL_LOGO}" alt="شعار ${SCHOOL}" decoding="async" draggable="false">`;
}
/* small logo (topbar) */
function sealMini(id) {
  return `<img class="seal-mini school-logo" src="${SCHOOL_LOGO}" alt="" aria-hidden="true" decoding="async" draggable="false">`;
}
/* crest label for a name without a group number (a class, a demo team): its section code (10/6) or its last word */
const CREST_DIGITS = /[0-9٠-٩۰-۹]+(?:\s*\/\s*[0-9٠-٩۰-۹]+)?/g;
const crestDigits = (s) => { const d = String(s || '').match(CREST_DIGITS); return d ? d[d.length - 1].replace(/\s+/g, '').slice(0, 6) : ''; };
const crestShort = (name) => { const s = String(name || '').trim(), w = s.split(/\s+/); return crestDigits(s) || w[w.length - 1].slice(0, 6); };
/* crest: a shield in the CLASS colour with the team's big group number and the class name small under it, so the teams of
   one class read as one club family */
function crestSVG(team, size, idp) {
  const c = teamClass(team);
  if (c) return crestRaw(team.color || c.color, team.crest || String(team.group || ''), c.name, size, idp);
  return crestRaw(team.color, team.crest || crestShort(team.name), '', size, idp);
}
function crestRaw(color, big, small, size, idp) {
  const c = safeColor(color), light = mixHex(c, true, 0.28), dark = mixHex(c, false, 0.38), ink = inkOn(c);
  const label = String(big || ''), len = label.length, id = 'cr' + (idp || '') + uid();
  const font = "Teko, 'Readex Pro', 'Segoe UI', Tahoma, sans-serif";
  const txt = small
    ? `<text x="50" y="${len <= 2 ? 75 : 71}" text-anchor="middle" font-family="${font}" font-weight="600" font-size="${len <= 1 ? 50 : len <= 2 ? 42 : 28}" fill="${ink}">${esc(label)}</text><text x="50" y="94" text-anchor="middle" font-family="'Readex Pro','Segoe UI',Tahoma,sans-serif" font-weight="700" font-size="${String(small).length <= 4 ? 14 : 11}" fill="${ink}" opacity=".88">${esc(String(small).slice(0, 7))}</text>`
    : `<text x="50" y="${len <= 4 ? 78 : 76}" text-anchor="middle" font-family="${font}" font-weight="600" font-size="${len <= 3 ? 40 : len <= 4 ? 34 : len <= 5 ? 29 : 24}" fill="${ink}">${esc(label)}</text>`;
  return `<svg class="crest" viewBox="0 0 100 112" ${size ? `width="${size}" height="${Math.round(size * 1.12)}"` : ''} aria-hidden="true" focusable="false"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${light}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>
<path d="M50 3 L94 15 V55 C94 83 74 100 50 109 C26 100 6 83 6 55 V15 Z" fill="url(#${id})" stroke="rgba(255,255,255,.6)" stroke-width="2.5"/>
<path d="M50 11 L86 21 V55 C86 78 70 92 50 100 C30 92 14 78 14 55 V21 Z" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
<path d="M14 36 H86" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>

function wordsCheck(s) {

/* split mode: the first team's score is revealed here, once; until then it stays hidden everywhere */

</div></section>`;

/* ---------- Certificates (1st, 2nd, 3rd) ---------- */
VIEWS.cert = () => {

/* ============================ 14. MATCH ENGINE ============================ */
let Q = null; // the live question: { m, idx, st, q, team, intro, secs, answered, paused, sb, m5 }
const TM = { raf: 0, total: 0, left: 0, last: 0, running: false, onEnd: null, sec: -1, speed: 1, fg: null, tx: null, ring: null };
const RING_C = 175.93;
const TURN_MS = 1300; // the «الآن دور …» card before every question
function timerStart(secs, onEnd) {
  timerStop();
  TM.total = secs * 1000; TM.left = TM.total; TM.sec = -1; TM.fg = $('#ring-fg'); TM.tx = $('#ring-t'); TM.ring = $('#ring');
  if (!secs) return;
  TM.onEnd = onEnd; TM.running = true; TM.last = performance.now(); drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function timerTick(now) {
  if (!TM.running) return;
  const dt = Math.min(250, Math.max(0, now - TM.last)); TM.last = now; TM.left -= dt * TM.speed;
  if (TM.left <= 0) { TM.left = 0; TM.running = false; drawTimer(); const f = TM.onEnd; TM.onEnd = null; if (f) f(); return; }
  drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function drawTimer() {
  if (!TM.fg || !TM.tx) return;
  TM.fg.style.strokeDashoffset = (RING_C * (1 - (TM.total ? TM.left / TM.total : 0))).toFixed(2);
  const s = Math.ceil(TM.left / 1000);
  if (s !== TM.sec) { TM.sec = s; TM.tx.textContent = s; const low = s <= 5; TM.ring.classList.toggle('low', low); if (low && s > 0 && TM.running) SFX.tick(); }
}
function timerPause() { if (!TM.running) return; TM.running = false; cancelAnimationFrame(TM.raf); }
function timerResume() { if (TM.running || TM.left <= 0 || !TM.total || !TM.onEnd) return; TM.running = true; TM.last = performance.now(); TM.raf = requestAnimationFrame(timerTick); }
function timerStop() { TM.running = false; cancelAnimationFrame(TM.raf); TM.onEnd = null; }

function curMatch() { return S.matchId ? recById(S.matchId) : null; }
function persist(m) { if (m && !m.demo) saveT(); }
const timerMult = (m) => (m && m.demo ? 1 : T ? T.settings.timer : 1);
function halfStep(m) { if (m.demo || m.mode !== 'live' || !m.seq) return -1; const h = 2 * Math.ceil(m.R / 2); return h < m.seq.length ? h : -1; }
function minuteOf(m, k) {
  if (!m.seq) return 0; const N = m.seq.length;
  if (m.mode === 'split') { const R = m.R; return Math.round(((k > R || (k === R && m.s2)) ? k - R : k) / R * 90); }
  const H = halfStep(m); if (H < 0) return Math.round((k / N) * 90);
  return k <= H ? Math.round((k / H) * 45) : 45 + Math.round(((k - H) / (N - H)) * 45);
}

    /* names → groups */
    fillAssign: (roster, assign, groups) => fillAssign(roster, assign, groups),
    randomAssign: (roster, groups) => randomAssign(roster, groups),
    parseRoster: (t) => parseRoster(t),
    defaultSetup: () => JSON.parse(JSON.stringify(setupFrom(null))),
    /* knockout: a draw of synthetic teams ({id, cls}) → pairs, byes, bracket */
    drawKO(groups, mode, third) { const cls = new Map(groups.map((g) => [g.id, g.cls])); const d = drawKO(groups.map((g) => g.id), (id) => cls.get(id), mode, third); return { bracket: d.bracket, info: d.info, matches: d.matches.map((m) => ({ id: m.id, rd: m.rd, pos: m.pos, no: m.no, a: m.a, b: m.b, src: m.src, third: !!m.third })) }; },
    minSameTies: (groups) => { const cls = new Map(groups.map((g) => [g.id, g.cls])); return minSameTies(groups.map((g) => g.id), (id) => cls.get(id)); },
    classBoard: (t) => classBoard(t || T),
    legacy: (t) => isLegacyT(t),
    migrate: (t) => { const o = migrate(JSON.parse(JSON.stringify(t))); if (!validT(o)) return null; const T0 = T; try { return JSON.parse(JSON.stringify(repairT(o))); } finally { T = T0; } },
    validT: (t) => validT(t),
    confusable: (w1, w2) => { const all = allEntries(), a = all.find((e) => e.w === w1), b = all.find((e) => e.w === w2); return !!(a && b && confusable(a, b)); },
    lruPick(words, usedOrder, type) { const all = allEntries(), pool = words.map((w) => all.find((e) => e.w === w)).filter(Boolean), used = new Set(usedOrder); const pr = makePicker(pool, used).pair(type, 1); return { picked: pr ? pr.map((e) => e.w) : null, used: Array.from(used) }; },
    matchFits: (R, units) => { const pool = poolFor(units || ['media']); const r = matchFits(feasibleTypes(TYPE_IDS, pool), pool, R); return { ok: r.ok, need: r.need, pool: pool.length }; },
    /* finishes the record that is next in a tie without the UI (same engine calls): ga / gb correct answers for a / b */
    sim(id, ga, gb) {
      let m = recById(id); if (!m) return false; if (!m.root && m.status !== 'upcoming') m = activeRec(m) || m;
      if (!playable(m) || m.seq) return false;
      m.R = roundsFor(m); if (!kickoff(m, 'live', null)) return false;
      m.seq.filter((x) => x.t === m.a).forEach((x, i) => { x.ok = i < ga; }); m.seq.filter((x) => x.t === m.b).forEach((x, i) => { x.ok = i < gb; });
      m.step = m.seq.length; m.last = m.step - 1; m.half = true; refreshStatus(m); saveT();
      return m.status;
    },
    /* the record a test should play next in a tie (root or replay) */
    active: (id) => { const r = recById(id); const a = r ? activeRec(rootOf(r)) : null; return a ? a.id : null; },
    podium: () => podium(),
    forcePlan(id, plan) { const m = recById(id); if (!m || m.seq) return false; m.R = plan.length; m.plan = plan.slice(); m.pre = null; saveT(); return true; },
    speed(k) { TS.k = k > 0 ? k : 1; return TS.k; },
    /* a tournament straight from a setup object (defaults = the teacher's 16 teams), confirmed, saved and shown in the hub */
    create(cfg) {
      const s = Object.assign(setupFrom(null), cfg || {});
      T = createTournament(s); T.confirmed = true; STORE.conflict = false; saveT(true); S.tab = 'fixtures'; go('hub'); return T.id;
    },
    playable: () => (T ? roots().filter((m) => playable(m) && m.status !== 'done').map((m) => m.id) : []),
  },
};
init();

</script>
