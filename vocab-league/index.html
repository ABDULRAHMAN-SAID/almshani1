<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوري أبطال المفردات</title>
<meta name="description" content="دوري أبطال المفردات — تحدّي مفردات اللغة الإنجليزية للصف العاشر بنظام دوري الأبطال (بدون إياب). مدرسة حطين للبنين · إعداد: أ. محمد بن سعيد المعشني">
<meta name="theme-color" content="#060d24">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b1a45'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23f5f7ff'/%3E%3Cpolygon points='32,24 39.6,29.5 36.7,38.5 27.3,38.5 24.4,29.5' fill='%230b1a45'/%3E%3Ccircle cx='32' cy='32' r='25' fill='none' stroke='%23c9d3e8' stroke-width='2.5' stroke-dasharray='3 4.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Teko:wght@400;500;600;700&display=swap">
<style>
/* ============ tokens (single deliberate dark "stadium at night" theme) ============ */
:root{
  color-scheme: dark;
  --night:#060d24; --navy:#0b1a45; --navy-2:#13296a; --line:rgba(201,211,232,.16);
  --silver:#c9d3e8; --white:#f5f7ff; --flood:#7cc4ff; --gold:#f2c14e;
  --pitch-a:#0e4a2e; --pitch-b:#115a37;
  --good:#2fd07a; --bad:#ff5a6a; --warn:#ffb547;
  --glass: rgba(11,26,69,.78); --glass-2: rgba(19,41,106,.55); --glass-3: rgba(6,13,36,.55);
  --muted: rgba(201,211,232,.74);
  --f-ui: 'Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic','Noto Sans',Arial,sans-serif;
  --f-disp: 'Reem Kufi','Readex Pro','Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  --f-num: 'Teko','Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --r-l: 22px; --r: 16px; --r-s: 12px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter: clamp(16px, 2.4vw, 32px);
}
@supports (background: color-mix(in srgb, red 50%, transparent)){
  :root{ --glass: color-mix(in srgb, var(--navy) 78%, transparent); --glass-2: color-mix(in srgb, var(--navy-2) 55%, transparent); --glass-3: color-mix(in srgb, var(--night) 55%, transparent); }
}
*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--night) }
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--white); font-family:var(--f-ui); font-size:17px; line-height:1.6;
  background-color:var(--night);
  background-image: radial-gradient(120% 80% at 50% -12%, #16307a 0%, #0d1f55 30%, #081333 58%, #060d24 80%);
  background-attachment: fixed; overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none }
#app{ position:relative; z-index:1; min-height:100vh; min-height:100dvh }
.view{ outline:none; min-height:100vh; min-height:100dvh }
button, input, textarea, select{ font:inherit; color:inherit }
button{ cursor:pointer }
svg{ display:block }
h1,h2,h3,h4{ line-height:1.25; margin:0 }
p{ margin:0 }
code, .mono{ font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size:.9em }
code{ background:rgba(255,255,255,.08); padding:.05em .4em; border-radius:6px }
bdi{ unicode-bidi:isolate }
.en{ unicode-bidi:isolate }
.num{ unicode-bidi:isolate; font-variant-numeric:tabular-nums }
.muted{ color:var(--muted) }
.small{ font-size:.86rem }
.good{ color:var(--good) } .bad{ color:var(--bad) }
.good .ic, .bad .ic{ display:inline-block; width:1em; height:1em; vertical-align:-.12em }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
:focus-visible{ outline:3px solid var(--flood); outline-offset:3px }
[hidden]{ display:none!important }
.ic{ width:20px; height:20px; flex:none }
.ic.big{ width:42px; height:42px }
.kicker{ font-family:var(--f-num); font-weight:500; letter-spacing:.2em; font-size:1.05rem; line-height:1.1; color:var(--flood); text-transform:uppercase }
.disp{ font-family:var(--f-disp); font-weight:600 }

/* ============ buttons ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.55em; min-height:48px; padding:.55em 1.2em; border-radius:14px; border:1px solid var(--line); background:var(--glass-2); color:var(--white); font-weight:600; font-size:1rem; line-height:1.2; text-decoration:none; transition: transform .15s var(--ease), background-color .2s, border-color .2s, box-shadow .2s, opacity .2s; white-space:nowrap }
.btn:hover{ background:var(--navy-2); border-color:rgba(124,196,255,.45) }
.btn:active{ transform:translateY(1px) scale(.99) }
.btn[disabled]{ opacity:.42; cursor:not-allowed; transform:none; box-shadow:none }
.btn .ic{ width:1.2em; height:1.2em }
.btn small{ display:block; font-weight:400; font-size:.78em; opacity:.85; margin-top:2px }
.btn > span{ text-align:start }
.btn kbd{ font-family:var(--f-num); font-size:.85em; padding:0 .4em; border-radius:6px; border:1px solid currentColor; opacity:.55; line-height:1.3 }
.btn-primary{ background:linear-gradient(180deg,#9ad6ff,#4fa7f1); color:#04112e; border-color:transparent; box-shadow:0 8px 24px rgba(124,196,255,.25) }
.btn-primary:hover{ background:linear-gradient(180deg,#b2e0ff,#63b4f6); border-color:transparent }
.btn-gold{ background:linear-gradient(180deg,#ffe08a,#e2a82c); color:#241500; border-color:transparent; box-shadow:0 10px 28px rgba(242,193,78,.28) }
.btn-gold:hover{ background:linear-gradient(180deg,#ffe9a8,#ecb43a); border-color:transparent }
.btn-ghost{ background:rgba(255,255,255,.045) }
.btn-danger{ background:rgba(255,90,106,.12); border-color:rgba(255,90,106,.45); color:#ffd3d8 }
.btn-danger:hover{ background:rgba(255,90,106,.22); border-color:rgba(255,90,106,.7) }
.btn-xl{ min-height:58px; font-size:1.12rem; padding:.6em 1.5em; border-radius:16px }
.btn-sm{ min-height:44px; padding:.4em .95em; font-size:.93rem; border-radius:12px }
.icon-btn{ width:44px; height:44px; display:inline-grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.045); color:var(--silver); transition:background-color .2s, color .2s; flex:none }
.icon-btn:hover{ background:rgba(255,255,255,.1); color:var(--white) }
.icon-btn[disabled]{ opacity:.35; cursor:not-allowed }
.icon-btn.sm{ width:38px; height:38px; border-radius:10px }
.icon-btn.sm .ic{ width:18px; height:18px }
.link{ background:none; border:0; padding:0; color:var(--flood); text-decoration:underline; text-underline-offset:3px; font-weight:500 }

/* ============ panels & layout ============ */
.page{ max-width:1320px; margin:0 auto; padding:0 var(--gutter) 56px }
.page-narrow{ max-width:1160px; margin:0 auto; padding:0 var(--gutter) 40px }
.panel{ background:var(--glass); border:1px solid var(--line); border-radius:var(--r-l); padding:20px 22px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
.panel h2{ display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:600; margin-bottom:14px }
.panel h2 .ic{ color:var(--flood) }
.panel h2 small, .panel h3 small{ font-weight:400; color:var(--muted); font-size:.82rem }
.panel-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px }
.panel-h h2{ margin:0 }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.bar{ height:8px; border-radius:99px; background:rgba(201,211,232,.14); overflow:hidden; flex:1 }
.bar > i{ display:block; height:100%; border-radius:inherit; background:var(--flood); transition:width .8s var(--ease) }
.bar.big{ height:12px; max-width:420px; margin:14px auto 8px; width:100% }
.lv{ display:inline-flex; gap:3px; vertical-align:middle }
.lv i{ width:7px; height:7px; border-radius:50%; background:rgba(201,211,232,.25) }
.lv i.on{ background:var(--gold) }

/* topbar */
.topbar{ display:flex; align-items:center; gap:16px; padding:16px 0 14px; margin-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 2px; border-radius:12px; text-align:start }
.brand .emblem{ width:46px; height:46px }
.brand-t b{ display:block; font-family:var(--f-disp); font-weight:600; font-size:1.08rem; line-height:1.2 }
.brand-t small{ display:block; font-family:var(--f-num); letter-spacing:.16em; font-size:.8rem; color:var(--silver); line-height:1.1 }
.tb-title{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(1.3rem,2vw,1.7rem); text-align:center; min-width:160px }
.tb-act{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }

/* ============ home ============ */
.v-home{ position:relative; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,3vh,30px); padding:28px var(--gutter) 28px; text-align:center; overflow:hidden }
.beams{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:-1 }
.beam{ position:absolute; top:-12vh; width:44vw; height:120vh; background:linear-gradient(180deg, rgba(160,210,255,.26), rgba(124,196,255,.05) 55%, transparent 80%); filter:blur(22px); clip-path:polygon(46% 0, 54% 0, 100% 100%, 0 100%); transform-origin:50% 0; opacity:.75 }
.beam.b1{ right:-14vw; transform:rotate(32deg) }
.beam.b2{ left:-14vw; transform:rotate(-32deg) }
.home-top{ position:absolute; top:16px; inset-inline-start:var(--gutter) }
.home-hero{ display:flex; flex-direction:column; align-items:center; gap:6px }
.home-emblem .emblem{ width:clamp(118px,18vh,188px); height:auto; filter:drop-shadow(0 14px 44px rgba(124,196,255,.35)); animation:float 7s ease-in-out infinite }
.home-hero .kicker{ margin-top:8px; font-size:clamp(1rem,1.6vw,1.35rem) }
.home-title{ font-family:var(--f-disp); font-weight:700; font-size:clamp(42px,6.2vw,84px); line-height:1.15; background:linear-gradient(180deg,#ffffff 20%,#c9d3e8 70%,#93a4cc); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 40px rgba(124,196,255,.12); padding:0 .1em }
.home-sub{ font-size:clamp(1rem,1.5vw,1.3rem); color:var(--silver) }
.home-school{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px 10px; font-size:clamp(.92rem,1.2vw,1.05rem); color:var(--muted); margin-top:4px }
.home-school b{ color:var(--white); font-weight:600 }
.sep{ color:var(--gold); opacity:.8 }
.home-actions{ display:flex; flex-direction:column; align-items:center; gap:12px }
.home-main, .home-sec{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center }
.home-main .btn-xl{ min-width:230px }
.home-restore{ display:inline-flex; align-items:center; gap:6px; font-size:.9rem; color:var(--muted); text-decoration:none }
.home-restore:hover{ color:var(--flood) }
.home-restore .ic{ width:16px; height:16px }
.cat-strip{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; width:min(1180px,100%) }
.cat-card{ position:relative; display:flex; gap:12px; align-items:flex-start; text-align:start; padding:14px 16px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line) }
.cat-card::before, .lu::before, .sc::before, .ht-cat::before, .hts::before{ content:''; position:absolute; top:-1px; inset-inline:16px; height:3px; border-radius:0 0 4px 4px; background:var(--cc, var(--tc)) }
.cat-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.06); color:var(--cc); flex:none }
.cat-card b{ display:block; font-size:1.02rem }
.cat-card b small{ font-family:var(--f-num); letter-spacing:.14em; color:var(--cc); font-weight:500; font-size:.86rem; margin-inline-start:4px }
.cat-card p{ font-size:.86rem; color:var(--muted); line-height:1.5; margin-top:2px }

/* ============ setup ============ */
.setup-grid{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start }
.setup-col{ display:flex; flex-direction:column; gap:18px; min-width:0 }
.team-rows{ display:flex; flex-direction:column; gap:10px }
.team-row{ display:grid; grid-template-columns:auto minmax(110px,1fr) auto 104px auto; gap:12px; align-items:end; padding:10px 12px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line) }
.tr-crest svg{ width:46px; height:auto }
.fld{ display:flex; flex-direction:column; gap:4px; min-width:0 }
.fld > span{ font-size:.78rem; color:var(--muted) }
.fld input{ width:100%; min-height:44px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(6,13,36,.6); font-weight:600; font-size:1.05rem }
.fld input:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.25) }
.swatches{ display:grid; grid-template-columns:repeat(4,24px); gap:6px }
.sw{ width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:var(--c); padding:0; position:relative }
.sw.on{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.25) }
.sw::after{ content:''; position:absolute; inset:-10px } /* larger hit area */
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px }
.field:last-child{ margin-bottom:0 }
.field-l{ font-weight:600; font-size:.95rem }
.field-h{ color:var(--muted); font-size:.8rem }
.seg{ display:flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:14px; background:rgba(6,13,36,.6); border:1px solid var(--line); width:fit-content; max-width:100% }
.seg-b{ min-height:40px; padding:6px 14px; border-radius:10px; border:0; background:none; color:var(--silver); font-weight:500; font-size:.94rem }
.seg-b:hover{ color:var(--white); background:rgba(255,255,255,.06) }
.seg-b.on{ background:linear-gradient(180deg,#9ad6ff,#4fa7f1); color:#04112e; font-weight:600 }
.seg-b[disabled]{ opacity:.35; cursor:not-allowed }
.type-groups{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.tg{ margin:0; padding:10px 12px 8px; border:1px solid var(--line); border-radius:var(--r); background:var(--glass-3); border-inline-start:3px solid var(--cc) }
.tg legend{ display:flex; align-items:center; gap:6px; font-weight:600; padding:0 4px; color:var(--white) }
.tg legend .ic{ color:var(--cc); width:18px; height:18px }
.tg legend small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.chk{ display:flex; align-items:center; gap:10px; min-height:40px; cursor:pointer; font-size:.95rem }
.chk input{ width:20px; height:20px; accent-color:#7cc4ff; flex:none }
.unit-checks{ display:flex; flex-direction:column; gap:8px }
.unit-chk{ padding:8px 12px; border-radius:var(--r-s); background:var(--glass-3); border:1px solid var(--line) }
.u-ic{ font-size:1.3rem; line-height:1 }
.u-name{ flex:1; display:flex; flex-direction:column; line-height:1.3 }
.u-en{ font-size:.8rem; color:var(--muted) }
.u-n{ color:var(--muted); font-size:.86rem; white-space:nowrap }
.words-total{ margin-top:12px; font-size:1rem }
.words-total b{ font-family:var(--f-num); font-size:1.6rem; color:var(--gold); vertical-align:-3px }
.words-total .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.st-units > .muted{ margin-top:8px }
.setup-foot{ position:sticky; bottom:12px; display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:20px; padding:12px 16px; border-radius:var(--r-l); background:rgba(8,18,50,.92); border:1px solid var(--line); box-shadow:0 -10px 40px rgba(6,13,36,.8); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); flex-wrap:wrap; z-index:5 }
.setup-err{ flex:1; color:var(--bad); font-weight:500; min-width:200px }
.setup-err:empty{ display:none }

/* ============ draw ============ */
.v-draw{ padding-top:28px; text-align:center }
.draw-head h1{ font-size:clamp(40px,5vw,64px) }
.draw-head .muted{ margin-top:4px }
.draw-teams{ display:flex; justify-content:center; flex-wrap:wrap; gap:16px 28px; margin:24px 0 26px }
.dt{ display:flex; flex-direction:column; align-items:center; gap:6px; animation:popIn .6s var(--ease) both; animation-delay:var(--d) }
.dt svg{ width:60px; height:auto; filter:drop-shadow(0 8px 18px rgba(0,0,0,.4)) }
.dt b{ font-size:1.05rem }
.draw-mds{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:16px; text-align:start }
.md-col{ padding:16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line) }
.md-col h3{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:1.05rem; margin-bottom:12px }
.md-col h3 small{ font-family:var(--f-num); letter-spacing:.16em; color:var(--flood); font-size:.9rem }
.fx-flip{ perspective:800px; margin-bottom:10px }
.fx-flip > .mf{ animation:flipIn .7s var(--ease) both; animation-delay:var(--d); transform-origin:50% 0 }
.mf{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r); background:linear-gradient(180deg, rgba(19,41,106,.9), rgba(11,26,69,.9)); border:1px solid rgba(201,211,232,.2); box-shadow:0 10px 24px rgba(0,0,0,.3) }
.mf-t{ display:flex; align-items:center; gap:8px; min-width:0 }
.mf-t.b{ justify-content:flex-end }
.mf-t svg{ width:34px; height:auto; flex:none }
.mf-t b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.mf-vs{ font-family:var(--f-num); font-size:1.4rem; color:var(--gold); letter-spacing:.06em }
.rest{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.9rem }
.rest .ic{ width:16px; height:16px }
.reveal{ animation:fadeUp .6s var(--ease) both; animation-delay:var(--d) }
.draw-foot{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:14px }

/* ============ hub ============ */
.champ-banner{ display:flex; align-items:center; gap:14px; padding:12px 18px; margin-bottom:16px; border-radius:var(--r-l); background:radial-gradient(120% 180% at 100% 0%, rgba(242,193,78,.26), rgba(19,41,106,.85) 55%, rgba(11,26,69,.9)); border:1px solid rgba(242,193,78,.55); box-shadow:0 10px 40px rgba(242,193,78,.12); flex-wrap:wrap }
.champ-banner > .ic{ color:var(--gold) }
.champ-banner svg.crest{ width:44px; height:auto }
.champ-banner div{ flex:1; display:flex; flex-direction:column }
.champ-banner small{ color:var(--gold); font-weight:500 }
.champ-banner b{ font-size:1.35rem }
.hub-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px }
.tabs{ display:flex; gap:4px; padding:4px; border-radius:16px; background:rgba(6,13,36,.65); border:1px solid var(--line); overflow-x:auto; max-width:100%; scrollbar-width:none }
.tab{ position:relative; display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:8px 16px; border-radius:12px; border:0; background:none; color:var(--silver); font-weight:500; white-space:nowrap }
.tab:hover{ color:var(--white); background:rgba(255,255,255,.06) }
.tab.on{ background:var(--navy-2); color:var(--white); box-shadow:inset 0 -2px 0 var(--flood) }
.tab .ic{ width:18px; height:18px }
.badge-dot{ position:absolute; top:8px; inset-inline-end:8px; width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(242,193,78,.25); animation:pulse 1.6s infinite }
.hub-meta{ display:flex; gap:14px; color:var(--muted); font-size:.88rem; flex-wrap:wrap }
.hub-meta span{ display:inline-flex; align-items:center; gap:6px }
.hub-meta .ic{ width:16px; height:16px }
.fixtures{ display:flex; flex-direction:column; gap:22px }
.grp-h{ display:flex; align-items:baseline; gap:10px; font-size:1.08rem; margin-bottom:10px; flex-wrap:wrap }
.grp-h small{ font-family:var(--f-num); letter-spacing:.16em; color:var(--flood); font-size:.92rem }
.rest-inline{ font-style:normal; display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.86rem; font-weight:400; margin-inline-start:auto }
.rest-inline .ic{ width:15px; height:15px }
.fx-list{ display:flex; flex-direction:column; gap:10px }
.fx{ display:grid; grid-template-columns:minmax(0,1fr) minmax(150px,auto) minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); transition:border-color .2s, transform .2s }
.fx:hover{ border-color:rgba(124,196,255,.35) }
.fx.st-live, .fx.st-wait, .fx.st-pens{ border-color:rgba(242,193,78,.45); box-shadow:0 0 0 1px rgba(242,193,78,.15) inset }
.fx-t{ display:flex; align-items:center; gap:12px; min-width:0 }
.fx-t.a{ justify-content:flex-end }
.fx-t.b{ justify-content:flex-start }
.fx-t svg{ width:40px; height:auto; flex:none }
.fx-t b{ font-size:1.15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.fx-t.win b{ color:var(--gold) }
.fx-mid{ display:flex; flex-direction:column; align-items:center; gap:4px }
.fx-vs{ font-family:var(--f-num); font-size:1.6rem; color:var(--muted); line-height:1 }
.fx-stage{ font-size:.78rem; color:var(--gold) }
.fx-pens{ display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted) }
.sp{ display:inline-flex; align-items:center; gap:.3em; font-family:var(--f-num); font-variant-numeric:tabular-nums; line-height:1 }
.sp-d{ opacity:.6 }
.fx-sc{ font-size:2rem; font-weight:600 }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:.76rem; font-weight:600; white-space:nowrap; border:1px solid transparent }
.p-up{ background:rgba(201,211,232,.1); color:var(--silver) }
.p-live{ background:rgba(47,208,122,.14); color:var(--good); border-color:rgba(47,208,122,.35) }
.p-live::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite }
.p-wait{ background:rgba(255,181,71,.14); color:var(--warn); border-color:rgba(255,181,71,.35) }
.p-pens{ background:rgba(255,90,106,.14); color:#ff9aa5; border-color:rgba(255,90,106,.35) }
.p-done{ background:rgba(124,196,255,.1); color:var(--flood) }
.callout{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:var(--r-l); background:radial-gradient(120% 180% at 100% 0%, rgba(242,193,78,.24), rgba(19,41,106,.85) 55%, rgba(11,26,69,.9)); border:1px solid rgba(242,193,78,.55); flex-wrap:wrap; margin-bottom:16px }
.callout > .ic{ color:var(--gold); width:28px; height:28px }
.callout > div{ flex:1; min-width:180px }
.tip{ display:flex; align-items:center; gap:8px; margin-top:18px }
.tip .ic{ width:16px; height:16px }
.tbl-wrap{ overflow-x:auto; border-radius:var(--r-l); border:1px solid var(--line); background:var(--glass); -webkit-overflow-scrolling:touch }
.standings{ width:100%; border-collapse:collapse; min-width:780px; font-variant-numeric:tabular-nums }
.standings th{ font-weight:500; font-size:.84rem; color:var(--silver); padding:12px 8px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; background:rgba(6,13,36,.35) }
.standings td{ padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); font-family:var(--f-num); font-size:1.55rem; line-height:1; position:relative }
.standings tr:last-child td{ border-bottom:0 }
.standings tbody tr{ position:relative; transition:background-color .6s }
.standings th.tm, .standings td.tm{ text-align:start }
.standings td.tm{ font-family:var(--f-ui); font-size:1.08rem; font-weight:600 }
.tm-in{ display:flex; align-items:center; gap:10px }
.tm-in svg{ width:30px; height:auto }
.standings td.rk span{ display:inline-grid; place-items:center; width:32px; height:32px; border-radius:9px; background:rgba(201,211,232,.1); font-size:1.3rem; padding-top:3px }
.standings tr.qz td.rk span{ background:var(--flood); color:#04112e }
.standings tr.qz td:first-child{ box-shadow:inset -4px 0 0 var(--flood) }
.standings tr.qz{ background:linear-gradient(270deg, rgba(124,196,255,.13), transparent 70%) }
.standings td.pts{ color:var(--gold); font-weight:600; font-size:1.8rem }
.fm-in{ display:inline-flex; gap:4px; justify-content:center }
.fp{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-family:var(--f-ui); font-size:.78rem; font-weight:700; line-height:1 }
.fW{ background:var(--good); color:#032012 } .fD{ background:#9aa6c4; color:#0b1a45 } .fL{ background:var(--bad); color:#2a0006 }
.standings tr.flash{ animation:rowFlash 2.2s ease }
.legend{ display:flex; gap:10px 24px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:.85rem }
.legend span{ display:inline-flex; align-items:center; gap:8px }
.lg-q{ width:14px; height:14px; border-radius:4px; background:var(--flood) }
.locked{ text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:8px }
.locked > .ic{ color:var(--flood); margin-bottom:6px }
.locked h3{ font-size:1.3rem }
.bracket{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:18px; align-items:center }
.br-col{ display:flex; flex-direction:column; gap:14px }
.br-col h4{ font-family:var(--f-disp); font-weight:600; font-size:1.1rem; color:var(--gold) }
.br-m{ padding:10px; border-radius:var(--r); background:var(--glass); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px }
.br-m.pending{ border-style:dashed }
.br-m > .btn{ align-self:flex-start; margin-top:4px }
.br-t{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; background:rgba(6,13,36,.45); border-inline-start:3px solid var(--tc, transparent) }
.br-t svg{ width:26px; height:auto }
.br-t b{ flex:1 }
.br-t.win{ background:rgba(19,41,106,.95); box-shadow:inset 0 0 0 1px rgba(242,193,78,.55) }
.br-t.win b{ color:var(--gold) }
.br-t.tbd b{ color:var(--muted); font-weight:500 }
.tbd-c{ width:26px; height:29px; border-radius:6px; border:1.5px dashed rgba(201,211,232,.35) }
.br-s{ font-family:var(--f-num); font-size:1.6rem; line-height:1 }
.br-s small{ font-size:.9rem; color:var(--muted); margin-inline-start:4px }
.br-champ{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; border-radius:var(--r-l); background:radial-gradient(90% 120% at 50% 0%, rgba(242,193,78,.3), rgba(19,41,106,.9) 60%, rgba(11,26,69,.95)); border:1px solid rgba(242,193,78,.55); color:var(--gold); width:100% }
.br-champ b{ color:var(--white); font-size:1.3rem }
.br-champ.tbd{ background:var(--glass); border:1px dashed var(--line); color:var(--muted) }
.br-champ svg.crest{ width:44px; height:auto }
.hl-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:16px }
.hl{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--r); background:var(--glass); border:1px solid var(--line) }
.hl-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.06); color:var(--cc); flex:none }
.hl small{ display:block; color:var(--muted); font-size:.8rem }
.hl b{ font-size:1.1rem; margin-inline-end:6px }
.hl-v{ font-family:var(--f-num); font-size:1.25rem; color:var(--cc) }
.stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:14px }
.sc{ position:relative; padding:16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line) }
.sc::before{ background:var(--tc) }
.sc header{ display:flex; align-items:center; gap:10px; margin-bottom:12px }
.sc header svg{ width:36px; height:auto }
.sc header > b{ flex:1; font-size:1.2rem }
.sc-g{ display:flex; flex-direction:column; align-items:center; line-height:1 }
.sc-g b{ font-family:var(--f-num); font-size:1.8rem; font-weight:600 }
.sc-g small{ color:var(--muted); font-size:.75rem }
.bar-row{ display:grid; grid-template-columns:110px 1fr 46px 40px; align-items:center; gap:10px; min-height:34px }
.br-l{ display:flex; align-items:center; gap:6px; font-size:.9rem }
.br-l .ic{ width:16px; height:16px }
.bar-row b{ font-family:var(--f-num); font-size:1.25rem; text-align:center }
.bar-row small{ color:var(--muted); font-size:.78rem }

/* ============ intro ============ */
.v-intro{ padding-top:14px; display:flex; flex-direction:column; gap:14px }
.intro-top{ display:flex; justify-content:space-between; align-items:center }
.intro-head{ text-align:center }
.intro-head h1{ font-size:clamp(26px,3.2vw,42px) }
.faceoff{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px }
.fo{ display:flex; align-items:center; gap:16px; justify-content:flex-end }
.fo.b{ justify-content:flex-end; flex-direction:row-reverse }
.fo svg{ width:clamp(64px,8vh,96px); height:auto; filter:drop-shadow(0 12px 30px color-mix(in srgb, var(--tc) 45%, transparent)); animation:popIn .7s var(--ease) both }
.fo b{ font-family:var(--f-num), var(--f-disp); font-weight:600; font-size:clamp(34px,4.4vw,62px); line-height:1 }
.fo-vs span{ display:grid; place-items:center; width:64px; height:64px; border-radius:50%; font-family:var(--f-num); font-size:1.9rem; color:#241500; background:linear-gradient(180deg,#ffe08a,#e2a82c); box-shadow:0 0 0 6px rgba(242,193,78,.15), 0 10px 30px rgba(242,193,78,.3); padding-top:4px }
.intro-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr); gap:14px; align-items:stretch }
.intro-grid.no-toss{ grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) }
.intro-grid .panel{ padding:16px 18px; display:flex; flex-direction:column; gap:10px }
.intro-grid h3{ display:flex; align-items:center; gap:8px; font-size:1.02rem; font-weight:600; flex-wrap:wrap }
.intro-grid h3 .ic{ color:var(--flood); width:18px; height:18px }
.present{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.92rem }
.chip-btn{ min-height:40px; padding:4px 14px; border-radius:99px; border:2px solid var(--line); background:rgba(6,13,36,.6); font-weight:600 }
.chip-btn.on{ border-color:var(--tc); background:color-mix(in srgb, var(--tc) 22%, transparent) }
.lineup{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; justify-content:center }
.lu{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 6px 8px; min-width:78px; flex:1 1 78px; max-width:110px; border-radius:14px; background:rgba(6,13,36,.55); border:1px solid var(--line); text-align:center }
.lu::before{ inset-inline:12px }
.lu .ic{ color:var(--cc); width:22px; height:22px }
.lu b{ font-size:.86rem; line-height:1.2 }
.lu small{ font-size:.7rem; color:var(--muted); line-height:1.2 }
.lu-r{ font-family:var(--f-num); color:var(--silver); font-size:1rem; letter-spacing:.08em; line-height:1 }
.ip-toss{ align-items:center; text-align:center }
.coin-stage{ position:relative; width:112px; height:124px; perspective:600px; margin:2px auto 0 }
.coin{ position:relative; width:104px; height:104px; margin:0 auto; transform-style:preserve-3d }
.coin.flipping{ transition:transform 1.8s cubic-bezier(.15,.7,.2,1); animation:coinUp 1.8s cubic-bezier(.3,.7,.3,1) }
.coin-face{ position:absolute; inset:0; border-radius:50%; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:radial-gradient(circle at 34% 28%, #ffffff, #d7deee 45%, #8a95b3 100%); border:4px solid #eef2fb; box-shadow:inset 0 0 0 5px rgba(11,26,69,.12), 0 8px 20px rgba(0,0,0,.4) }
.coin-face svg{ width:52px; height:auto }
.coin-face.fb{ transform:rotateY(180deg) }
.coin-shadow{ width:70px; height:10px; margin:6px auto 0; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(4px) }
.toss-res{ min-height:1.6em; font-size:.98rem }
.intro-foot{ display:flex; justify-content:center; padding-bottom:8px }
.split-resume{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px }
.split-resume h2{ font-family:var(--f-disp); font-size:1.6rem }
.split-resume p .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }

/* ============ match (broadcast) ============ */
html.in-match, html.in-match body{ overflow:hidden; height:100% }
.v-match{ position:relative; isolation:isolate; height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden }
.pitch{ position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(6,13,36,.35) 0%, rgba(6,13,36,.78) 58%, rgba(6,13,36,.96) 100%),
    radial-gradient(circle at 50% 55%, transparent 0 16vh, rgba(255,255,255,.07) calc(16vh + 1px) calc(16vh + 3px), transparent calc(16vh + 4px)),
    linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,.07) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    repeating-linear-gradient(90deg, var(--pitch-a) 0 8.333%, var(--pitch-b) 8.333% 16.666%);
}
.sb-wrap{ padding:10px var(--gutter) 0; display:flex; flex-direction:column; align-items:center; gap:6px }
.sb{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); width:min(1120px,100%); border-radius:14px; overflow:hidden; background:linear-gradient(180deg,#1a3480,#0b1a45 70%); border:1px solid rgba(201,211,232,.26); box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15) }
.sb-side{ position:relative; display:flex; align-items:center; gap:12px; padding:7px 16px; min-width:0; transition:background-color .35s }
.sb-side::before{ content:''; position:absolute; top:0; bottom:0; width:7px; background:var(--tc) }
.sb-side.a::before{ inset-inline-start:0 }
.sb-side.b::before{ inset-inline-end:0 }
.sb-side.a{ padding-inline-start:20px }
.sb-side.b{ padding-inline-end:20px }
.sb-side.on{ background:linear-gradient(0deg, color-mix(in srgb, var(--tc) 30%, transparent), transparent) }
.sb-side.on::after{ content:''; position:absolute; inset-inline:0; bottom:0; height:3px; background:var(--tc); box-shadow:0 0 16px var(--tc) }
.sb-crest svg{ width:42px; height:auto; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)) }
.sb-name{ font-weight:700; font-size:clamp(17px,1.9vw,27px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.sb-score{ font-family:var(--f-num); font-weight:600; font-size:clamp(38px,4.2vw,60px); line-height:1; min-width:1.35em; text-align:center; padding:.1em .22em 0; border-radius:10px; background:rgba(6,13,36,.55); font-variant-numeric:tabular-nums }
.sb-side.a .sb-score{ margin-inline-start:auto }
.sb-side.b .sb-crest{ margin-inline-start:auto }
.sb-score.bump{ animation:bump .8s var(--ease) }
.sb-clock{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 18px; background:#050b1f; min-width:118px; border-inline:1px solid rgba(201,211,232,.2) }
.sb-min{ font-family:var(--f-num); font-weight:500; font-size:clamp(30px,3vw,44px); line-height:1; color:var(--gold); padding-top:4px; font-variant-numeric:tabular-nums }
.sb-min.pens-l{ font-family:var(--f-disp); font-size:clamp(15px,1.5vw,20px); padding:4px 0 2px }
.sb-stage{ font-size:.74rem; color:var(--silver); white-space:nowrap; display:flex; align-items:center; gap:4px }
.sb-stage .sp{ font-size:1.05rem }
.sb-sub{ display:grid; grid-template-columns:1fr auto 1fr; width:min(1120px,100%); align-items:center; gap:10px }
.dots{ display:flex; gap:6px; flex-wrap:wrap }
.dots.b{ justify-content:flex-end }
.dot{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(201,211,232,.45); background:rgba(6,13,36,.5); position:relative; flex:none }
.dot.g{ background:var(--good); border-color:var(--good); box-shadow:0 0 8px rgba(47,208,122,.6) }
.dot.x{ border-color:var(--bad); background:rgba(255,90,106,.15) }
.dot.x::before, .dot.x::after{ content:''; position:absolute; left:50%; top:50%; width:9px; height:2px; background:var(--bad); border-radius:2px }
.dot.x::before{ transform:translate(-50%,-50%) rotate(45deg) } .dot.x::after{ transform:translate(-50%,-50%) rotate(-45deg) }
.dot.h{ background:rgba(201,211,232,.45); border-color:rgba(201,211,232,.45) }
.dot.cur{ border-color:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent); animation:pulse 1.2s infinite }
.turn{ padding:3px 16px; border-radius:99px; background:rgba(6,13,36,.8); border:1px solid color-mix(in srgb, var(--tc) 60%, transparent); white-space:nowrap; font-size:.95rem; box-shadow:0 0 18px color-mix(in srgb, var(--tc) 25%, transparent) }
.turn b{ color:var(--white) }
.qzone{ min-height:0; display:flex; justify-content:center; align-items:center; padding:10px var(--gutter); overflow:auto; transition:filter .3s }
.v-match.is-paused .qzone{ filter:blur(18px) saturate(.6); pointer-events:none }
.qp{ position:relative; width:min(1120px,100%); max-height:100%; display:flex; flex-direction:column; gap:clamp(10px,1.8vh,20px); padding:clamp(14px,2.2vh,24px) clamp(16px,2.4vw,32px); background:var(--glass); border:1px solid var(--line); border-radius:var(--r-l); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:var(--shadow), inset 0 3px 0 var(--cc); animation:qIn .45s var(--ease) both }
.qp-h{ display:flex; align-items:center; gap:12px }
.cat-chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:99px; background:color-mix(in srgb, var(--cc) 14%, transparent); color:var(--cc); font-weight:600; font-size:.9rem; border:1px solid color-mix(in srgb, var(--cc) 40%, transparent); white-space:nowrap }
.cat-chip .ic{ width:17px; height:17px }
.qp-t{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,2.1vw,30px); min-width:0 }
.qp-n{ color:var(--silver); font-size:.9rem; white-space:nowrap }
.ring{ position:relative; width:clamp(56px,5.2vw,72px); aspect-ratio:1; flex:none }
.ring svg{ width:100%; height:100% }
.ring-bg{ fill:rgba(6,13,36,.65); stroke:rgba(201,211,232,.16); stroke-width:6 }
.ring-fg{ fill:none; stroke:var(--flood); stroke-width:6; stroke-linecap:round; transition:stroke .3s }
.ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-num); font-weight:500; font-size:clamp(24px,2.3vw,34px); padding-top:.12em; font-variant-numeric:tabular-nums }
.ring.low .ring-fg{ stroke:var(--bad) }
.ring.low b{ color:var(--bad); animation:pulse 1s infinite }
.ring.off b{ font-size:1.6rem; color:var(--muted); padding-top:0 }
.qp-body{ display:flex; flex-direction:column; gap:clamp(10px,2vh,22px); min-height:0 }
.prompt{ display:flex; align-items:center; justify-content:center; gap:16px; min-height:clamp(84px,17vh,160px); text-align:center; flex-wrap:wrap }
.prompt.sm{ min-height:clamp(60px,10vh,110px) }
.word{ font-weight:700; font-size:clamp(40px,6.5vw,104px); line-height:1.1; letter-spacing:.005em; text-shadow:0 6px 30px rgba(124,196,255,.18) }
.word.ar{ font-weight:600; font-size:clamp(34px,4.6vw,72px); line-height:1.3 }
.prompt.sm .word.ar{ font-size:clamp(30px,3.8vw,58px) }
.say{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(124,196,255,.45); background:rgba(124,196,255,.12); color:var(--flood); flex:none; transition:transform .15s, background-color .2s }
.say:hover{ background:rgba(124,196,255,.24); transform:scale(1.06) }
.say .ic{ width:26px; height:26px }
.say.sm{ width:40px; height:40px }
.say.sm .ic{ width:20px; height:20px }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.4vw,16px) }
.opt{ position:relative; display:flex; align-items:center; gap:14px; min-height:clamp(58px,9.2vh,90px); padding:8px 16px; border-radius:16px; border:1.5px solid rgba(201,211,232,.22); background:linear-gradient(180deg, rgba(26,52,128,.7), rgba(15,33,86,.7)); font-size:clamp(18px,2.2vw,30px); font-weight:600; text-align:center; line-height:1.25; transition:transform .15s var(--ease), border-color .2s, background .2s, opacity .3s, box-shadow .2s }
.opt:hover:not([disabled]){ border-color:var(--flood); transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.3) }
.opt .k{ flex:none; display:grid; place-items:center; width:1.55em; height:1.55em; border-radius:10px; background:rgba(6,13,36,.6); font-family:var(--f-num); font-size:.82em; color:var(--silver); padding-top:.12em; font-weight:500 }
.opt .t{ flex:1; min-width:0; overflow-wrap:anywhere; padding-inline-end:1.55em }
.spell-opts .t, .letter-opts .t{ letter-spacing:.04em }
.letter-opts .t{ font-family:var(--f-ui); font-weight:700 }
.opt[disabled]{ cursor:default }
.opts.done .opt:not(.is-correct):not(.is-wrong){ opacity:.4 }
.opt.is-correct{ border-color:var(--good); background:linear-gradient(180deg, rgba(47,208,122,.35), rgba(47,208,122,.16)); box-shadow:0 0 0 3px rgba(47,208,122,.28), 0 0 30px rgba(47,208,122,.25); animation:correctPop .5s var(--ease) }
.opt.is-correct .k{ background:var(--good); color:#032012 }
.opt.is-wrong{ border-color:var(--bad); background:linear-gradient(180deg, rgba(255,90,106,.3), rgba(255,90,106,.12)); animation:shake .45s }
.opt.is-wrong .k{ background:var(--bad); color:#2a0006 }
/* spell_build */
.slots, .tiles{ display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(6px,.7vw,10px) }
.slot{ width:clamp(40px,4.2vw,60px); height:clamp(50px,5.4vw,72px); border-radius:12px; border:2px dashed rgba(201,211,232,.4); background:rgba(6,13,36,.55); display:grid; place-items:center; font-size:clamp(24px,2.8vw,40px); font-weight:700; padding:0; transition:border-color .2s, background-color .2s, transform .15s }
.slot.fill{ border-style:solid; border-color:var(--flood); background:rgba(124,196,255,.14); animation:slotIn .25s var(--ease) }
.slot.fixed{ border:0; background:none; width:clamp(14px,1.6vw,24px); color:var(--silver) }
.slot.ok{ border-color:var(--good); background:rgba(47,208,122,.22); border-style:solid }
.slot.bad{ border-color:var(--bad); background:rgba(255,90,106,.2); border-style:solid }
.slots.shake{ animation:shake .35s }
.tile{ width:clamp(40px,4.2vw,60px); height:clamp(50px,5.4vw,72px); border-radius:12px; border:0; background:linear-gradient(180deg,#ffffff,#cdd6ea); color:#0b1a45; box-shadow:0 5px 0 #7c88ad, 0 10px 18px rgba(0,0,0,.35); font-size:clamp(24px,2.8vw,40px); font-weight:700; padding:0; transition:transform .12s, opacity .2s, box-shadow .12s }
.tile:hover:not([disabled]){ transform:translateY(-3px) }
.tile:active:not([disabled]){ transform:translateY(3px); box-shadow:0 2px 0 #7c88ad }
.tile.used{ opacity:.14; transform:scale(.9); box-shadow:none }
.sbc{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
.kbd-hint{ text-align:center; color:var(--muted); font-size:.82rem; margin-top:-6px }
.sb-correct{ text-align:center; font-size:1.2rem }
.sb-correct .b, .res-ans .b{ font-weight:700; color:var(--good) }
/* gap_sentence */
.sentence{ font-size:clamp(24px,3.1vw,46px); line-height:1.55; font-weight:500; text-align:center; padding:clamp(6px,2vh,26px) 0 }
.blank{ display:inline-block; min-width:4.6em; margin:0 .2em; border-bottom:4px solid var(--flood); color:var(--flood); text-align:center; line-height:1.15; animation:blink 1.4s ease-in-out infinite }
.blank.ok{ color:var(--good); border-color:var(--good); animation:none }
.blank.fix{ color:var(--gold); border-color:var(--gold); animation:none }
/* gap_letters */
.letters{ display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(6px,.7vw,10px); padding-top:clamp(4px,1.5vh,18px) }
.lb{ width:clamp(42px,4.8vw,72px); height:clamp(54px,6.2vw,90px); display:grid; place-items:center; font-size:clamp(28px,3.6vw,54px); font-weight:700; border-radius:12px; background:rgba(245,247,255,.08); border:1px solid rgba(201,211,232,.2) }
.lb.miss{ border:2.5px dashed var(--gold); color:var(--gold); background:rgba(242,193,78,.1) }
.lb.miss.ok{ border-style:solid; border-color:var(--good); color:var(--good); background:rgba(47,208,122,.18) }
.lb.miss.fix{ border-style:solid }
.lb.gap{ background:none; border:0; width:clamp(12px,1.4vw,22px) }
.hint{ text-align:center; color:var(--silver); font-size:clamp(16px,1.6vw,22px) }
.hint b{ color:var(--white); font-weight:600 }
/* match5 */
.m5{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(48px,20%) minmax(0,1fr); }
.m5-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0 }
.m5-col{ display:flex; flex-direction:column; gap:clamp(8px,1.3vh,12px); position:relative; z-index:1 }
.m5-col.en{ grid-column:1 } .m5-col.ar{ grid-column:3 }
.m5-i{ min-height:clamp(46px,6.8vh,64px); border-radius:14px; border:2px solid rgba(201,211,232,.24); background:linear-gradient(180deg, rgba(26,52,128,.75), rgba(15,33,86,.75)); font-size:clamp(17px,1.9vw,27px); font-weight:600; padding:4px 12px; touch-action:none; user-select:none; -webkit-user-select:none; transition:border-color .2s, background-color .2s, box-shadow .2s, transform .15s; line-height:1.2 }
.m5-i:hover:not([disabled]){ border-color:rgba(245,247,255,.6) }
.m5-i.sel{ border-color:var(--white); box-shadow:0 0 0 4px rgba(245,247,255,.22); transform:scale(1.02) }
.m5-i.lnk{ border-color:var(--lc); background:linear-gradient(180deg, color-mix(in srgb, var(--lc) 26%, #13296a), color-mix(in srgb, var(--lc) 12%, #0b1a45)) }
.m5-i.ok{ border-color:var(--good); background:rgba(47,208,122,.2) }
.m5-i.bad{ border-color:var(--bad); background:rgba(255,90,106,.16) }
.ln{ fill:none; stroke:var(--lc, var(--flood)); stroke-width:4; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(0,0,0,.5)) }
.lnd{ fill:var(--lc, var(--flood)) }
.ln.tmp{ stroke:var(--white); stroke-dasharray:8 7; opacity:.8 }
.ln.ok{ stroke:var(--good) } .lnd.ok{ fill:var(--good) }
.ln.bad{ stroke:var(--bad); stroke-dasharray:10 8 } .lnd.bad{ fill:var(--bad) }
.ln.miss{ stroke:var(--good); stroke-dasharray:2 8; stroke-width:4.5 } .lnd.miss{ fill:var(--good) }
.m5-foot{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap }
.m5-count{ font-family:var(--f-num); font-size:1.7rem; line-height:1; color:var(--gold); min-width:3em; text-align:center; padding-top:4px }
.qp.answered .kbd-hint, .qp.answered .m5-foot .muted{ visibility:hidden }
/* toolbar */
.tools{ display:flex; align-items:center; justify-content:center; gap:6px; padding:8px var(--gutter) calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, rgba(5,11,31,.96), rgba(5,11,31,.72)); border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:thin }
.tool{ display:inline-flex; align-items:center; gap:7px; min-height:44px; min-width:44px; justify-content:center; padding:6px 12px; border-radius:12px; border:1px solid transparent; background:rgba(255,255,255,.05); color:var(--silver); font-size:.9rem; white-space:nowrap; flex:none; transition:background-color .2s, color .2s }
.tool:hover:not([disabled]){ color:var(--white); background:rgba(255,255,255,.11) }
.tool[disabled]{ opacity:.35; cursor:not-allowed }
.tool kbd{ font-family:var(--f-num); font-size:.85rem; padding:0 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted); line-height:1.5 }
.tools-sp{ flex:1; min-width:8px }
/* penalties */
.pens-sb .sb-clock{ min-width:150px }
.pk-row{ display:flex; gap:6px; flex-wrap:wrap }
.pk-row.b{ justify-content:flex-end }
.pk{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(201,211,232,.45); display:grid; place-items:center; background:rgba(6,13,36,.5); position:relative; flex:none }
.pk svg{ width:18px; height:18px }
.pk.g{ border-color:var(--good); box-shadow:0 0 10px rgba(47,208,122,.55); background:#fff }
.pk.x{ border-color:var(--bad); background:rgba(255,90,106,.2) }
.pk.x::before, .pk.x::after{ content:''; position:absolute; left:50%; top:50%; width:12px; height:2.5px; background:var(--bad); border-radius:2px }
.pk.x::before{ transform:translate(-50%,-50%) rotate(45deg) } .pk.x::after{ transform:translate(-50%,-50%) rotate(-45deg) }
.pk.cur{ border-color:var(--tc); animation:pulse 1.2s infinite }
.pens-ready{ align-items:center; text-align:center; max-width:760px; gap:14px }
.pens-ready h2{ font-size:clamp(30px,3.4vw,48px) }
.pens-ready p{ max-width:600px; color:var(--silver) }
.pens-ready .lead{ font-size:1.3rem; color:var(--white) }

/* ============ overlays ============ */
#layer{ position:fixed; inset:0; z-index:50; pointer-events:none }
.ovl{ position:absolute; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,9,26,.66); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); pointer-events:auto; animation:fadeIn .25s ease both; overflow:auto }
.ovl-card{ position:relative; width:min(760px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg, rgba(22,46,112,.97), rgba(9,21,58,.98)); border:1px solid rgba(201,211,232,.26); border-radius:26px; padding:20px 26px 22px; box-shadow:0 30px 90px rgba(0,0,0,.6); text-align:center; animation:cardIn .45s var(--ease) both }
.ovl-card .kicker{ margin-bottom:2px }
.ovl-card h2.disp{ font-size:clamp(28px,3.4vw,44px); margin-bottom:10px }
.ovl-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px }
.ovl-goal .ovl-card{ border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 80px color-mix(in srgb, var(--tc) 40%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.ovl-goal{ background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 16%, rgba(4,9,26,.62)), rgba(4,9,26,.8)) }
.res-top{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap }
.res-head{ display:flex; flex-direction:column; align-items:center }
.res-t{ font-family:var(--f-disp); font-weight:700; font-size:clamp(52px,7vw,96px); line-height:1.05; color:var(--gold); text-shadow:0 8px 40px rgba(242,193,78,.45); animation:goalPop .7s var(--ease) both }
.is-miss .res-t{ color:var(--silver); text-shadow:none; font-size:clamp(42px,5.4vw,72px) }
.res-team{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:1.2rem; flex-wrap:wrap }
.res-team svg{ width:34px; height:auto }
.var-tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:99px; background:rgba(124,196,255,.14); color:var(--flood); font-size:.8rem; font-weight:600 }
.var-tag .ic{ width:14px; height:14px }
.res-score{ display:flex; align-items:center; justify-content:center; gap:10px; margin:12px auto 0; padding:6px 16px; border-radius:14px; background:rgba(6,13,36,.6); width:fit-content; max-width:100% }
.res-score svg{ width:28px; height:auto }
.rs-n{ font-weight:600; white-space:nowrap }
.res-sp{ font-size:2.3rem; font-weight:600; padding:0 6px }
.res-ans{ margin-top:10px; font-size:1.15rem }
.net-wrap{ position:relative; width:220px; height:100px; flex:none }
.net-svg{ width:100%; height:100% }
.net{ transform-box:fill-box; transform-origin:50% 0 }
.in .net{ animation:ripple .5s .62s ease-out }
.ball-fly{ position:absolute; width:34px; height:34px; left:calc(50% - 17px); top:40px }
.ball-fly svg{ width:100%; height:100% }
.in .ball-fly{ animation:ballIn .7s cubic-bezier(.3,.6,.3,1) both }
.out .ball-fly{ animation:ballOut .8s cubic-bezier(.3,.6,.3,1) both }
.out .frame{ animation:postHit .4s .45s }
.learn{ margin-top:14px; display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-radius:16px; background:rgba(6,13,36,.55); border:1px solid var(--line) }
.learn-w{ display:flex; justify-content:center; align-items:center; gap:10px 14px; flex-wrap:wrap }
.lw{ font-size:clamp(26px,3vw,40px); font-weight:700; line-height:1.2 }
.la{ font-size:clamp(20px,2.1vw,28px); color:var(--silver); font-weight:500 }
.pos{ font-size:.8rem; padding:2px 10px; border-radius:99px; background:rgba(201,211,232,.12); color:var(--silver) }
.learn-s{ font-size:clamp(16px,1.7vw,22px); color:var(--silver); line-height:1.5 }
.learn-s mark{ background:rgba(242,193,78,.2); color:var(--gold); padding:0 .25em; border-radius:6px; font-weight:600 }
.learn.m5l{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px 14px; text-align:start }
.lp{ display:flex; align-items:center; gap:8px; justify-content:space-between; padding:4px 8px; border-radius:10px; background:rgba(255,255,255,.04) }
.lp .lw{ font-size:1.15rem } .lp .la{ font-size:1.05rem; flex:1; text-align:end }
.ht-score{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:6px 0 14px }
.ht-score svg{ width:56px; height:auto }
.ht-score b{ font-size:1.4rem }
.sp.big{ font-size:4rem; font-weight:600; padding:0 10px }
.ht-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:start }
.hts{ position:relative; padding:12px 14px 10px; border-radius:14px; background:rgba(6,13,36,.55); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px }
.hts::before{ background:var(--tc) }
.hts .bar{ flex:none; width:100%; margin-top:4px }
.hts .bar > i{ background:var(--tc) }
.pk-team{ display:flex; align-items:center; justify-content:center; gap:10px }
.pk-team svg{ width:44px; height:auto }
.pk-team h2{ font-size:1.8rem }
.pk-num{ font-family:var(--f-num); font-weight:600; font-size:clamp(110px,18vh,180px); line-height:1; color:var(--white); text-shadow:0 0 50px color-mix(in srgb, var(--tc) 70%, transparent); padding-top:.1em; font-variant-numeric:tabular-nums }
.pk-num.pop{ animation:numPop .6s var(--ease); color:var(--gold) }
.ovl-card.pick-card{ width:min(520px,100%); border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 70px color-mix(in srgb, var(--tc) 35%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.pick-card .kicker{ font-family:var(--f-ui); letter-spacing:0; font-weight:600; font-size:1rem; text-transform:none }
.ovl-card.pz, .ovl-card.se, .ovl-card.ht{ width:min(620px,100%) }
.ovl-card.se p, .ovl-card.pz p{ margin-bottom:6px }

/* modal */
.modal-bg{ position:fixed; inset:0; z-index:80; background:rgba(4,9,26,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease both }
.modal{ width:min(540px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg,#16307a,#0b1a45); border:1px solid rgba(201,211,232,.26); border-radius:22px; padding:22px 24px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:cardIn .3s var(--ease) both }
.modal.wide{ width:min(760px,100%) }
.modal h3{ display:flex; align-items:center; gap:10px; font-family:var(--f-disp); font-weight:600; font-size:1.4rem; margin-bottom:12px }
.modal h3 .ic{ color:var(--flood); width:24px; height:24px }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px }
.confirm-t{ font-size:1.08rem; line-height:1.7 }
.var-box{ display:flex; flex-direction:column; gap:8px; border-inline-start:4px solid var(--tc); padding-inline-start:14px }
.var-now{ font-size:1.15rem }
.var-now .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.bk{ display:grid; gap:18px }
.bk section{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:var(--r); background:rgba(6,13,36,.45); border:1px solid var(--line) }
.bk h4{ font-size:1.05rem }
.bk textarea{ width:100%; border-radius:12px; border:1px solid var(--line); background:rgba(6,13,36,.7); padding:10px; resize:vertical; min-height:90px }
.file-btn{ position:relative; cursor:pointer }
.file-btn:focus-within{ outline:3px solid var(--flood); outline-offset:3px }
/* toasts */
#toasts{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(560px, calc(100% - 32px)) }
.toast{ padding:10px 18px; border-radius:14px; background:rgba(11,26,69,.97); border:1px solid var(--line); box-shadow:var(--shadow); animation:toastIn .3s var(--ease) both; font-weight:500; text-align:center; transition:opacity .3s, transform .3s }
.toast.good{ border-color:rgba(47,208,122,.6) } .toast.bad{ border-color:rgba(255,90,106,.65) }
.toast.out{ opacity:0; transform:translateY(8px) }

/* ============ full time ============ */
.v-ft{ padding-top:clamp(18px,4vh,40px); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center }
.ft-head h1{ font-size:clamp(34px,4vw,54px) }
.ft-score{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:clamp(12px,3vw,40px); width:min(980px,100%); margin-top:6px }
.ft-team{ display:flex; align-items:center; gap:16px; justify-content:flex-end; min-width:0 }
.ft-team.b{ flex-direction:row-reverse; justify-content:flex-end }
.ft-team svg{ width:clamp(60px,7vw,96px); height:auto; flex:none }
.ft-team b{ font-family:var(--f-num), var(--f-disp); font-size:clamp(30px,3.6vw,52px); font-weight:600; line-height:1; overflow:hidden; text-overflow:ellipsis }
.ft-team.win b{ color:var(--gold) }
.ft-nums{ display:flex; align-items:center; gap:12px; padding:8px 26px 0; border-radius:20px; background:linear-gradient(180deg,#1a3480,#0b1a45); border:1px solid rgba(201,211,232,.26); box-shadow:var(--shadow) }
.ft-nums .n{ font-family:var(--f-num); font-weight:600; font-size:clamp(64px,8vw,112px); line-height:1; min-width:.7em; font-variant-numeric:tabular-nums }
.ft-nums .dash{ font-family:var(--f-num); font-size:3rem; opacity:.5 }
.n.reveal-pop{ animation:numPop .8s var(--ease); color:var(--gold) }
.ft-pens{ display:flex; align-items:center; gap:10px; font-size:1.05rem; color:var(--silver) }
.ft-pens .sp{ font-size:1.8rem; color:var(--white) }
.ft-result{ display:flex; flex-direction:column; align-items:center; gap:6px; transition:opacity .5s }
.ft-result.pending{ opacity:0 }
.rl{ display:inline-flex; align-items:center; gap:8px; font-family:var(--f-disp); font-size:clamp(22px,2.4vw,32px); font-weight:600 }
.rl.win{ color:var(--gold) }
.rl .ic{ width:28px; height:28px }
.ft-points{ color:var(--silver) }
.ft-points b{ font-family:var(--f-num); font-size:1.5rem; color:var(--good); vertical-align:-2px }
.ft-points.gold{ color:var(--gold); font-weight:600; display:flex; align-items:center; gap:6px }
.ft-tbl{ width:min(860px,100%) }
.ft-rounds{ width:100%; border-collapse:collapse; min-width:480px }
.ft-rounds th{ padding:10px; font-weight:500; color:var(--silver); font-size:.88rem; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35) }
.ft-rounds td{ padding:8px 10px; border-bottom:1px solid var(--line) }
.ft-rounds tr:last-child td{ border-bottom:0 }
.ft-rounds td.rn{ font-family:var(--f-num); font-size:1.3rem; color:var(--muted); width:40px }
.ft-rounds td.rt{ text-align:start; white-space:nowrap }
.cat-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--cc); margin-inline-end:8px }
.ft-rounds td.ok, .ft-rounds td.no{ white-space:nowrap }
.rc{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; margin-inline-end:8px; vertical-align:middle }
.rc .ic{ width:15px; height:15px }
td.ok .rc{ background:var(--good); color:#032012 } td.no .rc{ background:rgba(255,90,106,.25); color:var(--bad) }
.rw{ font-weight:500 }
.ft-rounds small{ display:inline-block; margin-inline-start:6px; color:var(--muted); font-size:.75rem }
.var-s{ color:var(--flood)!important }
.ft-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px }

/* ============ champion ============ */
.v-champ{ position:relative; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:28px var(--gutter); overflow:hidden }
#fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2 }
.v-champ .beam{ background:linear-gradient(180deg, rgba(255,224,138,.28), rgba(242,193,78,.05) 55%, transparent 80%) }
.champ-grid{ position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(20px,4vw,60px); align-items:center; width:min(1200px,100%) }
.champ-main{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px }
.champ-main .kicker{ color:var(--gold) }
.trophy{ width:clamp(130px,24vh,230px); height:auto; filter:drop-shadow(0 20px 50px rgba(242,193,78,.4)); animation:rise 1.2s var(--ease) both }

.rd-opp{ flex:1; font-weight:600 }
.rd-sc{ font-size:1.6rem }
.champ-actions{ display:flex; gap:10px; flex-wrap:wrap }

/* ============ certificate ============ */
.cert-tools{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; margin:-6px 0 12px }
.v-cert .topbar{ margin-bottom:12px; padding:10px 0 }
.note{ display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:.92rem; border-radius:14px; background:rgba(124,196,255,.1); border:1px solid rgba(124,196,255,.35); max-width:760px }
.note .ic{ color:var(--flood); flex:none }
.cert-wrap{ display:flex; justify-content:center }
.cert{ position:relative; width:min(1100px, 100%, calc((100vh - 210px) * 1.4143)); aspect-ratio:297/210; container-type:inline-size; background:radial-gradient(ellipse at 50% 30%, #fffdf6, #f6f0df 70%, #eee4c8); color:#0b1a45; border-radius:6px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); font-family:var(--f-ui); -webkit-print-color-adjust:exact; print-color-adjust:exact }
.cert-frame{ position:absolute; inset:2.2cqw; border:.35cqw solid #0b1a45; outline:.18cqw solid #c8931e; outline-offset:-.9cqw; border-radius:.4cqw }
.cc{ position:absolute; width:5cqw; height:5cqw; border:.35cqw solid #c8931e }
.cc.c1{ top:1.2cqw; right:1.2cqw; border-left:0; border-bottom:0 } .cc.c2{ top:1.2cqw; left:1.2cqw; border-right:0; border-bottom:0 }
.cc.c3{ bottom:1.2cqw; right:1.2cqw; border-left:0; border-top:0 } .cc.c4{ bottom:1.2cqw; left:1.2cqw; border-right:0; border-top:0 }
.cert-wm{ position:absolute; inset:0; display:grid; place-items:center; opacity:.06; pointer-events:none }
.cert-wm svg{ width:34cqw; height:auto }
.cert-in{ position:absolute; inset:4.5cqw 6cqw; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:space-between }
.cert-top{ display:flex; align-items:center; justify-content:space-between; width:100% }
.cert-emb{ width:9.5cqw; height:9.5cqw; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #1d3a8a, #0b1a45 70%); box-shadow:0 0 0 .3cqw #c8931e, 0 .5cqw 1.2cqw rgba(11,26,69,.3) }
.cert-emb svg{ width:8.6cqw; height:auto }
.cert-school{ display:flex; flex-direction:column; align-items:center; gap:.3cqw }
.cert-school b{ font-family:var(--f-disp); font-size:2.6cqw; font-weight:700 }
.cert-school span{ font-size:1.5cqw; color:#43507a }
.cert-kicker{ font-family:var(--f-num); letter-spacing:.3em; font-size:1.3cqw; color:#b07d12 }
.cert-title{ font-family:var(--f-disp); font-weight:700; font-size:5.6cqw; line-height:1.1; background:linear-gradient(180deg,#0b1a45,#1d3a8a); -webkit-background-clip:text; background-clip:text; color:transparent }
.cert-text{ font-size:2.05cqw; line-height:1.6; color:#1c2a55 }
.cert-text b{ color:#0b1a45 }
.cert-team{ display:flex; align-items:center; gap:1.4cqw }
.cert-team svg{ width:5.2cqw; height:auto }
.cert-team b{ font-family:var(--f-num), var(--f-disp); font-size:7cqw; line-height:1; font-weight:600; color:#b07d12; padding-top:.6cqw }
.cert-date{ font-size:1.6cqw; color:#43507a }
.cert-sign{ display:grid; grid-template-columns:1fr auto 1fr; align-items:end; width:100%; gap:3cqw }
.sg{ display:flex; flex-direction:column; align-items:center; gap:.4cqw; font-size:1.5cqw }
.sg span{ color:#43507a }
.sg b{ font-size:1.8cqw; min-height:1.2em }
.sg i{ display:block; width:80%; height:.15cqw; background:#0b1a45; margin-top:1.8cqw }
.seal svg{ width:6.5cqw; height:auto; opacity:.9 }

/* ============ bank ============ */
.bank-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px }
.search{ flex:1; min-width:240px; display:flex; align-items:center; gap:10px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.6) }
.search:focus-within{ border-color:var(--flood); box-shadow:0 0 0 3px rgba(124,196,255,.2) }
.search .ic{ color:var(--muted) }
.search input{ flex:1; min-height:48px; border:0; background:none; outline:none; font-size:1rem; min-width:0 }
.bank-count b{ font-family:var(--f-num); font-size:1.5rem; color:var(--gold); vertical-align:-3px }
.bank-units{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px }
.unit{ border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); overflow:hidden }
.unit summary{ display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; list-style:none; min-height:56px }

.unit summary:hover{ background:rgba(255,255,255,.03) }
.unit .chev{ transition:transform .25s; color:var(--muted) }

.u-lv{ display:flex; gap:4px }

.words th{ text-align:start; padding:10px 12px; font-weight:500; font-size:.84rem; color:var(--silver); border-bottom:1px solid var(--line) }

.words tr:last-child td{ border-bottom:0 }

.words td.ex{ color:var(--muted); font-size:.88rem; max-width:360px }
.words tr.bad td{ background:rgba(255,90,106,.06) }
.words .ic{ display:inline }
.my-words{ display:flex; flex-direction:column; gap:12px }
.my-words textarea{ width:100%; border-radius:14px; border:1px solid var(--line); background:rgba(6,13,36,.65); padding:12px 14px; resize:vertical; font-size:1rem; line-height:1.7; min-height:140px }

.h3{ font-size:1.05rem; margin-top:6px }
.pv-sum{ display:flex; gap:10px; align-items:center; font-weight:600 }

/* ============ help ============ */
.help-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }

.nums{ margin:0; padding-inline-start:1.4em; display:flex; flex-direction:column; gap:6px; color:var(--silver) }
.help-types{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }
.ht-cat{ position:relative; padding:12px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px }
.ht-cat h3{ display:flex; align-items:center; gap:6px; font-size:1rem; color:var(--white) }
.ht-cat h3 .ic{ color:var(--cc) }
.ht-cat h3 small{ font-family:var(--f-num); letter-spacing:.12em; color:var(--cc); font-weight:500 }
.ht-type{ display:flex; flex-direction:column; gap:2px; font-size:.88rem }
.ht-type span{ color:var(--muted) }
.keys{ border-collapse:collapse; width:100% }
.keys td{ padding:6px 8px; border-bottom:1px solid var(--line) }
.keys tr:last-child td{ border-bottom:0 }
kbd{ font-family:var(--f-num); font-size:1rem; padding:1px 8px; border-radius:7px; border:1px solid var(--line); background:rgba(255,255,255,.06); white-space:nowrap }
.help-foot{ text-align:center; margin-top:22px }

/* ============ motion ============ */
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
@keyframes cardIn{ from{opacity:0; transform:translateY(18px) scale(.97)} to{opacity:1; transform:none} }
@keyframes qIn{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
@keyframes popIn{ 0%{opacity:0; transform:scale(.6)} 70%{opacity:1; transform:scale(1.06)} 100%{transform:scale(1)} }
@keyframes flipIn{ from{opacity:0; transform:rotateX(-92deg)} to{opacity:1; transform:rotateX(0)} }
@keyframes toastIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
@keyframes blink{ 0%,100%{border-color:var(--flood)} 50%{border-color:rgba(124,196,255,.3)} }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.35); color:var(--gold)} 100%{transform:scale(1)} }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes correctPop{ 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes slotIn{ from{transform:scale(.8)} to{transform:scale(1)} }
@keyframes goalPop{ 0%{opacity:0; transform:scale(.4) rotate(-6deg)} 60%{opacity:1; transform:scale(1.12) rotate(2deg)} 100%{transform:scale(1) rotate(0)} }
@keyframes numPop{ 0%{transform:scale(.6)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes ballIn{ 0%{transform:translate(80px,90px) scale(1.7) rotate(0)} 100%{transform:translate(-14px,-10px) scale(.85) rotate(-600deg)} }
@keyframes ballOut{ 0%{transform:translate(80px,90px) scale(1.7) rotate(0); opacity:1} 60%{transform:translate(96px,-18px) scale(1) rotate(-400deg); opacity:1} 100%{transform:translate(150px,-70px) scale(.7) rotate(-600deg); opacity:0} }
@keyframes ripple{ 0%{transform:scale(1)} 40%{transform:scale(1.05,1.12)} 100%{transform:scale(1)} }
@keyframes postHit{ 0%,100%{transform:translateX(0)} 30%{transform:translateX(2px)} 60%{transform:translateX(-2px)} }
@keyframes coinUp{ 0%{translate:0 0} 45%{translate:0 -46px} 100%{translate:0 0} }
@keyframes rise{ from{opacity:0; transform:translateY(40px) scale(.9)} to{opacity:1; transform:none} }
@keyframes rowFlash{ 0%,60%{background-color:rgba(124,196,255,.22)} 100%{background-color:transparent} }
@media (prefers-reduced-motion: reduce){

}

  .legend{ font-size:.8rem }
}

}

<div class="tiles" id="tiles" dir="ltr" lang="en">${q.tiles.map((t) => `<button class="tile" data-act="tile" data-id="${t.id}" aria-label="الحرف ${t.ch}">${t.ch}</button>`).join('')}</div>
<div class="sbc"><button class="btn btn-ghost" data-act="sb-back" aria-label="حذف آخر حرف">${icon('backspace')}<span>تراجع</span></button><button class="btn btn-ghost" data-act="sb-clear">${icon('x')}<span>مسح</span></button><button class="btn btn-primary" data-act="sb-check" id="sb-check" disabled>${icon('check')}<span>تحقق</span></button></div>
<p class="kbd-hint">اضغط الحروف بالترتيب، أو اكتب بلوحة المفاتيح — اضغط خانة ممتلئة لإرجاع حرفها</p>`;
    }
    case 'gap_sentence': { const [a, b] = q.s.split('___'); return `<p class="sentence" dir="ltr" lang="en">${esc(a)}<span class="blank" id="blank" aria-label="فراغ">&nbsp;</span>${esc(b)}</p>${optsHTML(q, true)}`; }
    case 'gap_letters': return `<div class="letters" dir="ltr" lang="en" aria-label="الكلمة مع حروف ناقصة">${q.w.split('').map((c, i) => { const j = q.hid.indexOf(i); if (j >= 0) return `<span class="lb miss" data-h="${j}">?</span>`; if (c === ' ') return '<span class="lb gap"></span>'; if (c === '-') return '<span class="lb gap">-</span>'; return `<span class="lb">${c}</span>`; }).join('')}</div><p class="hint">المعنى: <b>${esc(q.ar)}</b></p>${optsHTML(q, true, 'letter-opts')}`;
    case 'match5': return `<div class="m5" id="m5"><svg class="m5-svg" id="m5svg" aria-hidden="true"></svg>
<div class="m5-col en" role="group" aria-label="الكلمات الإنجليزية">${q.items.map((it, i) => `<button class="m5-i" data-act="m5" data-side="L" data-i="${i}" aria-pressed="false"><span dir="ltr" lang="en">${esc(it.w)}</span></button>`).join('')}</div>
<div class="m5-col ar" role="group" aria-label="الترجمات العربية">${q.right.map((li, j) => `<button class="m5-i" data-act="m5" data-side="R" data-i="${j}" aria-pressed="false">${esc(q.items[li].ar)}</button>`).join('')}</div></div>
<div class="m5-foot"><span class="m5-count" id="m5-count" dir="ltr">0 / ${q.items.length}</span><span class="muted small">اضغط كلمة ثم ترجمتها، أو اسحب خطًا بينهما</span><button class="btn btn-primary" data-act="m5-check" id="m5-check" disabled>${icon('check')}<span>تحقق</span></button></div>`;
    default: return '';
  }
}
function questionHTML(q, info) {

<header class="qp-h"><span class="cat-chip">${icon(C.icon)}<span>${C.ar}</span></span><h2 class="qp-t" id="qp-t">${TYPES[q.type].ar}</h2><span class="qp-n">${info.label}</span>${ringHTML(info.secs)}</header>
<div class="qp-body">${bodyHTML(q)}</div></article>`;
}
function answerHTML(q) {
  if (q.type === 'match5') return '';
  if (q.type === 'mean_en_ar') return `<b>${esc(q.ar)}</b>`;
  if (q.type === 'gap_letters') return `${en(q.w, 'b')} <span class="muted">(${en(q.opts[q.ans])})</span>`;
  return en(q.w, 'b');
}
function plainAnswer(q) { return q.type === 'match5' ? '' : q.type === 'mean_en_ar' ? q.ar : q.w; }
function learnCard(q) {
  if (q.type === 'match5') return `<div class="learn m5l">${q.items.map((it) => `<div class="lp"><span class="lw" dir="ltr" lang="en">${esc(it.w)}</span>${sayBtn(it.w, 'sm')}<span class="la">${esc(it.ar)}</span></div>`).join('')}</div>`;
  const parts = q.s ? q.s.split('___') : null;
  return `<div class="learn"><div class="learn-w"><span class="lw" dir="ltr" lang="en">${esc(q.w)}</span>${sayBtn(q.w, 'sm')}<span class="la">${esc(q.ar)}</span>${q.pos ? `<span class="pos">${POS_AR[q.pos]}</span>` : ''}</div>${parts ? `<p class="learn-s" dir="ltr" lang="en">${esc(parts[0])}<mark>${esc(q.w)}</mark>${esc(parts[1])}</p>` : ''}</div>`;
}
function netAnim(ok) {
  const pid = 'np' + uid();
  return `<div class="net-wrap ${ok ? 'in' : 'out'}" aria-hidden="true"><svg class="net-svg" viewBox="0 0 240 108"><defs><pattern id="${pid}" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0L9 9M9 0L0 9" stroke="rgba(245,247,255,.3)" stroke-width="1"/></pattern></defs><g class="net"><path d="M40 12 H200 L186 28 H54 Z" fill="url(#${pid})"/><rect x="54" y="28" width="132" height="72" fill="url(#${pid})"/><path d="M40 12 L54 28 V100 M200 12 L186 28 V100 M54 28 H186" stroke="rgba(245,247,255,.35)" fill="none"/></g><path class="frame" d="M40 101 V12 H200 V101" fill="none" stroke="#f5f7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="4" y1="102" x2="236" y2="102" stroke="rgba(245,247,255,.35)" stroke-width="2"/></svg><div class="ball-fly">${ballSVG('bf' + uid())}</div></div>`;
}
function resultOverlay(m, st, ctx) {
  const ok = !!st.ok, t = teamById(st.t), q = st.q, pens = ctx === 'pens';

  const kick = ok ? 'GOAL' : pens ? 'SAVED' : 'MISSED';
  const minute = pens ? '' : `${Math.max(1, minuteOf(m, idx + 1))}'`;
  let sc;
  if (pens) { const p = pensTally(m); sc = scorePair(p.sa, p.sb, 'res-sp'); } else { const v = visibleScore(m); sc = scorePair(v[0], v[1], 'res-sp'); }
  const A = teamById(m.a), B = teamById(m.b);
  return `<div class="ovl-card res ${ok ? 'is-goal' : 'is-miss'}" role="dialog" aria-modal="true" aria-labelledby="res-t" style="--tc:${t.color}">

  <div class="res-team">${crestSVG(t, 34)}<b>${bd(t.name)}</b>${st.var ? `<span class="var-tag">${icon('var')} قرار الفار</span>` : ''}${st.to ? '<span class="var-tag">انتهى الوقت</span>' : ''}</div></div></div>
  <div class="res-score">${crestSVG(A, 30)}<span class="rs-n">${bd(A.name)}</span>${sc}<span class="rs-n">${bd(B.name)}</span>${crestSVG(B, 30)}</div>

  ${learnCard(q)}
  <div class="ovl-actions"><button class="btn btn-ghost" data-act="var">${icon('var')}<span>مراجعة الفار</span></button><button class="btn btn-gold btn-xl" data-act="next" id="btn-next">${icon('next')}<span>التالي</span><kbd>Enter</kbd></button></div>

function halftimeHTML(m) {

  <div class="ht-score">${crestSVG(A, 64)}<b>${bd(A.name)}</b>${scorePair(a, b, 'big')}<b>${bd(B.name)}</b>${crestSVG(B, 64)}</div>
  <div class="ht-stats">${[m.a, m.b].map((id) => { const steps = m.seq.slice(0, m.step).filter((s) => s.t === id), g = steps.filter((s) => s.ok).length; return `<div class="hts" style="--tc:${teamById(id).color}"><b>${bd(teamName(id))}</b><span>${g} من ${steps.length} إجابات صحيحة</span><div class="bar"><i style="width:${steps.length ? (g / steps.length) * 100 : 0}%"></i></div></div>`; }).join('')}</div>
  <div class="ovl-actions"><button class="btn btn-gold btn-xl" data-act="second-half" id="btn-next">${icon('whistle')}<span>بداية الشوط الثاني</span></button></div></div>`;
}

  <p>أجابت الشعبة على ${m.R} أسئلة. <b>النتيجة مخفية</b> ولن تُكشف إلا في نهاية المباراة.</p><p class="muted">المباراة الآن «بانتظار شعبة ${bd(teamName(Y))}» — ستلعب الأسئلة المتقابلة نفسها في حصتها.</p>
  <div class="ovl-actions"><button class="btn btn-ghost" data-act="exit-match">${icon('home')}<span>مركز البطولة</span></button><button class="btn btn-gold" data-act="split-start" id="btn-next">${icon('play')}<span>ابدأ دور ${bd(teamName(Y))} الآن</span></button></div></div>`;

VIEWS.match = () => {

/* ---------- Full time ---------- */
VIEWS.ft = () => {
  const m = curMatch(); if (!m || !m.seq) return VIEWS.home();
  const A = teamById(m.a), B = teamById(m.b), [a, b] = score(m), pt = m.pens ? pensTally(m) : null;
  const hide = S.ftReveal && S.ftFresh ? (m.present === m.a ? 0 : 1) : -1;
  let result;
  if (m.status === 'pens') result = `<span class="rl draw">تعادل — تُحسم المباراة بركلات الترجيح</span>`;
  else if (m.winner) result = `<span class="rl win" style="--tc:${teamById(m.winner).color}">${icon('trophy')} فوز ${bd(teamName(m.winner))}${pt && pt.winner ? ' بركلات الترجيح' : ''}</span>`;
  else result = `<span class="rl draw">تعادل</span>`;
  let points = '';
  if (m.stage === 'league' && m.status === 'done') points = m.winner ? `<p class="ft-points"><b>${num('+3')}</b> نقاط لـ ${bd(teamName(m.winner))} <span class="muted">· ${num('0')} لـ ${bd(teamName(other(m, m.winner)))}</span></p>` : `<p class="ft-points"><b>${num('+1')}</b> نقطة لكل شعبة</p>`;
  if (m.stage === 'final' && m.status === 'done') points = `<p class="ft-points gold">${icon('trophy')} ${bd(teamName(m.winner))} بطل دوري أبطال المفردات!</p>`;
  if (m.stage === 'semi' && m.status === 'done') points = `<p class="ft-points">${bd(teamName(m.winner))} يتأهل إلى النهائي</p>`;
  const maxR = Math.max(...m.seq.map((s) => s.r)) + 1;
  const cell = (t, r) => { const s = m.seq.find((x) => x.t === t && x.r === r); if (!s) return '<td class="muted">—</td>'; return `<td class="${s.ok ? 'ok' : 'no'}"><span class="rc">${s.ok ? icon('check') : icon('x')}</span>${s.q.type === 'match5' ? '<small>5 كلمات</small>' : en(s.q.w, 'rw')}${s.var ? '<small class="var-s">الفار</small>' : ''}${m.demo ? `<small>${TYPES[s.q.type].short}</small>` : ''}</td>`; };
  const rows = Array.from({ length: maxR }, (_, r) => { const s = m.seq.find((x) => x.r === r); return `<tr><td class="rn">${r + 1}</td>${m.demo ? '' : `<td class="rt"><span class="cat-dot" style="--cc:${CATS[s.q.cat].color}"></span>${TYPES[s.q.type].short}</td>`}${cell(m.a, r)}${cell(m.b, r)}</tr>`; }).join('');
  let actions;
  if (m.demo) actions = `<button class="btn btn-ghost" data-act="go" data-to="home">${icon('home')}<span>الرئيسية</span></button><button class="btn btn-ghost" data-act="demo">${icon('sparkle')}<span>تجربة أخرى</span></button><button class="btn btn-gold btn-xl" data-act="new-t">${icon('plus')}<span>بطولة جديدة</span></button>`;
  else {
    actions = `<button class="btn ${m.status === 'pens' || (m.stage === 'final' && m.status === 'done') ? 'btn-ghost' : 'btn-gold btn-xl'}" data-act="ft-hub">${icon('trophy')}<span>مركز البطولة</span></button>`;
    if (m.status === 'pens') actions += `<button class="btn btn-gold btn-xl" data-act="go-pens" id="btn-next">${icon('target')}<span>ركلات الترجيح</span></button>`;
    if (m.stage === 'final' && m.status === 'done') actions += `<button class="btn btn-gold btn-xl" data-act="go" data-to="champion" id="btn-next">${icon('trophy')}<span>تتويج البطل</span></button>`;

<div class="ft-head"><p class="kicker" dir="ltr" lang="en">${m.demo ? 'FRIENDLY · ' : ''}FULL TIME</p><h1 class="disp">${m.demo ? 'انتهت التجربة' : 'نهاية المباراة'}</h1><p class="muted">${esc(stageLabel(m))}${m.mode === 'split' ? ' · على حصتين' : ''}</p></div>

  <div class="ft-nums"><span class="n" id="ft-a" data-v="${a}">${hide === 0 ? '?' : a}</span><span class="dash">–</span><span class="n" id="ft-b" data-v="${b}">${hide === 1 ? '?' : b}</span></div>
  <div class="ft-team b${m.winner === m.b ? ' win' : ''}" style="--tc:${B.color}">${crestSVG(B, 96)}<b>${bd(B.name)}</b></div>

${pt && (pt.ta || pt.tb) ? `<p class="ft-pens">ركلات الترجيح ${scorePair(pt.sa, pt.sb)}</p>` : ''}
