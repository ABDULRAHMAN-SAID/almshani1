<style>
/* ============ tokens (single deliberate dark "stadium at night" theme) ============ */
:root{
  color-scheme: dark;
  --night:#060d24; --navy:#0b1a45; --navy-2:#13296a; --line:rgba(201,211,232,.16);
  --silver:#c9d3e8; --white:#f5f7ff; --flood:#7cc4ff; --gold:#f2c14e;
  --pitch-a:#0e4a2e; --pitch-b:#115a37;
  --good:#2fd07a; --bad:#ff5a6a; --warn:#ffb547;
  --glass: rgba(11,26,69,.78); --glass-2: rgba(19,41,106,.55); --glass-3: rgba(6,13,36,.55);
  --muted: rgba(201,211,232,.74);
  --f-ui: 'Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic','Noto Sans',Arial,sans-serif;
  --f-disp: 'Reem Kufi','Readex Pro','Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  --f-num: 'Teko','Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --r-l: 22px; --r: 16px; --r-s: 12px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter: clamp(16px, 2.4vw, 32px);
}
@supports (background: color-mix(in srgb, red 50%, transparent)){
  :root{ --glass: color-mix(in srgb, var(--navy) 78%, transparent); --glass-2: color-mix(in srgb, var(--navy-2) 55%, transparent); --glass-3: color-mix(in srgb, var(--night) 55%, transparent); }
}
*,*::before,*::after{ box-sizing:border-box }
/* the page scrollbar never appears/disappears between screens (its gutter is always reserved); the match screen never scrolls */
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--night); scrollbar-gutter:stable }
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--white); font-family:var(--f-ui); font-size:17px; line-height:1.6;
  background-color:var(--night);
  background-image: radial-gradient(120% 80% at 50% -12%, #16307a 0%, #0d1f55 30%, #081333 58%, #060d24 80%);
  background-attachment: fixed; overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none }
#app{ position:relative; z-index:1; min-height:100vh; min-height:100dvh }
.view{ outline:none; min-height:100vh; min-height:100dvh }
button, input, textarea, select{ font:inherit; color:inherit }
/* phones zoom into any field whose text is smaller than 16px — never let that happen */
input, textarea, select{ font-size:max(16px, 1em) }
button{ cursor:pointer }
svg{ display:block }
h1,h2,h3,h4{ line-height:1.25; margin:0 }
p{ margin:0 }
code, .mono{ font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size:.9em }
textarea.mono{ font-size:16px }
code{ background:rgba(255,255,255,.08); padding:.05em .4em; border-radius:6px }
bdi{ unicode-bidi:isolate }
.en{ unicode-bidi:isolate }
.num{ unicode-bidi:isolate; font-variant-numeric:tabular-nums }
.muted{ color:var(--muted) }
.small{ font-size:.86rem }
.good{ color:var(--good) } .bad{ color:var(--bad) }
.good .ic, .bad .ic{ display:inline-block; width:1em; height:1em; vertical-align:-.12em }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
:focus-visible{ outline:3px solid var(--flood); outline-offset:3px }
[hidden]{ display:none!important }
.ic{ width:20px; height:20px; flex:none }
.ic.big{ width:42px; height:42px }
.kicker{ font-family:var(--f-num); font-weight:500; letter-spacing:.2em; font-size:1.05rem; line-height:1.1; color:var(--flood); text-transform:uppercase }
.disp{ font-family:var(--f-disp); font-weight:600 }

/* ============ buttons ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.55em; min-height:48px; padding:.55em 1.2em; border-radius:14px; border:1px solid var(--line); background:var(--glass-2); color:var(--white); font-weight:600; font-size:1rem; line-height:1.2; text-decoration:none; transition:background-color .2s, border-color .2s, box-shadow .2s, filter .15s; white-space:nowrap }
.btn:hover{ background:var(--navy-2); border-color:rgba(124,196,255,.45) }
.btn:active{ filter:brightness(.9) }
.btn[disabled]{ opacity:.42; cursor:not-allowed; box-shadow:none }
.btn .ic{ width:1.2em; height:1.2em }
.btn small{ display:block; font-weight:400; font-size:.78em; opacity:.85; margin-top:2px }
.btn > span{ text-align:start }
.btn kbd{ font-family:var(--f-num); font-size:.85em; padding:0 .4em; border-radius:6px; border:1px solid currentColor; opacity:.55; line-height:1.3 }
.btn-primary{ background:linear-gradient(180deg,#9ad6ff,#4fa7f1); color:#04112e; border-color:transparent; box-shadow:0 8px 24px rgba(124,196,255,.25) }
.btn-primary:hover{ background:linear-gradient(180deg,#b2e0ff,#63b4f6); border-color:transparent }
.btn-gold{ background:linear-gradient(180deg,#ffe08a,#e2a82c); color:#241500; border-color:transparent; box-shadow:0 10px 28px rgba(242,193,78,.28) }
.btn-gold:hover{ background:linear-gradient(180deg,#ffe9a8,#ecb43a); border-color:transparent }
.btn-ghost{ background:rgba(255,255,255,.045) }
.btn-danger{ background:rgba(255,90,106,.12); border-color:rgba(255,90,106,.45); color:#ffd3d8 }
.btn-danger:hover{ background:rgba(255,90,106,.22); border-color:rgba(255,90,106,.7) }
.btn-xl{ min-height:58px; font-size:1.12rem; padding:.6em 1.5em; border-radius:16px }
.btn-sm{ min-height:44px; padding:.4em .95em; font-size:.93rem; border-radius:12px }
.icon-btn{ width:44px; height:44px; display:inline-grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.045); color:var(--silver); transition:background-color .2s, color .2s; flex:none }
.icon-btn:hover{ background:rgba(255,255,255,.1); color:var(--white) }
.icon-btn[disabled]{ opacity:.35; cursor:not-allowed }
.icon-btn.sm{ width:38px; height:38px; border-radius:10px }
.icon-btn.sm .ic{ width:18px; height:18px }
.link{ background:none; border:0; padding:0; color:var(--flood); text-decoration:underline; text-underline-offset:3px; font-weight:500 }

/* ============ panels & layout ============ */
.page{ max-width:1320px; margin:0 auto; padding:0 var(--gutter) 56px }
.page-narrow{ max-width:1160px; margin:0 auto; padding:0 var(--gutter) 40px }
.panel{ background:var(--glass); border:1px solid var(--line); border-radius:var(--r-l); padding:20px 22px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
.panel h2{ display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:600; margin-bottom:14px }
.panel h2 .ic{ color:var(--flood) }
.panel h2 small, .panel h3 small{ font-weight:400; color:var(--muted); font-size:.82rem }
.panel-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px }
.panel-h h2{ margin:0 }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.bar{ height:8px; border-radius:99px; background:rgba(201,211,232,.14); overflow:hidden; flex:1 }
.bar > i{ display:block; height:100%; border-radius:inherit; background:var(--flood); transition:width .8s var(--ease) }
.lv{ display:inline-flex; gap:3px; vertical-align:middle }
.lv i{ width:7px; height:7px; border-radius:50%; background:rgba(201,211,232,.25) }
.lv i.on{ background:var(--gold) }

/* topbar */
.topbar{ display:flex; align-items:center; gap:16px; padding:16px 0 14px; margin-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 2px; border-radius:12px; text-align:start }
.brand .seal-mini{ width:50px; height:50px; object-fit:contain; flex:none; filter:drop-shadow(0 4px 14px rgba(242,193,78,.22)) }
.brand-t b{ display:block; font-family:var(--f-disp); font-weight:600; font-size:1.08rem; line-height:1.2 }
.brand-t small{ display:block; font-family:var(--f-disp); font-weight:600; font-size:.92rem; color:var(--gold); line-height:1.3 }
.tb-title{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(1.3rem,2vw,1.7rem); text-align:center; min-width:160px }
.tb-act{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }

/* ============ home ============ */
.v-home{ position:relative; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,3.4vh,34px); padding:28px var(--gutter) 28px; text-align:center; overflow:hidden }
.beams{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:-1 }
.beam{ position:absolute; top:-12vh; width:44vw; height:120vh; background:linear-gradient(180deg, rgba(160,210,255,.26), rgba(124,196,255,.05) 55%, transparent 80%); filter:blur(22px); clip-path:polygon(46% 0, 54% 0, 100% 100%, 0 100%); transform-origin:50% 0; opacity:.75 }
.beam.b1{ right:-14vw; transform:rotate(32deg) }
.beam.b2{ left:-14vw; transform:rotate(-32deg) }
.home-top{ position:absolute; top:16px; inset-inline-start:var(--gutter) }
.home-hero{ display:flex; flex-direction:column; align-items:center; gap:6px }
.home-emblem .seal-svg{ height:clamp(170px,32vh,320px); width:auto; max-width:100%; filter:drop-shadow(0 16px 46px rgba(124,196,255,.28)) drop-shadow(0 0 18px rgba(242,193,78,.18)); animation:float 7s ease-in-out infinite }
.home-hero .kicker{ margin-top:8px; font-size:clamp(1rem,1.6vw,1.35rem) }
.home-title{ font-family:var(--f-disp); font-weight:700; font-size:clamp(42px,6.2vw,84px); line-height:1.15; background:linear-gradient(180deg,#ffffff 20%,#c9d3e8 70%,#93a4cc); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 40px rgba(124,196,255,.12); padding:0 .1em }
.home-school{ font-family:var(--f-disp); font-weight:700; font-size:clamp(26px,3.1vw,42px); line-height:1.25; color:var(--gold); text-shadow:0 2px 24px rgba(242,193,78,.28); margin-top:-2px }
.home-sub{ font-size:clamp(.98rem,1.35vw,1.2rem); color:var(--silver); display:flex; flex-wrap:wrap; justify-content:center; gap:2px 8px }
.home-credit{ color:var(--muted) }
.sep{ color:var(--gold); opacity:.8 }
.home-actions{ display:flex; flex-direction:column; align-items:center; gap:14px }
.home-main, .home-sec{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center }
.home-main .btn-xl{ min-width:260px; min-height:66px; font-size:1.25rem }
.home-tert{ display:flex; gap:8px 22px; flex-wrap:wrap; justify-content:center }
.home-link{ display:inline-flex; align-items:center; gap:6px; font-size:.92rem; color:var(--muted); text-decoration:none; background:none; border:0; min-height:40px; padding:0 4px }
.home-link:hover{ color:var(--flood) }
.home-link .ic{ width:16px; height:16px }

/* ============ setup ============ */
.setup-note{ display:flex; gap:10px; align-items:flex-start; padding:10px 14px; margin:-6px 0 16px; border-radius:14px; background:rgba(124,196,255,.08); border:1px solid rgba(124,196,255,.3); color:var(--silver); line-height:1.65 }
.setup-note .ic{ color:var(--flood); margin-top:3px }
.setup-note b{ color:var(--white) }
.setup-grid{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:18px; align-items:start }
.setup-col{ display:flex; flex-direction:column; gap:18px; min-width:0 }
.class-rows{ display:flex; flex-direction:column; gap:12px }
.class-row{ position:relative; display:grid; grid-template-columns:auto minmax(92px,1fr) auto auto auto; gap:10px 12px; align-items:end; padding:12px 14px 12px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line); border-inline-start:4px solid var(--cc) }
.cr-crest svg{ width:44px; height:auto; display:block }
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:10px; background:rgba(6,13,36,.6); overflow:hidden; min-height:44px }
.st-b{ width:40px; height:44px; border:0; background:none; font-size:1.35rem; font-weight:700; color:var(--silver); line-height:1 }
.st-b:hover:not([disabled]){ background:rgba(255,255,255,.08); color:var(--white) }
.st-b[disabled]{ opacity:.3; cursor:not-allowed }
.st-v{ min-width:34px; text-align:center; font-family:var(--f-num); font-size:1.7rem; line-height:1; padding-top:4px; color:var(--gold) }
.roster{ grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:12px; border-top:1px dashed var(--line); padding-top:10px }
.ro-in{ display:flex; flex-direction:column; gap:6px; min-width:0 }
.ro-in > span{ font-size:.8rem; color:var(--muted) }
.ro-in textarea{ width:100%; min-height:190px; resize:vertical; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:rgba(6,13,36,.6); line-height:1.55 }
.ro-in textarea:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.25) }
.ro-map{ display:flex; flex-direction:column; gap:6px; min-width:0 }
.ro-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--muted) }
.ro-h .btn{ min-height:36px; padding:.25em .7em; font-size:.84rem }
.ro-tbl{ width:100%; border-collapse:collapse; font-size:.92rem }
.ro-tbl td{ padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:middle }
.ro-tbl tr:last-child td{ border-bottom:0 }
.ro-tbl td.n{ max-width:0; width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ro-tbl select{ width:100%; min-height:38px; padding:2px 6px; border-radius:8px; border:1px solid var(--line); background:#0b1a45; color:var(--white) }
.ro-tbl select.none{ color:var(--warn); border-color:rgba(255,181,71,.5) }
.ro-groups{ display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:4px }
.ro-g{ display:inline-flex; align-items:center; gap:6px; font-size:.8rem; color:var(--silver) }
.ro-g svg{ width:22px; height:auto }
.ro-g b{ font-family:var(--f-num); font-size:1.05rem; color:var(--white); line-height:1 }
.ro-empty{ color:var(--muted); font-size:.86rem; line-height:1.6 }
.groups-total{ margin-top:12px; font-size:1.02rem; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px }
.groups-total > b{ font-family:var(--f-num); font-size:1.8rem; color:var(--gold); line-height:1 }
.groups-total .gt-r{ font-family:var(--f-disp); font-size:1.15rem; color:var(--white) }
.gt-path{ flex-basis:100%; font-size:.84rem; color:var(--muted) }
.draw-modes{ display:flex; flex-direction:column; gap:6px }
.dm{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:start; padding:8px 12px; min-height:48px; border-radius:12px; border:1.5px solid var(--line); background:rgba(6,13,36,.5); transition:border-color .2s, background-color .2s }
.dm:hover:not([disabled]){ border-color:rgba(124,196,255,.45) }
.dm b{ font-size:.96rem } .dm small{ font-size:.8rem; color:var(--muted); line-height:1.5 }
.dm.on{ border-color:var(--flood); background:rgba(124,196,255,.13); box-shadow:0 0 0 3px rgba(124,196,255,.14) }
.dm.on b::before{ content:'✓ '; color:var(--flood) }
.dm[disabled]{ opacity:.4; cursor:not-allowed }
.mode-note{ display:flex; gap:8px; align-items:flex-start; line-height:1.65; margin:10px 0 0 }
.mode-note .ic{ width:16px; height:16px; margin-top:4px; color:var(--flood); flex:none }
.mode-note b{ color:var(--white) }
.budget{ display:flex; gap:8px; align-items:flex-start; margin-top:8px; font-size:.86rem; line-height:1.65; padding:8px 10px; border-radius:10px }
.budget .ic{ width:16px; height:16px; margin-top:4px; flex:none }
.budget.note{ color:var(--silver); background:rgba(124,196,255,.07); border:1px solid rgba(124,196,255,.22) } .budget.note .ic{ color:var(--flood) }
.budget.bad{ background:rgba(255,90,106,.1); color:#ffd3d8; border:1px solid rgba(255,90,106,.4) } .budget.bad .ic{ color:var(--bad) }
.budget.good{ color:var(--muted); padding-inline:0 } .budget.good .ic{ color:var(--good) }
.budget b{ color:var(--white) }
.fld{ display:flex; flex-direction:column; gap:4px; min-width:0 }
.fld > span{ font-size:.78rem; color:var(--muted) }
.fld input{ width:100%; min-height:44px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(6,13,36,.6); font-weight:600; font-size:1.05rem }
.fld input:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.25) }
.swatches{ display:grid; grid-template-columns:repeat(4,24px); gap:6px }
.sw{ width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:var(--c); padding:0; position:relative }
.sw.on{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.25) }
.sw::after{ content:''; position:absolute; inset:-10px } /* larger hit area */
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px }
.field:last-child{ margin-bottom:0 }
.field-l{ font-weight:600; font-size:.95rem }
.field-h{ color:var(--muted); font-size:.8rem }
.seg{ display:flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:14px; background:rgba(6,13,36,.6); border:1px solid var(--line); width:fit-content; max-width:100% }
.seg-b{ min-height:40px; padding:6px 14px; border-radius:10px; border:0; background:none; color:var(--silver); font-weight:500; font-size:.94rem }
.seg-b:hover{ color:var(--white); background:rgba(255,255,255,.06) }
.seg-b.on{ background:linear-gradient(180deg,#9ad6ff,#4fa7f1); color:#04112e; font-weight:600 }
.seg-b[disabled]{ opacity:.35; cursor:not-allowed }
.chk{ display:flex; align-items:center; gap:10px; min-height:40px; cursor:pointer; font-size:.95rem }
.chk input{ width:20px; height:20px; accent-color:#7cc4ff; flex:none }
.unit-checks{ display:flex; flex-direction:column; gap:8px }
.unit-chk{ padding:8px 12px; border-radius:var(--r-s); background:var(--glass-3); border:1px solid var(--line) }
.u-ic{ font-size:1.3rem; line-height:1 }
.u-name{ flex:1; display:flex; flex-direction:column; line-height:1.3 }
.u-en{ font-size:.8rem; color:var(--muted) }
.u-n{ color:var(--muted); font-size:.86rem; white-space:nowrap }
.words-total{ margin-top:12px; font-size:1rem }
.words-total > b{ font-family:var(--f-num); font-size:1.6rem; color:var(--gold); vertical-align:-3px }
.setup-foot{ position:sticky; bottom:12px; display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:20px; padding:12px 16px; border-radius:var(--r-l); background:rgba(8,18,50,.92); border:1px solid var(--line); box-shadow:0 -10px 40px rgba(6,13,36,.8); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); flex-wrap:wrap; z-index:5 }
.setup-err{ flex:1; color:var(--bad); font-weight:500; min-width:200px }
.setup-err:empty{ display:none }

/* ============ the draw: ceremony + board «من مع من» ============ */
.v-draw{ padding-top:14px; padding-bottom:24px; max-width:1500px }
.draw-top{ display:flex; align-items:center; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; margin-bottom:12px }
.draw-head{ text-align:start }
.draw-head h1{ font-size:clamp(28px,min(3.2vw,5.4vh),50px); line-height:1.2 }
.draw-head .muted{ font-size:clamp(.86rem,1.1vw,1.02rem) }
.draw-pots{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px 12px }
.pot{ display:flex; align-items:center; gap:8px; padding:4px 10px 4px 8px; border-radius:14px; background:var(--glass-3); border:1px solid var(--line); border-top:3px solid var(--cc) }
.pot > b{ font-family:var(--f-num); font-size:1.3rem; line-height:1; padding-top:3px; color:var(--white) }
.pot-ch{ display:flex; gap:3px }
.pc svg{ width:26px; height:auto; display:block; transition:opacity .35s, filter .35s }
.pc.out svg{ opacity:.2; filter:grayscale(1) }
.db{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px,1.3vh,14px) }
.db-row{ display:grid; grid-template-columns:minmax(0,1fr) clamp(96px,9vw,150px) minmax(0,1fr); align-items:center; gap:0 }
.db.single .db-row{ grid-template-columns:minmax(0,1fr) }
.db-mid{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; height:100%; font-size:clamp(.74rem,.95vw,.95rem); color:var(--gold); line-height:1.3 }
.db-mid::before{ content:''; position:absolute; top:50%; inset-inline:0; border-top:2px solid rgba(242,193,78,.4) }
.db-mid span{ position:relative; padding:3px 8px; border-radius:99px; background:#0b1a45; border:1px solid rgba(242,193,78,.55); font-weight:600; white-space:nowrap }
.db-mid small{ position:relative; color:var(--muted); font-size:.86em; background:#081333; padding:0 4px; border-radius:6px }
.tie{ position:relative; min-height:clamp(84px,12.6vh,150px); border-radius:var(--r); background:linear-gradient(180deg, rgba(22,46,112,.94), rgba(11,26,69,.94)); border:1px solid rgba(201,211,232,.22); box-shadow:0 10px 26px rgba(0,0,0,.32); display:grid; align-items:center }
.tie.same{ border-color:rgba(242,193,78,.42) }
.tie-no{ position:absolute; top:-10px; inset-inline-start:14px; min-width:26px; height:22px; padding:1px 7px 0; display:grid; place-items:center; border-radius:99px; background:#0b1a45; border:1px solid rgba(242,193,78,.55); color:var(--gold); font-family:var(--f-num); font-size:1.05rem; line-height:1; z-index:2 }
.tie-tag{ position:absolute; top:-10px; inset-inline-end:14px; font-size:.68rem; font-weight:600; padding:0 8px; border-radius:99px; background:#0b1a45; border:1px solid rgba(242,193,78,.5); color:var(--gold); white-space:nowrap; line-height:1.6; z-index:2 }
.tie-in{ grid-area:1 / 1; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; padding:clamp(8px,1.3vh,16px) clamp(10px,1.1vw,18px) }
.tie-vs{ font-family:var(--f-num); font-size:clamp(1.2rem,1.6vw,1.8rem); color:var(--gold); letter-spacing:.06em; line-height:1 }
.ts{ display:flex; align-items:center; gap:clamp(8px,.8vw,14px); min-width:0 }
.ts.b{ flex-direction:row-reverse; text-align:end }
.ts svg{ width:clamp(36px,min(3.4vw,6vh),60px); height:auto; flex:none }
.ts-t{ display:flex; flex-direction:column; gap:2px; min-width:0 }
.ts.b .ts-t{ align-items:flex-end }
.tl{ font-weight:700; font-size:clamp(15px,min(1.3vw,2.4vh),24px); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.tl-c{ color:var(--cc) }
.mem{ display:flex; flex-wrap:wrap; gap:0 10px; font-size:clamp(12px,min(.95vw,1.75vh),17px); color:var(--silver); line-height:1.45; min-width:0 }
.mem bdi{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.ts.b .mem{ justify-content:flex-end }
.mem.col{ flex-direction:column; flex-wrap:nowrap }
.ts.b .mem.col{ align-items:flex-end }
.mem.none{ color:var(--muted) }
.tie-cap{ grid-area:1 / 1; display:grid; place-items:center; pointer-events:none; transition:opacity .35s }
.tie-cap i{ grid-area:1 / 1; width:44px; height:21px; transition:transform .45s var(--ease), opacity .4s }
.tie-cap i:first-child{ border-radius:44px 44px 4px 4px; background:linear-gradient(180deg,#ffffff,#b9c4de); transform:translateY(-11px); box-shadow:inset 0 -2px 0 rgba(11,26,69,.25) }
.tie-cap i:last-child{ border-radius:4px 4px 44px 44px; background:linear-gradient(180deg,#f2c14e,#b8860b); transform:translateY(11px) }
.tie:not(.on) .tie-in{ opacity:0 }
.tie:not(.on){ border-style:dashed; background:rgba(11,26,69,.55); box-shadow:none }
.tie.on .tie-cap{ opacity:0 }
.tie.on .tie-cap i:first-child{ transform:translateY(-34px) rotate(-18deg) }
.tie.on .tie-cap i:last-child{ transform:translateY(34px) rotate(18deg) }
.tie.on .tie-in{ animation:tieIn .5s var(--ease) both }
.tie.bye .tie-in{ grid-template-columns:minmax(0,1fr) auto }
.tie-bye{ display:flex; flex-direction:column; align-items:flex-end; font-weight:600; color:var(--gold); font-size:.95rem; line-height:1.25; text-align:end }
.tie-bye small{ color:var(--muted); font-weight:400; font-size:.76rem }
.db-path{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 10px; margin-top:clamp(10px,1.6vh,18px); font-size:clamp(.82rem,1vw,1rem); color:var(--silver) }
.db-path .ic{ width:16px; height:16px; color:var(--gold) }
.db-path b{ color:var(--white); font-weight:600 }
.db-path i{ font-style:normal; color:var(--gold) }
.draw-note{ display:flex; align-items:center; justify-content:center; gap:8px; margin:8px auto 0; max-width:980px; font-size:.9rem; color:var(--muted); line-height:1.6; text-align:center }
.draw-note .ic{ width:16px; height:16px; flex:none; color:var(--flood) }
.draw-note.good .ic{ color:var(--good) } .draw-note.warn{ color:#ffe2b8 } .draw-note.warn .ic{ color:var(--warn) }
.draw-foot{ margin-top:clamp(10px,1.8vh,20px); display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px }

/* ============ hub ============ */
.champ-banner{ display:flex; align-items:center; gap:14px; padding:12px 18px; margin-bottom:16px; border-radius:var(--r-l); background:radial-gradient(120% 180% at 100% 0%, rgba(242,193,78,.26), rgba(19,41,106,.85) 55%, rgba(11,26,69,.9)); border:1px solid rgba(242,193,78,.55); box-shadow:0 10px 40px rgba(242,193,78,.12); flex-wrap:wrap }
.champ-banner > .ic{ color:var(--gold) }
.champ-banner svg.crest{ width:44px; height:auto }
.champ-banner div{ flex:1; display:flex; flex-direction:column }
.champ-banner small{ color:var(--gold); font-weight:500 }
.champ-banner b{ font-size:1.35rem }
.hub-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px }
.tabs{ display:flex; gap:4px; padding:4px; border-radius:16px; background:rgba(6,13,36,.65); border:1px solid var(--line); overflow-x:auto; max-width:100%; scrollbar-width:none }
.tab{ position:relative; display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:8px 16px; border-radius:12px; border:0; background:none; color:var(--silver); font-weight:500; white-space:nowrap }
.tab:hover{ color:var(--white); background:rgba(255,255,255,.06) }
.tab.on{ background:var(--navy-2); color:var(--white); box-shadow:inset 0 -2px 0 var(--flood) }
.tab .ic{ width:18px; height:18px }
.hub-meta{ display:flex; gap:14px; color:var(--muted); font-size:.88rem; flex-wrap:wrap }
.hub-meta span{ display:inline-flex; align-items:center; gap:6px }
.hub-meta .ic{ width:16px; height:16px }
.hub-meta .hm-done{ color:var(--white); font-weight:500 }
.fixtures{ display:flex; flex-direction:column; gap:22px }
.grp-h{ display:flex; align-items:baseline; gap:10px; font-size:1.08rem; margin-bottom:10px; flex-wrap:wrap }
.grp-h small{ font-family:var(--f-num); letter-spacing:.16em; color:var(--flood); font-size:.92rem }
.grp-n{ font-style:normal; margin-inline-start:auto; font-size:.84rem; color:var(--muted); font-weight:400 }
.fx-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr)); gap:10px 14px }
.fx{ display:grid; grid-template-columns:minmax(0,1fr) minmax(118px,auto) minmax(0,1fr) auto; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line); transition:border-color .2s }
.fx:hover{ border-color:rgba(124,196,255,.35) }
.fx.st-live, .fx.st-wait, .fx.st-tie{ border-color:rgba(242,193,78,.45); box-shadow:0 0 0 1px rgba(242,193,78,.15) inset }
.fx.st-tbd{ border-style:dashed; background:rgba(11,26,69,.5) }
.fx-t{ display:flex; align-items:center; gap:10px; min-width:0 }
.fx-t.a{ justify-content:flex-end }
.fx-t.b{ justify-content:flex-start }
.fx-t svg{ width:40px; height:auto; flex:none }
.fx-t.lose{ opacity:.5 }
.fx-mid{ display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center }
.fx-vs{ font-family:var(--f-num); font-size:1.6rem; color:var(--muted); line-height:1 }
.fx-stage{ font-size:.78rem; color:var(--gold) }
.fx-reps{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:.72rem; color:var(--silver) }
.fx-reps span{ display:inline-flex; align-items:center; gap:4px; padding:0 7px; border-radius:99px; background:rgba(242,193,78,.1); border:1px solid rgba(242,193,78,.3) }
.fx-reps .sp{ font-size:1rem }
.sp{ display:inline-flex; align-items:center; gap:.3em; font-family:var(--f-num); font-variant-numeric:tabular-nums; line-height:1 }
.sp-d{ opacity:.6 }
.fx-sc{ font-size:2rem; font-weight:600 }
.fx-mode{ display:inline-flex; align-items:center; gap:4px; font-size:.72rem; color:var(--muted); white-space:nowrap }
.fx-mode .ic{ width:13px; height:13px }
.fx-lock{ display:inline-grid; place-items:center; width:40px; height:40px; color:rgba(201,211,232,.3) }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:.76rem; font-weight:600; white-space:nowrap; border:1px solid transparent }
.p-up{ background:rgba(201,211,232,.1); color:var(--silver) }
.p-live{ background:rgba(47,208,122,.14); color:var(--good); border-color:rgba(47,208,122,.35) }
.p-live::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite }
.p-wait{ background:rgba(255,181,71,.14); color:var(--warn); border-color:rgba(255,181,71,.35) }
.p-tie{ background:rgba(242,193,78,.14); color:var(--gold); border-color:rgba(242,193,78,.4) }
.p-done{ background:rgba(124,196,255,.1); color:var(--flood) }
.p-tbd{ background:rgba(201,211,232,.06); color:var(--muted); white-space:normal; text-align:center; max-width:200px; line-height:1.4; border-color:rgba(201,211,232,.18) }
.tip{ display:flex; align-items:center; gap:8px; margin-top:18px }
.tip .ic{ width:16px; height:16px }
.tbl-wrap{ overflow-x:auto; border-radius:var(--r-l); border:1px solid var(--line); background:var(--glass); -webkit-overflow-scrolling:touch }
.tm-in{ display:flex; align-items:center; gap:10px }
.tm-in svg{ width:30px; height:auto }
.fp{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-family:var(--f-ui); font-size:.78rem; font-weight:700; line-height:1 }
.fW{ background:var(--good); color:#032012 } .fp .ic{ width:14px; height:14px; stroke-width:3 }
.legend{ display:flex; gap:10px 24px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:.85rem }
.legend span{ display:inline-flex; align-items:center; gap:8px }
.locked{ text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:8px }
.locked > .ic{ color:var(--flood); margin-bottom:6px }
.locked h3{ font-size:1.3rem }
.hl-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:16px }
.hl{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--r); background:var(--glass); border:1px solid var(--line) }
.hl-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.06); color:var(--cc); flex:none }
.hl small{ display:block; color:var(--muted); font-size:.8rem }
.hl b{ font-size:1.1rem; margin-inline-end:6px }
.hl-v{ font-family:var(--f-num); font-size:1.4rem; color:var(--cc); line-height:1; padding-top:3px; white-space:nowrap }
.hl-b{ min-width:0; flex:1 }
.hl-n{ display:flex; align-items:center; justify-content:space-between; gap:8px }
.hl-n .tn-g{ font-size:1.02rem }
.stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:14px }
.sc{ position:relative; padding:16px; border-radius:var(--r-l); background:var(--glass); border:1px solid var(--line) }
.sc::before, .ht-cat::before, .hts::before{ content:''; position:absolute; top:-1px; inset-inline:16px; height:3px; border-radius:0 0 4px 4px; background:var(--cc, var(--tc)) }
.sc::before{ background:var(--tc) }
.sc header{ display:flex; align-items:center; gap:10px; margin-bottom:12px }
.sc header svg{ width:36px; height:auto }
.sc header > b{ flex:1; font-size:1.2rem }
.sc-g{ display:flex; flex-direction:column; align-items:center; line-height:1 }
.sc-g b{ font-family:var(--f-num); font-size:1.8rem; font-weight:600 }
.sc-g small{ color:var(--muted); font-size:.75rem }
.bar-row{ display:grid; grid-template-columns:110px 1fr 46px 40px; align-items:center; gap:10px; min-height:34px }
.br-l{ display:flex; align-items:center; gap:6px; font-size:.9rem }
.br-l .ic{ width:16px; height:16px }
.bar-row b{ font-family:var(--f-num); font-size:1.25rem; text-align:center }
.bar-row small{ color:var(--muted); font-size:.78rem }

/* ============ intro ============ */
.v-intro{ padding-top:14px; display:flex; flex-direction:column; gap:14px }
.intro-top{ display:flex; justify-content:space-between; align-items:center; gap:10px }
.intro-brand{ display:inline-flex; align-items:center; gap:8px; font-family:var(--f-disp); font-weight:600; color:var(--gold); font-size:1rem }
.intro-brand .seal-mini{ width:36px; height:36px; object-fit:contain }
.intro-head{ text-align:center }
.intro-head h1{ font-size:clamp(26px,3.2vw,42px) }
.intro-head .muted{ margin-top:2px }
.faceoff{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:18px }
.fo{ display:flex; align-items:center; gap:16px; min-width:0 }
.fo.b{ flex-direction:row-reverse }
.fo svg{ width:clamp(64px,10vh,104px); height:auto; flex:none; filter:drop-shadow(0 12px 30px color-mix(in srgb, var(--tc) 45%, transparent)); animation:fadeIn .6s ease both }
.fo-t{ display:flex; flex-direction:column; gap:4px; min-width:0 }
.fo.b .fo-t{ align-items:flex-end; text-align:end }
.side-lbl{ display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:1px 10px; border-radius:99px; background:color-mix(in srgb, var(--tc) 26%, transparent); border:1px solid color-mix(in srgb, var(--tc) 60%, transparent); color:var(--white); font-weight:700; font-size:.86rem; letter-spacing:.01em }
.fo .tl{ font-family:var(--f-disp); font-size:clamp(22px,2.6vw,38px); line-height:1.2 }
.fo .mem{ font-size:clamp(13px,1.1vw,16px) }
.fo.b .mem{ justify-content:flex-end }
.fo-vs span{ display:grid; place-items:center; width:64px; height:64px; border-radius:50%; font-family:var(--f-num); font-size:1.9rem; color:#241500; background:linear-gradient(180deg,#ffe08a,#e2a82c); box-shadow:0 0 0 6px rgba(242,193,78,.15), 0 10px 30px rgba(242,193,78,.3); padding-top:4px }
.intro-grid{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; align-items:stretch }
.intro-grid.no-toss{ grid-template-columns:minmax(0,1fr) }
.intro-grid .panel{ padding:16px 18px; display:flex; flex-direction:column; gap:10px }
.intro-grid h3{ display:flex; align-items:center; gap:8px; font-size:1.02rem; font-weight:600; flex-wrap:wrap }
.intro-grid h3 .ic{ color:var(--flood); width:18px; height:18px }
.present{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.92rem }
.chip-btn{ min-height:40px; padding:4px 14px; border-radius:99px; border:2px solid var(--line); background:rgba(6,13,36,.6); font-weight:600 }
.chip-btn.on{ border-color:var(--tc); background:color-mix(in srgb, var(--tc) 22%, transparent) }
.sug{ font-style:normal; font-size:.68rem; font-weight:600; padding:0 7px; margin-inline-start:6px; border-radius:99px; background:rgba(242,193,78,.2); color:var(--gold); vertical-align:1px }
.seg-b.on .sug{ background:rgba(4,17,46,.22); color:#04112e }
.mode-why{ color:var(--silver); line-height:1.65 } .mode-why b{ color:var(--white) }
.intro-facts{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 18px; color:var(--silver); font-size:.95rem }
.intro-facts span{ display:inline-flex; align-items:center; gap:6px }
.intro-facts .ic{ width:17px; height:17px; color:var(--gold) }
.intro-facts b{ color:var(--white) }
.rep-note{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:10px 18px; border-radius:16px; background:radial-gradient(120% 160% at 50% 0%, rgba(242,193,78,.2), rgba(19,41,106,.9) 60%); border:1px solid rgba(242,193,78,.6); color:var(--silver); text-align:center; line-height:1.6 }
.rep-note .ic{ color:var(--gold) } .rep-note b{ color:var(--white) }
.ip-toss{ align-items:center; text-align:center }
.coin-stage{ position:relative; width:112px; height:124px; perspective:600px; margin:2px auto 0 }
.coin{ position:relative; width:104px; height:104px; margin:0 auto; transform-style:preserve-3d }
.coin.flipping{ transition:transform 1.8s cubic-bezier(.15,.7,.2,1); animation:coinUp 1.8s cubic-bezier(.3,.7,.3,1) }
.coin-face{ position:absolute; inset:0; border-radius:50%; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:radial-gradient(circle at 34% 28%, #ffffff, #d7deee 45%, #8a95b3 100%); border:4px solid #eef2fb; box-shadow:inset 0 0 0 5px rgba(11,26,69,.12), 0 8px 20px rgba(0,0,0,.4) }
.coin-face svg{ width:52px; height:auto }
.coin-face.fb{ transform:rotateY(180deg) }
.coin-shadow{ width:70px; height:10px; margin:6px auto 0; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(4px) }
.toss-res{ min-height:1.6em; font-size:.98rem }
.intro-foot{ display:flex; justify-content:center; padding-bottom:8px }
.split-resume{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px }
.split-resume h2{ font-family:var(--f-disp); font-size:1.6rem }
.split-resume p .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }

/* ============ match (broadcast) — every box has a FIXED size: nothing grows, shrinks or moves between turns ============ */
html.in-match{ scrollbar-gutter:auto }
html.in-match, html.in-match body{ overflow:hidden; height:100% }
.v-match{ position:relative; isolation:isolate; height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden;
  --sbh:clamp(70px,11vh,124px); --subh:clamp(26px,4vh,42px); --toolh:62px; --qph:clamp(54px,8.6vh,96px) }
.pitch{ position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(6,13,36,.35) 0%, rgba(6,13,36,.78) 58%, rgba(6,13,36,.96) 100%),
    radial-gradient(circle at 50% 55%, transparent 0 16vh, rgba(255,255,255,.07) calc(16vh + 1px) calc(16vh + 3px), transparent calc(16vh + 4px)),
    linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,.07) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    repeating-linear-gradient(90deg, var(--pitch-a) 0 8.333%, var(--pitch-b) 8.333% 16.666%);
}
/* a soft glow on the screen edge of the team whose turn it is (colour only) */
.turn-glow{ position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:0; transition:opacity .45s, background .45s }
.v-match[data-turn="a"] .turn-glow{ opacity:1; background:linear-gradient(270deg, color-mix(in srgb, var(--ta) 30%, transparent), transparent 38%) }
.v-match[data-turn="b"] .turn-glow{ opacity:1; background:linear-gradient(90deg, color-mix(in srgb, var(--tb) 30%, transparent), transparent 38%) }
.sb-wrap{ padding:10px var(--gutter) 0; display:flex; flex-direction:column; align-items:center; gap:6px }
.sb{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); width:min(1180px,100%); height:var(--sbh); border-radius:14px; overflow:hidden; background:linear-gradient(180deg,#1a3480,#0b1a45 70%); border:1px solid rgba(201,211,232,.26); box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15) }
.sb-side{ position:relative; display:flex; align-items:center; gap:clamp(8px,1vw,14px); padding:0 16px; min-width:0; height:100%; transition:background-color .35s, opacity .35s, filter .35s }
.sb-side::before{ content:''; position:absolute; top:0; bottom:0; width:7px; background:var(--tc) }
.sb-side.a::before{ inset-inline-start:0 }
.sb-side.b::before{ inset-inline-end:0 }
.sb-side.a{ padding-inline-start:20px }
.sb-side.b{ padding-inline-end:20px }
.sb-side.on{ background:linear-gradient(0deg, color-mix(in srgb, var(--tc) 52%, #0b1a45), color-mix(in srgb, var(--tc) 26%, #13296a)); box-shadow:inset 0 0 0 2px var(--tc) }
.sb-side.on::after{ content:''; position:absolute; inset-inline:0; bottom:0; height:4px; background:var(--tc); box-shadow:0 0 18px var(--tc) }
.sb-side.off{ opacity:.45; filter:saturate(.3) }
.sb-crest svg{ width:clamp(34px,min(3.1vw,5.6vh),64px); height:auto; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)) }
.sb-id{ display:flex; flex-direction:column; justify-content:center; gap:1px; min-width:0; flex:1 }
.sb-side.b .sb-id{ align-items:flex-end; text-align:end }
.sb-top{ display:flex; align-items:center; gap:8px; min-width:0; height:clamp(18px,2.8vh,30px) }
.sb-side.b .sb-top{ flex-direction:row-reverse }
.sb-lbl{ font-weight:700; font-size:clamp(12px,min(1.1vw,2.1vh),19px); letter-spacing:.02em; color:var(--silver); white-space:nowrap }
.sb-side.on .sb-lbl{ color:var(--white) }
.sb-now{ visibility:hidden; display:inline-flex; align-items:center; gap:4px; padding:0 9px; border-radius:99px; background:var(--white); color:#0b1a45; font-weight:700; font-size:clamp(11px,min(1vw,1.9vh),17px); line-height:1.55; white-space:nowrap; box-shadow:0 0 16px color-mix(in srgb, var(--tc) 80%, transparent) }
.sb-now i{ font-style:normal; color:var(--tc); font-size:.9em }
.sb-side.on .sb-now{ visibility:visible; animation:nowPulse 1.6s ease-in-out infinite }
.sb-name{ font-weight:700; font-size:clamp(16px,min(1.8vw,3.3vh),36px); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:100% }
.sb-name .tl-c{ color:var(--cc) }
.sb-score{ font-family:var(--f-num); font-weight:600; font-size:clamp(38px,min(4.2vw,7.6vh),88px); line-height:1; min-width:1.35em; text-align:center; padding:.1em .22em 0; border-radius:10px; background:rgba(6,13,36,.55); font-variant-numeric:tabular-nums; flex:none; transition:color .3s, box-shadow .3s }
.sb-score.hit{ color:var(--gold); box-shadow:0 0 0 2px rgba(242,193,78,.7), 0 0 26px rgba(242,193,78,.55) }
.sb-clock{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 18px; background:#050b1f; width:clamp(104px,10vw,170px); border-inline:1px solid rgba(201,211,232,.2) }
.sb-min{ font-family:var(--f-num); font-weight:500; font-size:clamp(28px,min(3vw,5.4vh),62px); line-height:1; color:var(--gold); padding-top:4px; font-variant-numeric:tabular-nums }
.sb-stage{ font-size:clamp(11px,min(1vw,1.8vh),16px); color:var(--silver); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis }
.sb-sub{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); width:min(1180px,100%); height:var(--subh); align-items:center; gap:10px }
.dots{ display:flex; gap:6px; flex-wrap:nowrap; overflow:hidden; min-width:0 }
.dots.b{ justify-content:flex-end }
.dot{ width:clamp(14px,min(1.1vw,2vh),22px); height:clamp(14px,min(1.1vw,2vh),22px); border-radius:50%; border:2px solid rgba(201,211,232,.45); background:rgba(6,13,36,.5); position:relative; flex:none }
.dot.g{ background:var(--good); border-color:var(--good); box-shadow:0 0 8px rgba(47,208,122,.6) }
.dot.x{ border-color:var(--bad); background:rgba(255,90,106,.15) }
.dot.x::before, .dot.x::after{ content:''; position:absolute; left:50%; top:50%; width:9px; height:2px; background:var(--bad); border-radius:2px }
.dot.x::before{ transform:translate(-50%,-50%) rotate(45deg) } .dot.x::after{ transform:translate(-50%,-50%) rotate(-45deg) }
.dot.h{ background:rgba(201,211,232,.45); border-color:rgba(201,211,232,.45) }
.dot.cur{ border-color:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent); animation:pulse 1.2s infinite }
.turn{ width:clamp(260px,36vw,600px); height:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; border-radius:99px; background:color-mix(in srgb, var(--tc) 80%, #0b1a45); color:#fff; white-space:nowrap; overflow:hidden; font-size:clamp(14px,min(1.4vw,2.5vh),24px); font-weight:600; box-shadow:0 0 18px color-mix(in srgb, var(--tc) 45%, transparent); text-shadow:0 1px 3px rgba(0,0,0,.45) }
.turn.none{ background:rgba(6,13,36,.8); color:var(--silver); box-shadow:none; border:1px solid var(--line) }
.turn > span{ overflow:hidden; text-overflow:ellipsis }
.turn b{ font-weight:800 }
.qzone{ min-height:0; display:flex; justify-content:center; align-items:stretch; padding:10px var(--gutter); overflow:hidden; transition:filter .3s }
.v-match.is-paused .qzone{ filter:blur(18px) saturate(.6); pointer-events:none }
.qp{ position:relative; width:min(1180px,100%); height:100%; display:grid; grid-template-rows:var(--qph) minmax(0,1fr); gap:clamp(8px,1.4vh,16px); padding:clamp(10px,1.8vh,22px) clamp(14px,2.2vw,30px); background:var(--glass); border:1px solid color-mix(in srgb, var(--tc) 45%, rgba(201,211,232,.2)); border-top:6px solid var(--tc); border-radius:var(--r-l); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:var(--shadow), 0 -8px 34px -12px var(--tc); overflow:hidden; animation:fadeIn .3s ease both }
.qp-h{ display:flex; align-items:center; gap:12px; min-width:0; height:var(--qph) }
.qp-who{ display:inline-flex; align-items:center; gap:8px; flex:none; max-width:36%; padding:4px 14px 4px 6px; border-radius:99px; background:color-mix(in srgb, var(--tc) 24%, rgba(6,13,36,.7)); border:1.5px solid var(--tc); white-space:nowrap; overflow:hidden; font-size:clamp(14px,min(1.3vw,2.4vh),24px) }
.qp-who svg{ width:clamp(24px,min(2.2vw,4vh),40px); height:auto; flex:none }
.qp-who span{ color:var(--silver); font-weight:500 }
.qp-who b{ overflow:hidden; text-overflow:ellipsis; font-weight:700 }
.cat-chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; background:color-mix(in srgb, var(--cc) 14%, transparent); color:var(--cc); font-weight:600; font-size:clamp(12px,min(.95vw,1.7vh),17px); border:1px solid color-mix(in srgb, var(--cc) 40%, transparent); white-space:nowrap; flex:none }
.cat-chip .ic{ width:15px; height:15px }
.qp-t{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(18px,min(1.9vw,3.5vh),38px); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.qp-n{ color:var(--silver); font-size:clamp(13px,min(1.1vw,2vh),19px); white-space:nowrap; flex:none }
.ring{ position:relative; width:clamp(50px,min(5vw,8.4vh),94px); aspect-ratio:1; flex:none }
.ring svg{ width:100%; height:100% }
.ring-bg{ fill:rgba(6,13,36,.65); stroke:rgba(201,211,232,.16); stroke-width:6 }
.ring-fg{ fill:none; stroke:var(--flood); stroke-width:6; stroke-linecap:round; transition:stroke .3s }
.ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-num); font-weight:500; font-size:clamp(22px,min(2.2vw,4vh),44px); padding-top:.12em; font-variant-numeric:tabular-nums }
.ring.low .ring-fg{ stroke:var(--bad) }
.ring.low b{ color:var(--bad); animation:pulse 1s infinite }
.ring.off b{ font-size:1.6rem; color:var(--muted); padding-top:0 }
.qp-body{ min-height:0; display:flex; flex-direction:column; justify-content:center; gap:clamp(10px,2vh,24px); overflow:hidden }
.prompt{ display:flex; align-items:center; justify-content:center; gap:16px; min-height:clamp(78px,15vh,170px); text-align:center; flex-wrap:wrap }
.prompt.sm{ min-height:clamp(56px,9vh,110px) }
.word{ font-weight:700; font-size:clamp(38px,min(6.5vw,10.5vh),150px); line-height:1.1; letter-spacing:.005em; text-shadow:0 6px 30px rgba(124,196,255,.18) }
.word.ar{ font-weight:600; font-size:clamp(32px,min(4.6vw,8vh),100px); line-height:1.3 }
.prompt.sm .word.ar{ font-size:clamp(28px,min(3.8vw,6.6vh),80px) }
.say{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(124,196,255,.45); background:rgba(124,196,255,.12); color:var(--flood); flex:none; transition:background-color .2s }
.say:hover{ background:rgba(124,196,255,.26) }
.say .ic{ width:26px; height:26px }
.say.sm{ width:40px; height:40px }
.say.sm .ic{ width:20px; height:20px }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.4vw,16px) }
.opt{ position:relative; display:flex; align-items:center; gap:14px; min-height:clamp(56px,9vh,112px); padding:8px 16px; border-radius:16px; border:1.5px solid rgba(201,211,232,.22); background:linear-gradient(180deg, rgba(26,52,128,.7), rgba(15,33,86,.7)); font-size:clamp(18px,min(2.2vw,3.8vh),44px); font-weight:600; text-align:center; line-height:1.25; transition:border-color .2s, background .2s, opacity .3s, box-shadow .2s }
.opt:hover:not([disabled]){ border-color:var(--flood); box-shadow:0 0 0 2px rgba(124,196,255,.35) }
.opt .k{ flex:none; display:grid; place-items:center; width:1.55em; height:1.55em; border-radius:10px; background:rgba(6,13,36,.6); font-family:var(--f-num); font-size:.82em; color:var(--silver); padding-top:.12em; font-weight:500 }
.opt .t{ flex:1; min-width:0; overflow-wrap:break-word; word-break:normal; hyphens:none; padding-inline-end:1.55em }
.spell-opts .t, .letter-opts .t{ letter-spacing:.04em }
.letter-opts .t{ font-family:var(--f-ui); font-weight:700 }
.opt[disabled]{ cursor:default }
.opts.done .opt:not(.is-correct):not(.is-wrong){ opacity:.4 }
.opt.is-correct{ border-color:var(--good); background:linear-gradient(180deg, rgba(47,208,122,.35), rgba(47,208,122,.16)); box-shadow:0 0 0 3px rgba(47,208,122,.28), 0 0 30px rgba(47,208,122,.25) }
.opt.is-correct .k{ background:var(--good); color:#032012 }
.opt.is-wrong{ border-color:var(--bad); background:linear-gradient(180deg, rgba(255,90,106,.3), rgba(255,90,106,.12)) }
.opt.is-wrong .k{ background:var(--bad); color:#2a0006 }
/* spell_build */
.slots, .tiles{ display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(6px,.7vw,10px) }
.slots{ column-gap:clamp(18px,2.2vw,36px); border-radius:14px; transition:box-shadow .2s }
.sbw, .lbw{ display:inline-flex; gap:clamp(5px,.6vw,9px) }
.slots.long .slot, .tiles.long .tile{ width:clamp(32px,min(3.3vw,5.8vh),68px); height:clamp(42px,min(4.3vw,7.6vh),88px); font-size:clamp(20px,min(2.3vw,4.2vh),46px) }
.letters.long .lb{ width:clamp(32px,min(3.5vw,6.2vh),72px); height:clamp(42px,min(4.6vw,8.2vh),92px); font-size:clamp(22px,min(2.7vw,4.8vh),56px) }
.slot{ width:clamp(40px,min(4.2vw,7.4vh),84px); height:clamp(50px,min(5.4vw,9.4vh),104px); border-radius:12px; border:2px dashed rgba(201,211,232,.4); background:rgba(6,13,36,.55); display:grid; place-items:center; font-size:clamp(24px,min(2.8vw,5vh),56px); font-weight:700; padding:0; transition:border-color .2s, background-color .2s }
.slot.fill{ border-style:solid; border-color:var(--flood); background:rgba(124,196,255,.14) }
.slot.fixed{ border:0; background:none; width:clamp(14px,min(1.6vw,2.8vh),32px); color:var(--silver) }
.slot.ok{ border-color:var(--good); background:rgba(47,208,122,.22); border-style:solid }
.slot.bad{ border-color:var(--bad); background:rgba(255,90,106,.2); border-style:solid }
.slots.nope{ box-shadow:0 0 0 3px rgba(255,90,106,.55) }
.tile{ width:clamp(40px,min(4.2vw,7.4vh),84px); height:clamp(50px,min(5.4vw,9.4vh),104px); border-radius:12px; border:0; background:linear-gradient(180deg,#ffffff,#cdd6ea); color:#0b1a45; box-shadow:0 5px 0 #7c88ad, 0 10px 18px rgba(0,0,0,.35); font-size:clamp(24px,min(2.8vw,5vh),56px); font-weight:700; padding:0; transition:opacity .2s, filter .12s, box-shadow .12s }
.tile:hover:not([disabled]){ filter:brightness(1.06) }
.tile:active:not([disabled]){ filter:brightness(.92) }
.tile.used{ opacity:.14; box-shadow:none }
.sbc{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
.sb-foot{ text-align:center; color:var(--muted); font-size:clamp(13px,min(1.05vw,1.9vh),18px); line-height:1.5; min-height:1.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.sb-foot.ans{ color:var(--white); font-size:clamp(16px,min(1.4vw,2.6vh),24px) }
.sb-foot .b, .res-ans .b{ font-weight:700; color:var(--good) }
/* gap_sentence */
.sentence{ font-size:clamp(22px,min(3vw,5.4vh),62px); line-height:1.5; font-weight:500; text-align:center; padding:clamp(4px,1.6vh,22px) 0 }
.blank{ display:inline-block; margin:0 .2em; border-bottom:4px solid var(--flood); color:var(--flood); text-align:center; line-height:1.15; animation:blink 1.4s ease-in-out infinite; white-space:nowrap; vertical-align:baseline }
.blank.ok{ color:var(--good); border-color:var(--good); animation:none }
.blank.fix{ color:var(--gold); border-color:var(--gold); animation:none }
/* gap_letters */
.letters{ display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(8px,1.2vh,12px) clamp(18px,2.2vw,36px); padding-top:clamp(4px,1.2vh,16px) }
.lb{ width:clamp(42px,min(4.8vw,8.4vh),96px); height:clamp(54px,min(6.2vw,10.8vh),120px); display:grid; place-items:center; font-size:clamp(28px,min(3.6vw,6.3vh),72px); font-weight:700; border-radius:12px; background:rgba(245,247,255,.08); border:1px solid rgba(201,211,232,.2) }
.lb.miss{ border:2.5px dashed var(--gold); color:var(--gold); background:rgba(242,193,78,.1) }
.lb.miss.ok{ border-style:solid; border-color:var(--good); color:var(--good); background:rgba(47,208,122,.18) }
.lb.miss.fix{ border-style:solid }
.lb.gap{ background:none; border:0; width:clamp(12px,min(1.4vw,2.5vh),30px) }
.hint{ text-align:center; color:var(--silver); font-size:clamp(16px,min(1.6vw,2.9vh),30px) }
.hint b{ color:var(--white); font-weight:600 }
/* match5 */
.m5{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(48px,20%) minmax(0,1fr); }
.m5-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0 }
.m5-col{ display:flex; flex-direction:column; gap:clamp(7px,1.2vh,12px); position:relative; z-index:1 }
.m5-col.en{ grid-column:1 } .m5-col.ar{ grid-column:3 }
.m5-i{ min-height:clamp(44px,6.6vh,84px); border-radius:14px; border:2px solid rgba(201,211,232,.24); background:linear-gradient(180deg, rgba(26,52,128,.75), rgba(15,33,86,.75)); font-size:clamp(16px,min(1.9vw,3.3vh),36px); font-weight:600; padding:4px 12px; touch-action:none; user-select:none; -webkit-user-select:none; transition:border-color .2s, background-color .2s, box-shadow .2s; line-height:1.2 }
.m5-i:hover:not([disabled]){ border-color:rgba(245,247,255,.6) }
.m5-i.sel{ border-color:var(--white); box-shadow:0 0 0 4px rgba(245,247,255,.3) }
.m5-i.lnk{ border-color:var(--lc); background:linear-gradient(180deg, color-mix(in srgb, var(--lc) 26%, #13296a), color-mix(in srgb, var(--lc) 12%, #0b1a45)) }
.m5-i.ok{ border-color:var(--good); background:rgba(47,208,122,.2) }
.m5-i.bad{ border-color:var(--bad); background:rgba(255,90,106,.16) }
.ln{ fill:none; stroke:var(--lc, var(--flood)); stroke-width:4; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(0,0,0,.5)) }
.lnd{ fill:var(--lc, var(--flood)) }
.ln.tmp{ stroke:var(--white); stroke-dasharray:8 7; opacity:.8 }
.ln.ok{ stroke:var(--good) } .lnd.ok{ fill:var(--good) }
.ln.bad{ stroke:var(--bad); stroke-dasharray:10 8 } .lnd.bad{ fill:var(--bad) }
.ln.miss{ stroke:var(--good); stroke-dasharray:2 8; stroke-width:4.5 } .lnd.miss{ fill:var(--good) }
.m5-foot{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:nowrap }
.m5-count{ font-family:var(--f-num); font-size:clamp(1.6rem,min(2.4vw,4.2vh),2.6rem); line-height:1; color:var(--gold); min-width:3em; text-align:center; padding-top:4px }
.qp.answered .m5-foot .muted{ visibility:hidden }
/* content that would not fit shrinks INSIDE the panel (the panel itself never changes) */
.qp.fit1 .word{ font-size:clamp(32px,min(5.4vw,8.6vh),120px) } .qp.fit1 .word.ar, .qp.fit1 .prompt.sm .word.ar{ font-size:clamp(26px,min(3.6vw,6.2vh),80px) }
.qp.fit1 .prompt{ min-height:0 } .qp.fit1 .sentence{ font-size:clamp(19px,min(2.5vw,4.5vh),52px) } .qp.fit1 .opt{ min-height:clamp(48px,7.6vh,96px) }
.qp.fit1 .slot, .qp.fit1 .tile{ width:clamp(32px,min(3.4vw,6vh),68px); height:clamp(40px,min(4.4vw,7.6vh),86px); font-size:clamp(20px,min(2.3vw,4vh),46px) }
.qp.fit1 .m5-i{ min-height:clamp(40px,5.8vh,72px) } .qp.fit1 .qp-body{ gap:clamp(8px,1.4vh,16px) }
.qp.fit2 .word{ font-size:clamp(28px,min(4.4vw,7vh),96px) } .qp.fit2 .sentence{ font-size:clamp(17px,min(2.1vw,3.8vh),44px) } .qp.fit2 .opt{ min-height:clamp(42px,6.4vh,84px); font-size:clamp(16px,min(1.8vw,3.2vh),36px) }
.qp.fit2 .slot, .qp.fit2 .tile{ width:clamp(28px,min(2.8vw,5vh),58px); height:clamp(36px,min(3.6vw,6.4vh),74px); font-size:clamp(18px,min(2vw,3.4vh),40px) }
.qp.fit2 .m5-i{ min-height:clamp(36px,5vh,62px); font-size:clamp(15px,min(1.6vw,2.8vh),30px) } .qp.fit2 .sb-foot{ display:none }
/* the turn card: before every question, «الآن دور الفريق الأول/الثاني» fills the question panel (same box, same size) */
.turn-card{ position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(4px,1.2vh,14px); padding:16px; text-align:center; cursor:pointer; background:radial-gradient(120% 95% at 50% 22%, color-mix(in srgb, var(--tc) 62%, #0b1a45), color-mix(in srgb, var(--tc) 18%, #081333) 62%, #060d24); transition:opacity .25s ease }
.turn-card.out{ opacity:0; pointer-events:none }
.turn-card .tc-crest svg{ width:clamp(64px,min(8vw,15vh),160px); height:auto; filter:drop-shadow(0 12px 30px rgba(0,0,0,.45)) }
.turn-card .kicker{ color:#fff; opacity:.8; font-size:clamp(.9rem,1.3vw,1.3rem) }
.tc-t{ font-family:var(--f-disp); font-weight:700; font-size:clamp(34px,min(6vw,10vh),112px); line-height:1.15; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.35) }
.tc-n{ font-weight:700; font-size:clamp(22px,min(2.8vw,4.6vh),52px); line-height:1.2; color:#fff; padding:2px 22px; border-radius:99px; background:rgba(6,13,36,.35); border:1px solid rgba(255,255,255,.35) }
.tc-m{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px; max-width:92% }
.tc-m bdi{ padding:2px 14px; border-radius:99px; background:rgba(255,255,255,.14); color:#fff; font-weight:600; font-size:clamp(14px,min(1.5vw,2.6vh),26px); white-space:nowrap }
.tc-hint{ color:rgba(255,255,255,.72); font-size:clamp(12px,1vw,15px) }
.tc-bar{ position:absolute; inset-inline:0; bottom:0; height:6px; background:rgba(255,255,255,.18) }
.tc-bar i{ display:block; height:100%; background:#fff; transform-origin:right; animation:tcBar var(--tcd,1.3s) linear both }
/* toolbar */
.tools{ display:flex; align-items:center; justify-content:center; gap:6px; height:calc(var(--toolh) + env(safe-area-inset-bottom)); padding:0 var(--gutter) env(safe-area-inset-bottom); background:linear-gradient(0deg, rgba(5,11,31,.96), rgba(5,11,31,.72)); border-top:1px solid var(--line); overflow-x:auto; overflow-y:hidden; scrollbar-width:none; flex-wrap:nowrap }
.tools::-webkit-scrollbar{ display:none }
.tool{ display:inline-flex; align-items:center; gap:7px; min-height:44px; min-width:44px; justify-content:center; padding:6px 12px; border-radius:12px; border:1px solid transparent; background:rgba(255,255,255,.05); color:var(--silver); font-size:clamp(14px,1vw,16px); white-space:nowrap; flex:none; transition:background-color .2s, color .2s }
.tool:hover:not([disabled]){ color:var(--white); background:rgba(255,255,255,.11) }
.tool[disabled]{ opacity:.35; cursor:not-allowed }
.tool kbd{ font-family:var(--f-num); font-size:.85rem; padding:0 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted); line-height:1.5 }
.tools-sp{ flex:1; min-width:8px }
.tool.warn{ color:var(--warn); border-color:rgba(255,181,71,.5) }

/* ============ overlays (fade only — nothing scales) ============ */
#layer{ position:fixed; inset:0; z-index:50; pointer-events:none }
.ovl{ position:absolute; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,9,26,.66); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); pointer-events:auto; animation:fadeIn .25s ease both; overflow:auto; overscroll-behavior:contain }
.ovl-card{ position:relative; width:min(780px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg, rgba(22,46,112,.97), rgba(9,21,58,.98)); border:1px solid rgba(201,211,232,.26); border-radius:26px; padding:20px 26px 22px; box-shadow:0 30px 90px rgba(0,0,0,.6); text-align:center; animation:fadeIn .3s ease both }
.ovl-card .kicker{ margin-bottom:2px }
.ovl-card h2.disp{ font-size:clamp(28px,3.4vw,44px); margin-bottom:10px }
.ovl-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px }
.ovl-res.cheer .ovl-card{ border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 80px color-mix(in srgb, var(--tc) 40%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.ovl-res.cheer{ background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 16%, rgba(4,9,26,.62)), rgba(4,9,26,.8)) }
.ovl-res.calm{ background:rgba(4,9,26,.74) }
.ovl-res.calm .ovl-card{ border-color:rgba(201,211,232,.22) }
.res-top{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap }
.res-head{ display:flex; flex-direction:column; align-items:center }
.res-t{ font-family:var(--f-disp); font-weight:700; font-size:clamp(40px,min(5.2vw,9.4vh),100px); line-height:1.1; color:var(--gold); text-shadow:0 8px 40px rgba(242,193,78,.45); animation:fadeIn .5s ease both, glowGold 1.6s ease-in-out .3s 2 }
.is-no .res-t{ color:var(--silver); text-shadow:none; font-size:clamp(34px,min(4.4vw,8vh),84px); animation:fadeIn .45s ease both }
.res-team{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:clamp(18px,min(1.4vw,2.5vh),26px); flex-wrap:wrap }
.res-side{ font-weight:700; padding:0 10px; border-radius:99px; background:color-mix(in srgb, var(--tc) 30%, transparent); border:1px solid var(--tc); font-size:.85em }
.res-name{ font-size:clamp(20px,min(1.6vw,2.9vh),30px); font-weight:700 }
.var-tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:99px; background:rgba(124,196,255,.14); color:var(--flood); font-size:.8rem; font-weight:600 }
.var-tag .ic{ width:14px; height:14px }
.res-score{ display:flex; align-items:center; justify-content:center; gap:10px; margin:12px auto 0; padding:6px 16px; border-radius:14px; background:rgba(6,13,36,.6); width:fit-content; max-width:100% }
.res-score svg{ width:28px; height:auto }
.rs-n{ font-weight:600; white-space:nowrap }
.res-sp{ font-size:2.3rem; font-weight:600; padding:0 6px }
.res-ans{ margin-top:10px; font-size:1.15rem }
.learn{ margin-top:14px; display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-radius:16px; background:rgba(6,13,36,.55); border:1px solid var(--line) }
.learn-w{ display:flex; justify-content:center; align-items:center; gap:10px 14px; flex-wrap:wrap }
.lw{ font-size:clamp(26px,min(3vw,5.4vh),52px); font-weight:700; line-height:1.2 }
.la{ font-size:clamp(20px,min(2.1vw,3.8vh),36px); color:var(--silver); font-weight:500 }
.pos{ font-size:.8rem; padding:2px 10px; border-radius:99px; background:rgba(201,211,232,.12); color:var(--silver) }
.learn-s{ font-size:clamp(16px,min(1.7vw,3vh),28px); color:var(--silver); line-height:1.5 }
.learn-s mark{ background:rgba(242,193,78,.2); color:var(--gold); padding:0 .25em; border-radius:6px; font-weight:600 }
.learn.m5l{ display:grid; grid-template-columns:1fr; gap:4px; text-align:start }
.lp{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:12px; align-items:center; padding:3px 10px; border-radius:10px; background:rgba(255,255,255,.04) }
.lp .lw{ font-size:clamp(17px,min(1.5vw,2.7vh),26px); text-align:left; overflow-wrap:anywhere; min-width:0 }
.lp .la{ font-size:clamp(16px,min(1.4vw,2.5vh),24px); text-align:start; overflow-wrap:anywhere; min-width:0 }
.ht-score{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:6px 0 14px }
.ht-score svg{ width:56px; height:auto }
.ht-score .tl{ font-size:1.25rem }
.sp.big{ font-size:4rem; font-weight:600; padding:0 10px }
.ht-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:start }
.hts{ position:relative; padding:12px 14px 10px; border-radius:14px; background:rgba(6,13,36,.55); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px }
.hts::before{ background:var(--tc) }
.hts .bar{ flex:none; width:100%; margin-top:4px }
.hts .bar > i{ background:var(--tc) }
/* the random-student picker: a name from the team on turn */
.ovl-card.pick-card{ width:min(620px,100%); border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 70px color-mix(in srgb, var(--tc) 35%, transparent), 0 30px 90px rgba(0,0,0,.6) }
.pick-card .kicker{ font-family:var(--f-ui); letter-spacing:0; font-weight:600; font-size:1rem; text-transform:none }
.pk-team{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:4px }
.pk-team svg{ width:44px; height:auto }
.pk-team .tl{ font-size:1.5rem }
.pk-name{ display:grid; place-items:center; height:clamp(96px,18vh,170px); margin:10px 0 4px; padding:0 12px; border-radius:18px; background:rgba(6,13,36,.55); border:1px solid color-mix(in srgb, var(--tc) 50%, transparent); font-weight:700; font-size:clamp(26px,min(3.4vw,6vh),58px); line-height:1.15; color:var(--white); overflow:hidden; text-shadow:0 0 40px color-mix(in srgb, var(--tc) 70%, transparent) }
.pk-name bdi{ display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pk-name.done{ color:var(--gold) }
.ovl-card.pz, .ovl-card.se, .ovl-card.ht{ width:min(640px,100%) }
.ovl-card.se p, .ovl-card.pz p{ margin-bottom:6px }

/* modal */
.modal-bg{ position:fixed; inset:0; z-index:80; background:rgba(4,9,26,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease both }
.modal{ width:min(540px,100%); max-height:calc(100dvh - 32px); overflow:auto; background:linear-gradient(180deg,#16307a,#0b1a45); border:1px solid rgba(201,211,232,.26); border-radius:22px; padding:22px 24px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:fadeIn .25s ease both }
.modal.wide{ width:min(760px,100%) }
.modal h3{ display:flex; align-items:center; gap:10px; font-family:var(--f-disp); font-weight:600; font-size:1.4rem; margin-bottom:12px }
.modal h3 .ic{ color:var(--flood); width:24px; height:24px }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px }
.confirm-t{ font-size:1.08rem; line-height:1.7 }
.var-box{ display:flex; flex-direction:column; gap:8px; border-inline-start:4px solid var(--tc); padding-inline-start:14px }
.var-now{ font-size:1.15rem }
.var-now .ic{ display:inline; width:18px; height:18px; vertical-align:-3px }
.bk{ display:grid; gap:18px }
.bk section{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:var(--r); background:rgba(6,13,36,.45); border:1px solid var(--line) }
.bk h4{ font-size:1.05rem }
.bk textarea{ width:100%; border-radius:12px; border:1px solid var(--line); background:rgba(6,13,36,.7); padding:10px; resize:vertical; min-height:90px }
.file-btn{ position:relative; cursor:pointer }
.file-btn:focus-within{ outline:3px solid var(--flood); outline-offset:3px }
/* storage warning (autosave unavailable / failed) */
.warn-bar{ position:relative; z-index:6; display:flex; align-items:center; justify-content:center; gap:10px 14px; flex-wrap:wrap; padding:8px var(--gutter); background:rgba(255,181,71,.15); border-bottom:1px solid rgba(255,181,71,.5); color:#ffe2b8; font-size:.92rem; line-height:1.5; text-align:center }
.warn-bar > .ic{ color:var(--warn) }
.warn-bar .btn{ min-height:38px; padding:.3em .9em; font-size:.88rem }
html.in-match .warn-bar{ display:none }
.kbd-hint kbd{ font-size:.92em; padding:0 6px }
/* toasts */
#toasts{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(560px, calc(100% - 32px)) }
.toast{ padding:10px 18px; border-radius:14px; background:rgba(11,26,69,.97); border:1px solid var(--line); box-shadow:var(--shadow); animation:fadeIn .3s ease both; font-weight:500; text-align:center; transition:opacity .3s }
.toast.good{ border-color:rgba(47,208,122,.6) } .toast.bad{ border-color:rgba(255,90,106,.65) }
.toast.out{ opacity:0 }

/* ============ full time ============ */
.v-ft{ padding-top:clamp(18px,4vh,40px); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center }
.ft-head h1{ font-size:clamp(34px,4vw,54px) }
.ft-score{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:clamp(12px,3vw,40px); width:min(1040px,100%); margin-top:6px }
.ft-team{ display:flex; align-items:center; gap:16px; min-width:0 }
.ft-team.b{ flex-direction:row-reverse }
.ft-team svg{ width:clamp(60px,7vw,96px); height:auto; flex:none }
.ft-t{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:start; min-width:0 }
.ft-team.b .ft-t{ align-items:flex-end; text-align:end }
.ft-team .tl{ font-family:var(--f-disp); font-size:clamp(20px,2.4vw,36px) }
.ft-team.win .tl{ color:var(--gold) }
.ft-team.b .mem{ justify-content:flex-end }
.ft-nums{ display:flex; align-items:center; gap:12px; padding:8px 26px 0; border-radius:20px; background:linear-gradient(180deg,#1a3480,#0b1a45); border:1px solid rgba(201,211,232,.26); box-shadow:var(--shadow) }
.ft-nums .n{ font-family:var(--f-num); font-weight:600; font-size:clamp(64px,8vw,112px); line-height:1; min-width:.7em; font-variant-numeric:tabular-nums }
.ft-nums .dash{ font-family:var(--f-num); font-size:3rem; opacity:.5 }
.n.reveal-pop{ animation:fadeIn .6s ease both; color:var(--gold) }
.ft-chain{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 10px; font-size:.95rem; color:var(--silver) }
.ft-chain span{ display:inline-flex; align-items:center; gap:6px; padding:2px 12px; border-radius:99px; background:rgba(6,13,36,.55); border:1px solid var(--line) }
.ft-chain span.cur{ border-color:rgba(242,193,78,.6); color:var(--white) }
.ft-chain .sp{ font-size:1.3rem; color:var(--white) }
.ft-note{ max-width:680px; color:var(--silver); font-size:.95rem; line-height:1.75; margin-top:6px }
.ft-result{ display:flex; flex-direction:column; align-items:center; gap:6px; transition:opacity .5s }
.ft-result.pending, .ft-tbl.pending{ opacity:0; pointer-events:none }
.rl{ display:inline-flex; align-items:center; gap:8px; font-family:var(--f-disp); font-size:clamp(22px,2.4vw,32px); font-weight:600 }
.rl.win{ color:var(--gold) }
.rl .ic{ width:28px; height:28px }
.ft-points{ color:var(--silver) }
.ft-points .nr{ color:var(--gold); font-family:var(--f-disp) }
.ft-points .ic{ display:inline; width:18px; height:18px; vertical-align:-3px; color:var(--gold) }
.ft-points.gold{ color:var(--gold); font-weight:600; display:flex; align-items:center; gap:6px }
.tie-card{ width:min(980px,100%); display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 22px; border-radius:24px; text-align:center; background:radial-gradient(120% 160% at 50% 0%, rgba(242,193,78,.24), rgba(19,41,106,.94) 60%); border:1px solid rgba(242,193,78,.75); box-shadow:0 0 0 1px rgba(242,193,78,.25), 0 0 50px rgba(242,193,78,.18) }
.tie-card .kicker{ color:var(--gold) }
.tie-card h2{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; font-size:clamp(24px,2.6vw,36px); line-height:1.35 }
.tie-card h2 .ic{ color:var(--gold); width:32px; height:32px }
.tie-card p{ color:var(--silver); max-width:720px; line-height:1.7 }
.tie-card p b{ color:var(--white) }
.ft-tbl{ width:min(860px,100%); transition:opacity .5s }
.ft-rounds{ width:100%; border-collapse:collapse; min-width:480px }
.ft-rounds th{ padding:10px; font-weight:500; color:var(--silver); font-size:.88rem; border-bottom:1px solid var(--line); background:rgba(6,13,36,.35) }
.ft-rounds th bdi{ font-weight:600; color:var(--white) }
.ft-rounds td{ padding:8px 10px; border-bottom:1px solid var(--line) }
.ft-rounds tr:last-child td{ border-bottom:0 }
.ft-rounds td.rn{ font-family:var(--f-num); font-size:1.3rem; color:var(--muted); width:40px }
.ft-rounds td.rt{ text-align:start; white-space:nowrap }
.cat-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--cc); margin-inline-end:8px }
.ft-rounds td.ok, .ft-rounds td.no{ white-space:nowrap }
.rc{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; margin-inline-end:8px; vertical-align:middle }
.rc .ic{ width:15px; height:15px }
td.ok .rc{ background:var(--good); color:#032012 } td.no .rc{ background:rgba(255,90,106,.25); color:var(--bad) }
.rw{ font-weight:500 }
.ft-rounds small{ display:inline-block; margin-inline-start:6px; color:var(--muted); font-size:.75rem }
.var-s{ color:var(--flood)!important }
.ft-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px }

/* ============ ceremony: the podium ============ */
.v-champ{ position:relative; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px var(--gutter); overflow:hidden }
#fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2 }
.v-champ .beam{ background:linear-gradient(180deg, rgba(255,224,138,.28), rgba(242,193,78,.05) 55%, transparent 80%) }
.cer{ position:relative; z-index:1; width:min(1240px,100%); display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.3vh,18px); text-align:center }
.cer-h .kicker{ color:var(--gold) }
.cer-h .seal-svg{ height:clamp(56px,9vh,96px); width:auto; margin:0 auto 4px }
.champ-title{ font-family:var(--f-disp); font-weight:700; font-size:clamp(30px,min(4vw,7vh),58px); color:var(--gold); line-height:1.2 }
.cer-name{ color:var(--silver); margin-top:2px }
.podium{ list-style:none; margin:4px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end; gap:clamp(10px,1.6vw,22px); width:min(1120px,100%) }
.pod{ display:flex; flex-direction:column; align-items:center; min-width:0 }
.pod-who{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding-bottom:8px; min-width:0; max-width:100%; animation:rise 1s var(--ease) both }
.pod.p0 .pod-who{ animation-delay:.5s } .pod.p1 .pod-who{ animation-delay:.25s }
.pod-who .medal{ width:clamp(34px,min(4vw,6vh),56px); height:auto; filter:drop-shadow(0 6px 12px rgba(0,0,0,.4)) }
.pod.p0 .pod-who .medal{ width:clamp(42px,min(5vw,7.6vh),70px) }
.pod-who .crest{ width:clamp(48px,min(5vw,8.4vh),84px); height:auto; filter:drop-shadow(0 10px 26px color-mix(in srgb, var(--tc) 55%, transparent)) }
.pod.p0 .pod-who .crest{ width:clamp(62px,min(6.6vw,11vh),112px) }
.pod-who .tl{ font-family:var(--f-disp); font-size:clamp(18px,min(1.8vw,3.2vh),30px); max-width:100% }
.pod.p0 .pod-who .tl{ font-size:clamp(22px,min(2.3vw,4vh),38px); color:var(--gold) }
.pod-who .mem{ justify-content:center; font-size:clamp(12px,min(1.05vw,1.9vh),17px); gap:0 12px }
.pod-step{ width:100%; display:flex; flex-direction:column; align-items:center; gap:0; padding-top:8px; border-radius:18px 18px 6px 6px; box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 20px 40px rgba(0,0,0,.35); animation:fadeIn .9s ease both }
.pod.p0 .pod-step{ height:clamp(70px,14vh,170px); background:linear-gradient(180deg,#ffe9a8,#e2a82c 45%,#a8761a) }
.pod.p1 .pod-step{ height:clamp(54px,10vh,124px); background:linear-gradient(180deg,#ffffff,#c9d3e8 45%,#7d88a8) }
.pod.p2 .pod-step{ height:clamp(44px,7.4vh,96px); background:linear-gradient(180deg,#ffd9b0,#cd8a4b 45%,#8a5226) }
.pod-n{ font-family:var(--f-num); font-weight:600; font-size:clamp(28px,min(4vw,6vh),64px); line-height:1; color:rgba(11,26,69,.85); padding-top:.1em }
.pod.p2 .pod-step{ flex-direction:row; justify-content:center; align-items:center; gap:8px; padding-top:0 }
.pod-step em{ font-style:normal; font-size:clamp(11px,.95vw,14px); font-weight:700; color:rgba(11,26,69,.85) }
.podium.two{ grid-template-columns:repeat(2,minmax(0,1fr)); width:min(760px,100%) }
.pod.tbd .pod-who{ opacity:.55 }
.pod-wait{ color:var(--muted); font-size:.9rem; line-height:1.5; max-width:220px }
.congrats{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; padding:10px 24px; border-radius:99px; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--cc) 35%, rgba(11,26,69,.9)), transparent); font-family:var(--f-disp); font-weight:600; font-size:clamp(18px,1.9vw,28px); text-shadow:0 0 24px color-mix(in srgb, var(--cc) 80%, transparent); box-shadow:0 0 50px color-mix(in srgb, var(--cc) 22%, transparent) }
.congrats .ic{ color:var(--gold); width:22px; height:22px } .congrats b{ font-family:var(--f-num); font-size:1.35em; font-weight:600; line-height:1 }
.promise{ color:var(--gold); font-weight:500; font-size:clamp(15px,1.3vw,19px) }
.champ-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px }

/* ============ certificates ============ */
.cert-pick{ margin:0 auto 12px; justify-content:center } .cert-pick .seg-b{ display:inline-flex; align-items:center; gap:6px }
.cert-tools{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; margin:-6px 0 12px }
.v-cert .topbar{ margin-bottom:12px; padding:10px 0 }
.note{ display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:.92rem; border-radius:14px; background:rgba(124,196,255,.1); border:1px solid rgba(124,196,255,.35); max-width:760px }
.note .ic{ color:var(--flood); flex:none }
.cert-wrap{ display:flex; justify-content:center }
.cert{ position:relative; width:min(1100px, 100%, calc((100vh - 260px) * 1.4143)); aspect-ratio:297/210; container-type:inline-size; background:radial-gradient(ellipse at 50% 30%, #fffdf6, #f6f0df 70%, #eee4c8); color:#0b1a45; border-radius:6px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); font-family:var(--f-ui); -webkit-print-color-adjust:exact; print-color-adjust:exact }
.cert-frame{ position:absolute; inset:2.2cqw; border:.35cqw solid #0b1a45; outline:.18cqw solid #c8931e; outline-offset:-.9cqw; border-radius:.4cqw }
.cc{ position:absolute; width:5cqw; height:5cqw; border:.35cqw solid #c8931e }
.cc.c1{ top:1.2cqw; right:1.2cqw; border-left:0; border-bottom:0 } .cc.c2{ top:1.2cqw; left:1.2cqw; border-right:0; border-bottom:0 }
.cc.c3{ bottom:1.2cqw; right:1.2cqw; border-left:0; border-top:0 } .cc.c4{ bottom:1.2cqw; left:1.2cqw; border-right:0; border-top:0 }
.cert-wm{ position:absolute; inset:0; display:grid; place-items:center; opacity:.06; pointer-events:none }
.cert-wm img{ width:34cqw; height:auto }
.cert-in{ position:absolute; inset:4.3cqw 6cqw; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:space-between }
.cert-top{ display:flex; align-items:center; justify-content:space-between; width:100% }
.cert-side{ width:30cqw; display:flex; flex-direction:column; align-items:center; gap:.3cqw }
.cert-side b{ font-family:var(--f-disp); font-size:2.5cqw; font-weight:700; color:#0b1a45; line-height:1.25 }
.cert-side span{ font-size:1.45cqw; color:#43507a }
.cert-seal img{ width:11.5cqw; height:auto; filter:drop-shadow(0 .4cqw .9cqw rgba(11,26,69,.28)) }
.cert-kicker{ font-family:var(--f-num); letter-spacing:.3em; font-size:1.25cqw; color:#b07d12 }
.cert-title{ font-family:var(--f-disp); font-weight:700; font-size:5.2cqw; line-height:1.1; background:linear-gradient(180deg,#0b1a45,#1d3a8a); -webkit-background-clip:text; background-clip:text; color:transparent }
.cert-head{ font-family:var(--f-disp); font-weight:600; font-size:2.35cqw; line-height:1.45; color:#b07d12; max-width:88% }
.cert.pl1 .cert-head{ color:#5d6b8f } .cert.pl2 .cert-head{ color:#8a5226 }
.cert-text{ font-size:1.9cqw; line-height:1.55; color:#1c2a55 }
.cert-text b{ color:#0b1a45 }
.cert-team{ display:flex; align-items:center; gap:1.4cqw }
.cert-team svg{ width:5cqw; height:auto }
.cert-team b{ font-family:var(--f-disp); font-size:4cqw; line-height:1.15; font-weight:700; color:#0b1a45 }
.cert-mem{ display:flex; flex-wrap:wrap; justify-content:center; gap:.4cqw 1.6cqw; max-width:90%; font-weight:700; font-size:2.05cqw; color:#0b1a45; border-bottom:.2cqw solid #c8931e; padding:0 2cqw .5cqw }
.cert-mem bdi{ white-space:nowrap }
.cert-date{ font-size:1.55cqw; color:#43507a }
.cert-sign{ display:grid; grid-template-columns:1fr auto 1fr; align-items:end; width:100%; gap:3cqw }
.sg{ display:flex; flex-direction:column; align-items:center; gap:.4cqw; font-size:1.5cqw }
.sg span{ color:#43507a }
