<style>
/* ============ tokens (single deliberate dark "stadium at night" theme) ============ */
:root{
  color-scheme: dark;
  --night:#060d24; --navy:#0b1a45; --navy-2:#13296a; --line:rgba(201,211,232,.16);
  --silver:#c9d3e8; --white:#f5f7ff; --flood:#7cc4ff; --gold:#f2c14e;
  --pitch-a:#0e4a2e; --pitch-b:#115a37;
  --good:#2fd07a; --bad:#ff5a6a; --warn:#ffb547;
  --glass: rgba(11,26,69,.78); --glass-2: rgba(19,41,106,.55); --glass-3: rgba(6,13,36,.55);
  --muted: rgba(201,211,232,.74);
  --f-ui: 'Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic','Noto Sans',Arial,sans-serif;
  --f-disp: 'Reem Kufi','Readex Pro','Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  --f-num: 'Teko','Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --r-l: 22px; --r: 16px; --r-s: 12px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter: clamp(16px, 2.4vw, 32px);
}
@supports (background: color-mix(in srgb, red 50%, transparent)){
  :root{ --glass: color-mix(in srgb, var(--navy) 78%, transparent); --glass-2: color-mix(in srgb, var(--navy-2) 55%, transparent); --glass-3: color-mix(in srgb, var(--night) 55%, transparent); }
}
*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--night) }
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--white); font-family:var(--f-ui); font-size:17px; line-height:1.6;
  background-color:var(--night);
  background-image: radial-gradient(120% 80% at 50% -12%, #16307a 0%, #0d1f55 30%, #081333 58%, #060d24 80%);
  background-attachment: fixed; overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none }
#app{ position:relative; z-index:1; min-height:100vh; min-height:100dvh }

button, input, textarea, select{ font:inherit; color:inherit }

svg{ display:block }
h1,h2,h3,h4{ line-height:1.25; margin:0 }

/* ============ buttons ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.55em; min-height:48px; padding:.55em 1.2em; border-radius:14px; border:1px solid var(--line); background:var(--glass-2); color:var(--white); font-weight:600; font-size:1rem; line-height:1.2; text-decoration:none; transition: transform .15s var(--ease), background-color .2s, border-color .2s, box-shadow .2s, opacity .2s; white-space:nowrap }

/* ============ panels & layout ============ */

/* topbar */
.topbar{ display:flex; align-items:center; gap:16px; padding:16px 0 14px; margin-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap }

.tb-title{ flex:1; font-family:var(--f-disp); font-weight:600; font-size:clamp(1.3rem,2vw,1.7rem); text-align:center; min-width:160px }
.tb-act{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }

/* ============ home ============ */
.v-home{ position:relative; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,3vh,30px); padding:28px var(--gutter) 28px; text-align:center; overflow:hidden }
.beams{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:-1 }

.cat-strip{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; width:min(1180px,100%) }

/* ============ setup ============ */
.setup-grid{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start }
.setup-col{ display:flex; flex-direction:column; gap:18px; min-width:0 }
.class-rows{ display:flex; flex-direction:column; gap:10px }
.class-row{ position:relative; display:grid; grid-template-columns:auto minmax(92px,1fr) auto auto 88px auto; gap:10px 12px; align-items:end; padding:10px 12px 6px; border-radius:var(--r); background:var(--glass-3); border:1px solid var(--line); border-inline-start:4px solid var(--cc) }
.cr-crest svg{ width:44px; height:auto; display:block }

.grp-names[open] .chev{ transform:rotate(180deg) }
.gn-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; padding:4px 0 8px }
.gn{ display:flex; flex-direction:column; gap:3px }
.gn > span{ font-size:.74rem; color:var(--muted) }

.groups-total{ margin-top:12px; font-size:1.02rem; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px }

.draw-modes{ display:flex; flex-direction:column; gap:6px }

.dm[disabled]{ opacity:.4; cursor:not-allowed }

.budget.good{ color:var(--muted); padding-inline:0 } .budget.good .ic{ color:var(--good) }
.fld{ display:flex; flex-direction:column; gap:4px; min-width:0 }
.fld > span{ font-size:.78rem; color:var(--muted) }
.fld input{ width:100%; min-height:44px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(6,13,36,.6); font-weight:600; font-size:1.05rem }
.fld input:focus{ border-color:var(--flood); outline:none; box-shadow:0 0 0 3px rgba(124,196,255,.25) }

.sw.on{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.25) }
.sw::after{ content:''; position:absolute; inset:-10px } /* larger hit area */

.field:last-child{ margin-bottom:0 }
.field-l{ font-weight:600; font-size:.95rem }
.field-h{ color:var(--muted); font-size:.8rem }
