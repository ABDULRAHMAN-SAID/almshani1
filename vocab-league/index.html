AFTER.ft = () => {
  const m = curMatch();
  if (S.ftReveal && S.ftFresh && m) {
    const el = $(m.present === m.a ? '#ft-a' : '#ft-b');
    if (el) {
      SFX.roll();
      later(() => { el.textContent = el.dataset.v; el.classList.add('reveal-pop'); SFX.whistle(true); $('#ft-result') && $('#ft-result').classList.remove('pending'); announce('النتيجة النهائية ' + $('#ft-a').textContent + ' مقابل ' + $('#ft-b').textContent); }, reduced() ? 300 : 1600);
    }
  }

/* ---------- Champion & certificate ---------- */
VIEWS.champion = () => {
  if (!T || !T.championId) return VIEWS.hub();

/* ============================ 14. MATCH ENGINE ============================ */
let Q = null; // the live question: { ctx, m, idx, st, q, team, answered, paused, sb, m5 }
const TM = { raf: 0, total: 0, left: 0, last: 0, running: false, onEnd: null, sec: -1, speed: 1, fg: null, tx: null, ring: null };
const RING_C = 175.93;
function timerStart(secs, onEnd) {
  timerStop();
  TM.total = secs * 1000; TM.left = TM.total; TM.sec = -1; TM.fg = $('#ring-fg'); TM.tx = $('#ring-t'); TM.ring = $('#ring');
  if (!secs) return;
  TM.onEnd = onEnd; TM.running = true; TM.last = performance.now(); drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function timerTick(now) {
  if (!TM.running) return;
  const dt = Math.min(250, Math.max(0, now - TM.last)); TM.last = now; TM.left -= dt * TM.speed;
  if (TM.left <= 0) { TM.left = 0; TM.running = false; drawTimer(); const f = TM.onEnd; TM.onEnd = null; if (f) f(); return; }
  drawTimer(); TM.raf = requestAnimationFrame(timerTick);
}
function drawTimer() {
  if (!TM.fg || !TM.tx) return;
  TM.fg.style.strokeDashoffset = (RING_C * (1 - (TM.total ? TM.left / TM.total : 0))).toFixed(2);
  const s = Math.ceil(TM.left / 1000);
  if (s !== TM.sec) { TM.sec = s; TM.tx.textContent = s; const low = s <= 5; TM.ring.classList.toggle('low', low); if (low && s > 0 && TM.running) SFX.tick(); }
}
function timerPause() { if (!TM.running) return; TM.running = false; cancelAnimationFrame(TM.raf); }
function timerResume() { if (TM.running || TM.left <= 0 || !TM.total || !TM.onEnd) return; TM.running = true; TM.last = performance.now(); TM.raf = requestAnimationFrame(timerTick); }
function timerStop() { TM.running = false; cancelAnimationFrame(TM.raf); TM.onEnd = null; }

function curMatch() { if (S.matchId === 'demo') return S.demo; return T ? T.matches.find((m) => m.id === S.matchId) || null : null; }
function persist(m) { if (m && !m.demo) saveT(); }
const timerMult = (m) => (m && m.demo ? 1 : T ? T.settings.timer : 1);
function refreshBoard(m, bumpTeam) {
  const w = $('#sb-wrap'); if (!w) return;
  w.innerHTML = scoreboardHTML(m);
  if (bumpTeam) { const el = $(bumpTeam === m.a ? '#sc-a' : '#sc-b'); if (el) el.classList.add('bump'); }
}
function updateToolbar() {
  const v = $('#tools [data-act="var"]'); if (v) v.disabled = !lastAnswered();
  const say = $('#tools [data-act="say"]'); if (say) say.disabled = !sayable();
  const rv = $('#tools [data-act="reveal"]'); if (rv) rv.disabled = !(Q && !Q.answered);
  const pk = $('#tools [data-act="picker"]'); if (pk) pk.disabled = !(Q && !Q.answered);
  const pz = $('#tools [data-act="pause"]'); if (pz) pz.disabled = !Q;
}

/* decides what the match view shows next */
function flow() {
  const m = curMatch(); if (!m || !m.seq) { go(T ? 'hub' : 'home'); return; }
  hideLayer('res');
  if (m.status === 'done' || m.status === 'pens') { finishMatch(m); return; }
  if (m.status === 'wait') { Q = null; refreshBoard(m); $('#qzone').innerHTML = ''; updateToolbar(); showLayer('split', splitEndHTML(m)); SFX.whistle(true); return; }
  const H = halfStep(m);
  if (H > 0 && m.step === H && !m.half) { Q = null; refreshBoard(m); $('#qzone').innerHTML = ''; updateToolbar(); showLayer('half', halftimeHTML(m)); SFX.whistle(true); return; }
  ask(m);

const FX = { raf: 0 };
function startConfetti(colors) {

  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const P = Array.from({ length: 170 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.7, vx: (Math.random() - 0.5) * 2.4, vy: 1.4 + Math.random() * 3, s: 6 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.25, c: pick(colors) }));

  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.round((W * H) / 8500);

function parseCustom(text) {

    else if (w.length > 24) row.err = 'الكلمة طويلة جدًا';
    else if (!ar) row.err = 'المعنى فارغ';
    else if (seen.has(w)) row.err = 'الكلمة مكررة';
    if (!row.err && s) {

      else {

}

    ok.forEach((r) => CUSTOM.push({ w: r.w, ar: r.ar, s: r.s })); saveCustom();
    S.cwText = ''; S.cwPreview = null; toast(`تم حفظ ${ok.length} كلمة في «كلماتي»`, 'good'); S.bankOpen.custom = true; go('bank');
    const el = $('#my-words'); if (el) el.scrollIntoView({ block: 'start' });
  },
  'cw-del': (el) => { const i = +el.dataset.i, c = CUSTOM[i]; if (!c) return; confirmModal(`حذف الكلمة ${en(c.w)} من «كلماتي»؟`, 'حذف', () => { CUSTOM.splice(i, 1); saveCustom(); go('bank'); const e2 = $('#my-words'); if (e2) e2.scrollIntoView({ block: 'start' }); }); },
  'cw-clear': () => confirmModal('حذف جميع «كلماتي» نهائيًا؟', 'حذف الكل', () => { CUSTOM = []; saveCustom(); go('bank'); }),
  /* backup */
  'bk-copy': () => {
    const json = backupJSON(), out = $('#bk-out');
    const fallback = () => { if (out) { out.hidden = false; out.value = json; out.focus(); out.select(); } toast('تعذّر النسخ التلقائي — الرمز محدد، انسخه يدويًا (Ctrl+C)'); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(() => toast('تم نسخ رمز النسخة', 'good'), fallback); else fallback(); } catch (e) { fallback(); }
  },
  'bk-download': () => { try { const blob = new Blob([backupJSON()], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vocab-league-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch (e) { toast('تعذّر التنزيل', 'bad'); } },
  'bk-restore': () => restoreFrom(($('#bk-in') || {}).value),
};
function rerenderSetup() { const y = window.scrollY; go('setup'); window.scrollTo(0, y); }
const INP = {
  'team-name': (el) => { const i = +el.dataset.i, t = S.setup.teams[i]; if (!t) return; t.name = el.value; const c = $('#tr-crest-' + i); if (c) c.innerHTML = crestSVG(t, 46, 's' + i); },
  'team-students': (el) => { const t = S.setup.teams[+el.dataset.i]; if (t) t.students = clamp(parseInt(el.value, 10) || 1, 1, 99); },
  'bank-q': (el) => { S.bankQ = el.value; clearTimeout(INP._bt); INP._bt = setTimeout(bankFilter, 120); },
  'cw-in': (el) => { S.cwText = el.value; },
};
const CHG = {
  type: (el) => { const s = S.setup; s.types = el.checked ? uniq(s.types.concat(el.value)) : s.types.filter((t) => t !== el.value); s.types = TYPE_IDS.filter((t) => s.types.includes(t)); },
  unit: (el) => { const s = S.setup; s.units = el.checked ? uniq(s.units.concat(el.value)) : s.units.filter((u) => u !== el.value); const w = $('#words-total'); if (w) w.innerHTML = wordsTotalHTML(); },
  'team-students': (el) => { const t = S.setup.teams[+el.dataset.i]; if (t) { t.students = clamp(parseInt(el.value, 10) || 35, 1, 99); el.value = t.students; } },
  'bk-file': (el) => { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const ta = $('#bk-in'); if (ta) ta.value = String(rd.result || ''); toast('تم تحميل الملف — اضغط «استعادة»'); }; rd.onerror = () => toast('تعذّرت قراءة الملف', 'bad'); rd.readAsText(f); },
};
document.addEventListener('click', (e) => {
  const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  audioInit(); fn(el, e);
});
document.addEventListener('input', (e) => { const k = e.target && e.target.dataset ? e.target.dataset.in : null; if (k && INP[k]) INP[k](e.target, e); });
document.addEventListener('change', (e) => { const k = e.target && e.target.dataset ? e.target.dataset.in : null; if (k && CHG[k]) CHG[k](e.target, e); });
document.addEventListener('pointerdown', () => audioInit(), { passive: true, capture: true });
document.addEventListener('toggle', (e) => { const d = e.target; if (d && d.matches && d.matches('details.unit')) S.bankOpen[d.dataset.unit] = d.open; }, true);
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, tag = tg && tg.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable);
  const k = e.key, lk = k.length === 1 ? k.toLowerCase() : k, onBtn = tag === 'BUTTON' || tag === 'SUMMARY' || tag === 'A';
  audioInit();
  if (MODAL.open) { if (k === 'Escape') { e.preventDefault(); closeModal(); } return; }
  if (typing) return;
  const top = topLayer(), inGame = S.view === 'match' || S.view === 'pens';
  if (top) {
    if (top === 'picker') { if (k === 'Escape' || ((k === 'Enter' || k === ' ') && !onBtn)) { e.preventDefault(); closePicker(); } return; }
    if (top === 'pause') { if (k === 'Escape' || ((k === 'Enter' || k === ' ') && !onBtn)) { e.preventDefault(); resumeGame(); } else if (lk === 'm') setMuted(!PREFS.muted); else if (lk === 'f' && FS_OK) toggleFS(); return; }
    if ((k === 'Enter' || k === ' ') && !onBtn) { const b = $('#btn-next'); if (b) { e.preventDefault(); b.click(); } return; }
    if (lk === 'p' && top === 'res') { sayCurrent(); return; }
    if (lk === 'm') setMuted(!PREFS.muted); else if (lk === 'f' && FS_OK) toggleFS();
    return;
  }
  if (inGame && Q && !Q.answered && !Q.paused) {
    if (Q.sb) {
      if (/^[a-z]$/.test(lk)) { e.preventDefault(); sbType(lk); return; }
      if (k === 'Backspace') { e.preventDefault(); sbBack(); return; }
      if (k === 'Enter' && !onBtn) { e.preventDefault(); sbCheck(); return; }
    }
    if (/^[1-9]$/.test(k) && Q.q.opts && Q.q.type !== 'match5') { e.preventDefault(); chooseOpt(+k - 1); return; }
    if (k === 'Enter' && !onBtn && Q.m5) { e.preventDefault(); m5Check(); return; }
  }
  if (inGame) {
    if (k === 'Escape') { e.preventDefault(); if (Q) (Q.paused ? resumeGame() : pauseGame()); return; }
    if (lk === 'p') { sayCurrent(); return; }
    if (lk === 'r') { openPicker(); return; }
  }
  if (lk === 'm') { setMuted(!PREFS.muted); return; }
  if (lk === 'f' && FS_OK) { toggleFS(); return; }
  if ((k === 'Enter' || k === ' ') && !onBtn && S.view === 'ft') { const b = $('#btn-next'); if (b) { e.preventDefault(); b.click(); } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && Q && !Q.answered && !Q.paused && !topLayer()) pauseGame(); });
let RESIZE_T = 0;
window.addEventListener('resize', () => { clearTimeout(RESIZE_T); RESIZE_T = setTimeout(() => { drawSky(); if (Q && Q.m5) { m5Measure(); m5Draw(); } }, 150); });
if (MQ_REDUCED && MQ_REDUCED.addEventListener) MQ_REDUCED.addEventListener('change', () => document.documentElement.classList.toggle('rm', reduced()));

/* ============================ 16. INIT + TEST HOOK ============================ */
function init() {
  document.documentElement.classList.toggle('rm', reduced());
  loadCustom(); T = loadT();
  drawSky();
  if (T && T.cur) {
    const m = T.matches.find((x) => x.id === T.cur);
    if (m && m.status === 'live' && m.seq) { S.matchId = m.id; S.resumePaused = true; go('match'); }
    else if (m && (m.status === 'done' || m.status === 'pens')) { T.cur = null; saveT(); S.matchId = m.id; S.ftFresh = false; S.ftReveal = false; go('ft'); }
    else { T.cur = null; saveT(); go(m ? 'hub' : 'home'); }
  } else go('home');
  if (LOAD_WARN) toast(LOAD_WARN, 'bad');
  if (SPEECH_OK) { try { window.speechSynthesis.getVoices(); } catch (e) { /* warm up voices */ } }
}
window.VCL = {
  version: APP_VERSION,
  getState() {
    return JSON.parse(JSON.stringify({ view: S.view, tab: S.tab, matchId: S.matchId, layer: topLayer(), modal: MODAL.open, paused: !!(Q && Q.paused), tournament: T, demo: S.demo, prefs: PREFS, custom: CUSTOM, timerSpeed: TM.speed }));
  },
  currentQuestion() {
    if (!Q) return null;
    const q = Q.q, out = JSON.parse(JSON.stringify(q));
    out.ctx = Q.ctx; out.matchId = Q.m.id; out.step = Q.idx; out.team = Q.team; out.answered = Q.answered; out.paused = Q.paused;
    out.timeLeft = TM.total ? Math.round(TM.left) : null;
    out.answer = q.type === 'spell_build' ? q.target : q.type === 'match5' ? q.ans.slice() : q.ans;
    if (Q.sb) out.slots = Q.sb.slots.slice();
    if (Q.m5) out.links = Q.m5.L.slice();
    return out;
  },
  fastTimers(f) { TM.speed = f > 0 ? f : 1; return TM.speed; },
  test: {
    gen(type) {
      const all = allEntries(), el = all.filter((e) => eligible(type, e));
      if (type === 'match5') { const P = makePicker(all, new Set()); const g = P.five(1 + rnd(3), 1); return g ? genMatch5(g[0]) : null; }
      return genQuestion(type, pick(el), [all]);
    },
    genFor(type, w) { const all = allEntries(), e = all.find((x) => x.w === w); return e ? genQuestion(type, e, [all]) : null; },
    entries: () => allEntries(),
    bankWords: () => Array.from(bankWords()),
    planLineup: (types, R) => planLineup(types, R),
    levelFor: (r, R) => levelFor(r, R),
    standings: () => standings(),
    parseCustom: (t) => parseCustom(t),
    pensTally: (m) => pensTally(m),
    misspellings: (w) => misspellings(w),
  },
};
init();

</script>
